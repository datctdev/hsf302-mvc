<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Đổi Mật Khẩu - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-xl shadow-card p-8">
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-slate-900">Đổi Mật Khẩu</h1>
                    <p class="text-slate-600 mt-1">Vui lòng nhập thông tin để đổi mật khẩu</p>
                </div>

                <div class="space-y-3 mb-6">
                    <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>
                    <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
                </div>

                <form id="changePasswordForm" th:action="@{/auth/change-password}" method="post" th:object="${changePasswordRequest}" class="space-y-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div>
                        <label for="currentPassword" class="block text-sm font-medium text-slate-700 mb-1">Mật Khẩu Hiện Tại *</label>
                        <input type="password" id="currentPassword" th:field="*{currentPassword}" required
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="text-sm text-red-600 mt-1 block"></span>
                    </div>

                    <div>
                        <label for="newPassword" class="block text-sm font-medium text-slate-700 mb-1">Mật Khẩu Mới *</label>
                        <input type="password" id="newPassword" th:field="*{newPassword}" required
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-sm text-red-600 mt-1 block"></span>
                        <small class="text-slate-500 text-xs mt-1 block">Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường và số</small>
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1">Xác Nhận Mật Khẩu Mới *</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-sm text-red-600 mt-1 block"></span>
                    </div>

                    <button type="submit" id="changePasswordBtn"
                            class="w-full bg-primary-500 text-white rounded-lg py-2.5 font-medium hover:bg-primary-600 focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition">
                        Đổi Mật Khẩu
                    </button>
                </form>

                <p class="mt-6 text-center text-slate-600 text-sm">
                    <a th:href="@{/profile}" class="no-underline text-primary-600 hover:underline font-medium">Quay lại trang hồ sơ</a>
                </p>
            </div>
        </div>
    </th:block>
</body>
</html>
