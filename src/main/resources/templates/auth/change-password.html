<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Đổi Mật Khẩu - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-md mx-auto">
            <div class="card bg-base-100 shadow-card border border-base-200">
                <div class="card-body">
                    <div class="mb-2">
                        <h1 class="card-title text-2xl">Đổi Mật Khẩu</h1>
                        <p class="text-base-content/70 mt-1">Vui lòng nhập thông tin để đổi mật khẩu</p>
                    </div>

                    <div class="space-y-3 mb-4">
                        <div th:if="${success}" class="alert alert-success text-sm" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-error text-sm" th:text="${error}"></div>
                    </div>

                    <form id="changePasswordForm" th:action="@{/auth/change-password}" method="post" th:object="${changePasswordRequest}" class="space-y-4">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="form-control">
                            <label for="currentPassword" class="label"><span class="label-text">Mật Khẩu Hiện Tại *</span></label>
                            <input type="password" id="currentPassword" th:field="*{currentPassword}" required class="input input-bordered w-full">
                            <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="label text-error text-sm mt-1"></span>
                        </div>
                        <div class="form-control">
                            <label for="newPassword" class="label"><span class="label-text">Mật Khẩu Mới *</span></label>
                            <input type="password" id="newPassword" th:field="*{newPassword}" required class="input input-bordered w-full">
                            <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="label text-error text-sm mt-1"></span>
                            <label class="label"><span class="label-text-alt text-base-content/60">Ít nhất 8 ký tự, có chữ hoa, chữ thường và số</span></label>
                        </div>
                        <div class="form-control">
                            <label for="confirmPassword" class="label"><span class="label-text">Xác Nhận Mật Khẩu Mới *</span></label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required class="input input-bordered w-full">
                            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="label text-error text-sm mt-1"></span>
                        </div>
                        <button type="submit" id="changePasswordBtn" class="btn btn-primary w-full">Đổi Mật Khẩu</button>
                    </form>

                    <p class="mt-4 text-center text-sm text-base-content/70">
                        <a th:href="@{/profile}" class="link link-primary font-medium">Quay lại trang hồ sơ</a>
                    </p>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
