<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Đăng Nhập - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-xl shadow-card p-8">
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-slate-900">Đăng Nhập</h1>
                    <p class="text-slate-600 mt-1">Chào mừng bạn trở lại!</p>
                </div>

                <!-- Flash Messages -->
                <div class="space-y-3 mb-6">
                    <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>
                    <div th:if="${param.expired}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm">
                        Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.
                    </div>
                    <div th:if="${param.error != null and param.error[0] == 'email_not_verified'}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm">
                        Email chưa được xác minh. Vui lòng kiểm tra hộp thư và nhấn link trong email.
                        <a th:href="@{/resend-verification}" class="block mt-1 no-underline text-primary-600 hover:underline">Gửi lại email xác minh</a>
                    </div>
                    <div th:if="${param.error != null and param.error[0] == 'true'}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm">
                        Email hoặc mật khẩu không đúng. Vui lòng thử lại.
                    </div>
                    <div th:if="${param.logout}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm">
                        Bạn đã đăng xuất thành công.
                    </div>
                    <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
                </div>

                <form id="loginForm" th:action="@{/login}" method="post" class="space-y-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div>
                        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
                        <input type="email" id="username" name="username" required autofocus
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mật Khẩu *</label>
                        <input type="password" id="password" name="password" required
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" id="remember-me" name="remember-me" class="rounded border-slate-300 text-primary-600 focus:ring-primary-500">
                        <label for="remember-me" class="ml-2 text-sm text-slate-700">Ghi nhớ đăng nhập</label>
                    </div>

                    <button type="submit" id="loginBtn"
                            class="w-full bg-primary-500 text-white rounded-lg py-2.5 font-medium hover:bg-primary-600 focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition">
                        Đăng Nhập
                    </button>
                </form>

                <p class="mt-6 text-center text-slate-600 text-sm">
                    Chưa có tài khoản? <a th:href="@{/register}" class="no-underline text-primary-600 hover:underline font-medium">Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </th:block>
</body>
</html>
