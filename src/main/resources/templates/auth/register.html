<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Đăng Ký - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-md mx-auto">
            <div class="card bg-base-100 shadow-card border border-base-200">
                <div class="card-body">
                    <div class="mb-2">
                        <h1 class="card-title text-2xl">Đăng Ký Tài Khoản</h1>
                        <p class="text-base-content/70 mt-1">Tạo tài khoản mới để bắt đầu mua sắm</p>
                    </div>

                    <div class="space-y-3 mb-4">
                        <div th:if="${success}" class="alert alert-success text-sm" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-error text-sm" th:text="${error}"></div>
                    </div>

                    <form id="registerForm" th:action="@{/register}" method="post" th:object="${registerRequest}" class="space-y-4">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="form-control">
                            <label for="email" class="label"><span class="label-text">Email *</span></label>
                            <input type="email" id="email" th:field="*{email}" required class="input input-bordered w-full">
                            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="label text-error text-sm mt-1"></span>
                        </div>
                        <div class="form-control">
                            <label for="fullName" class="label"><span class="label-text">Họ và Tên *</span></label>
                            <input type="text" id="fullName" th:field="*{fullName}" required class="input input-bordered w-full">
                            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="label text-error text-sm mt-1"></span>
                        </div>
                        <div class="form-control">
                            <label for="phoneNumber" class="label"><span class="label-text">Số Điện Thoại</span></label>
                            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="input input-bordered w-full">
                            <span th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="label text-error text-sm mt-1"></span>
                        </div>
                        <div class="form-control">
                            <label for="password" class="label"><span class="label-text">Mật Khẩu *</span></label>
                            <input type="password" id="password" th:field="*{password}" required class="input input-bordered w-full">
                            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="label text-error text-sm mt-1"></span>
                            <label class="label"><span class="label-text-alt text-base-content/60">Mật khẩu ít nhất 8 ký tự, có chữ hoa, chữ thường và số</span></label>
                        </div>
                        <button type="submit" id="registerBtn" class="btn btn-primary w-full">Đăng Ký</button>
                    </form>

                    <p class="mt-4 text-center text-sm text-base-content/70">
                        Đã có tài khoản? <a th:href="@{/login}" class="link link-primary font-medium">Đăng nhập ngay</a>
                    </p>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
