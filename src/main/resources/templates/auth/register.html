<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Đăng Ký - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-xl shadow-card p-8">
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-slate-900">Đăng Ký Tài Khoản</h1>
                    <p class="text-slate-600 mt-1">Tạo tài khoản mới để bắt đầu mua sắm</p>
                </div>

                <!-- Flash Messages -->
                <div class="space-y-3 mb-6">
                    <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>
                    <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
                </div>

                <form id="registerForm" th:action="@{/register}" method="post" th:object="${registerRequest}" class="space-y-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
                        <input type="email" id="email" th:field="*{email}" required
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-sm text-red-600 mt-1 block"></span>
                    </div>

                    <div>
                        <label for="fullName" class="block text-sm font-medium text-slate-700 mb-1">Họ và Tên *</label>
                        <input type="text" id="fullName" th:field="*{fullName}" required
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-sm text-red-600 mt-1 block"></span>
                    </div>

                    <div>
                        <label for="phoneNumber" class="block text-sm font-medium text-slate-700 mb-1">Số Điện Thoại</label>
                        <input type="tel" id="phoneNumber" th:field="*{phoneNumber}"
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <span th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-sm text-red-600 mt-1 block"></span>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mật Khẩu *</label>
                        <input type="password" id="password" th:field="*{password}" required
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-sm text-red-600 mt-1 block"></span>
                        <small class="text-slate-500 text-xs mt-1 block">Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường và số</small>
                    </div>

                    <button type="submit" id="registerBtn"
                            class="w-full bg-primary-500 text-white rounded-lg py-2.5 font-medium hover:bg-primary-600 focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition">
                        Đăng Ký
                    </button>
                </form>

                <p class="mt-6 text-center text-slate-600 text-sm">
                    Đã có tài khoản? <a th:href="@{/login}" class="no-underline text-primary-600 hover:underline font-medium">Đăng nhập ngay</a>
                </p>
            </div>
        </div>
    </th:block>
</body>
</html>
