<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Xác Minh Email - E-commerce</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <div class="min-h-[calc(100vh-80px)] flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-slate-100 p-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-amber-400 to-orange-500"></div>

            <div class="text-center mb-8 mt-2">
                <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-100">
                    <i class="fa-regular fa-paper-plane text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900">Gửi Lại Link Xác Minh</h1>
                <p class="text-slate-500 mt-2 font-medium text-sm px-4">Vui lòng nhập địa chỉ email bạn đã đăng ký để chúng tôi gửi lại liên kết kích hoạt.</p>
            </div>

            <div class="space-y-3 mb-6">
                <div th:if="${success}" class="flex items-start gap-3 p-3.5 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-800 text-sm font-medium">
                    <i class="fa-solid fa-circle-check mt-0.5"></i> <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="flex items-start gap-3 p-3.5 rounded-xl bg-rose-50 border border-rose-100 text-rose-800 text-sm font-medium">
                    <i class="fa-solid fa-triangle-exclamation mt-0.5"></i> <span th:text="${error}"></span>
                </div>
            </div>

            <form th:action="@{/resend-verification}" method="post" class="space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div>
                    <label for="email" class="block text-sm font-bold text-slate-700 mb-1.5">Email của bạn</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-regular fa-envelope"></i></div>
                        <input type="email" id="email" name="email" th:value="${(param.email != null and !param.email.isEmpty()) ? param.email[0] : ''}" required placeholder="Ví dụ: hotro@domain.com" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:bg-white focus:border-amber-500 focus:ring-4 focus:ring-amber-500/10 transition-all outline-none">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 px-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-[0_4px_12px_rgb(245,158,11,0.2)] hover:shadow-[0_6px_16px_rgb(245,158,11,0.3)] transition-all duration-200 transform hover:-translate-y-0.5">
                    Gửi Email Xác Minh <i class="fa-solid fa-paper-plane ml-1"></i>
                </button>
            </form>

            <div class="mt-6 text-center">
                <a th:href="@{/login}" class="text-sm font-bold text-slate-500 hover:text-slate-800 transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
