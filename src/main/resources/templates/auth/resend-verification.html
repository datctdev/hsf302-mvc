<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Gửi lại email xác minh - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-xl shadow-card p-8">
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-slate-900">Gửi lại email xác minh</h1>
                    <p class="text-slate-600 mt-1">Nhập email đã đăng ký để nhận link xác minh mới</p>
                </div>

                <div class="space-y-3 mb-6">
                    <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>
                    <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
                </div>

                <form th:action="@{/resend-verification}" method="post" class="space-y-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
                        <input type="email" id="email" name="email" th:value="${(param.email != null and !param.email.isEmpty()) ? param.email[0] : ''}" required placeholder="email@example.com"
                               class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                    </div>
                    <button type="submit"
                            class="w-full bg-primary-500 text-white rounded-lg py-2.5 font-medium hover:bg-primary-600 focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition">
                        Gửi lại email
                    </button>
                </form>

                <p class="mt-6 text-center text-slate-600 text-sm">
                    Đã xác minh? <a th:href="@{/login}" class="no-underline text-primary-600 hover:underline font-medium">Đăng nhập</a>
                </p>
            </div>
        </div>
    </th:block>
</body>
</html>
