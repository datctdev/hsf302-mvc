<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Gửi lại email xác minh - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-md mx-auto">
            <div class="card bg-base-100 shadow-card border border-base-200">
                <div class="card-body">
                    <div class="mb-2">
                        <h1 class="card-title text-2xl">Gửi lại email xác minh</h1>
                        <p class="text-base-content/70 mt-1">Nhập email đã đăng ký để nhận link xác minh mới</p>
                    </div>

                    <div class="space-y-3 mb-4">
                        <div th:if="${success}" class="alert alert-success text-sm" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-error text-sm" th:text="${error}"></div>
                    </div>

                    <form th:action="@{/resend-verification}" method="post" class="space-y-4">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="form-control">
                            <label for="email" class="label"><span class="label-text">Email *</span></label>
                            <input type="email" id="email" name="email" th:value="${(param.email != null and !param.email.isEmpty()) ? param.email[0] : ''}" required placeholder="email@example.com" class="input input-bordered w-full">
                        </div>
                        <button type="submit" class="btn btn-primary w-full">Gửi lại email</button>
                    </form>

                    <p class="mt-4 text-center text-sm text-base-content/70">
                        Đã xác minh? <a th:href="@{/login}" class="link link-primary font-medium">Đăng nhập</a>
                    </p>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
