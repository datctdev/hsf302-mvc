<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/seller-layout}">
<head>
    <title>Quản Lý Sản Phẩm - Seller</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
            <h2 class="text-xl font-bold text-slate-900">Quản Lý Sản Phẩm</h2>
            <a href="/seller/products/add" class="no-underline px-4 py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 transition">+ Thêm Sản Phẩm</a>
        </div>

        <div class="flex flex-wrap gap-4 items-center mb-6">
            <label class="text-sm font-medium text-slate-700">Lọc theo trạng thái:</label>
            <select id="statusFilter" onchange="filterProducts()" class="rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
                <option value="">Tất cả</option>
                <option value="DRAFT" th:selected="${status == 'DRAFT'}">Nháp</option>
                <option value="PUBLISHED" th:selected="${status == 'PUBLISHED'}">Đã xuất bản</option>
                <option value="ARCHIVED" th:selected="${status == 'ARCHIVED'}">Đã lưu trữ</option>
            </select>
        </div>

        <div class="space-y-3 mb-6">
            <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
        </div>

        <div id="productsContainer" class="space-y-4">
            <div th:if="${products != null and !products.empty}" th:each="product : ${products}" th:with="thumbnailImage=${product.images != null and !product.images.empty ? product.images.?[isThumbnail == true] : null}, firstImage=${product.images != null and !product.images.empty ? product.images[0] : null}, displayImage=${thumbnailImage != null and !thumbnailImage.empty ? thumbnailImage[0] : firstImage}" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col sm:flex-row gap-4 p-4">
                <div class="flex-shrink-0 w-24 h-24 rounded-lg overflow-hidden bg-slate-100 flex items-center justify-center">
                    <img th:if="${displayImage != null}" th:src="${displayImage.imageUrl}" th:alt="${product.name}" class="w-full h-full object-cover" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';">
                    <div class="w-full h-full items-center justify-center text-2xl" th:style="${displayImage != null} ? 'display:none;' : 'display:flex;'" style="display:flex;">📦</div>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="font-semibold text-slate-900 truncate" th:text="${product.name}">Product Name</h3>
                    <p class="text-sm text-slate-500">SKU: <span th:text="${product.sku}">SKU</span></p>
                    <p class="text-primary-600 font-medium mt-1" th:text="|${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'POINT')} VNĐ|">0 VNĐ</p>
                    <p class="text-sm text-slate-600 mt-1 line-clamp-2" th:text="${product.description != null and product.description.length() > 100 ? product.description.substring(0, 100) + '...' : (product.description ?: '')}">Description</p>
                    <div class="flex flex-wrap gap-2 mt-2">
                        <span class="px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-700" th:classappend="${product.status.name() == 'PUBLISHED'} ? 'bg-green-100 text-green-800' : (${product.status.name() == 'DRAFT'} ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600')" th:text="${product.status.name() == 'PUBLISHED' ? 'Đã xuất bản' : (product.status.name() == 'DRAFT' ? 'Nháp' : 'Đã lưu trữ')}">Status</span>
                        <span th:if="${product.variants != null and !product.variants.empty}" class="text-xs text-slate-500" th:text="|${product.variants.size()} biến thể|">Variants</span>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 items-center sm:items-start">
                    <a th:href="@{'/seller/products/edit/' + ${product.id}}" class="no-underline px-4 py-2 rounded-lg bg-primary-500 text-white text-sm font-medium hover:bg-primary-600">Chỉnh sửa</a>
                    <form th:action="@{'/seller/products/delete/' + ${product.id}}" method="post" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="px-4 py-2 rounded-lg border border-red-500 text-red-600 text-sm font-medium hover:bg-red-50" onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này? Hành động này không thể hoàn tác!')">Xóa</button>
                    </form>
                </div>
            </div>
            <div th:if="${products == null or products.empty}" class="text-center py-12 rounded-xl bg-slate-50 border border-slate-200">
                <h3 class="font-semibold text-slate-700 mb-1">Chưa có sản phẩm nào</h3>
                <p class="text-slate-500 text-sm mb-4">Bắt đầu bằng cách thêm sản phẩm đầu tiên của bạn.</p>
                <a href="/seller/products/add" class="no-underline inline-block px-4 py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600">Thêm Sản Phẩm</a>
            </div>
        </div>

        <script>
            function filterProducts() {
                var status = document.getElementById('statusFilter').value;
                window.location.href = status ? '/seller/products?status=' + encodeURIComponent(status) : '/seller/products';
            }
        </script>
    </th:block>
</body>
</html>
