<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/seller-layout}">
<head>
    <title>Thống Kê - Seller</title>
</head>
<body>
    <th:block th:fragment="content">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Thống Kê Shop</h1>
        <p th:if="${shopName != null}" class="text-slate-500 text-sm mb-6" th:text="|Shop: ${shopName}|">Shop name</p>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="rounded-xl border border-slate-200 bg-white p-6 border-l-4 border-primary-500 shadow-sm">
                <h3 class="text-sm font-medium text-slate-500 mb-1">Tổng Đơn Hàng</h3>
                <div class="text-2xl font-bold text-slate-900" th:text="${totalOrders ?: 0}">0</div>
                <div class="text-xs text-slate-500 mt-1">Tất cả đơn (trừ chờ thanh toán)</div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-white p-6 border-l-4 border-green-500 shadow-sm">
                <h3 class="text-sm font-medium text-slate-500 mb-1">Doanh Thu</h3>
                <div class="text-2xl font-bold text-slate-900" th:text="${totalRevenue != null ? (#numbers.formatDecimal(totalRevenue, 0, 'POINT', 0, 'POINT') + ' đ') : '0 đ'}">0 đ</div>
                <div class="text-xs text-slate-500 mt-1">Đơn đã xác nhận → đã giao</div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-white p-6 border-l-4 border-amber-500 shadow-sm">
                <h3 class="text-sm font-medium text-slate-500 mb-1">Hoa Hồng Nền Tảng</h3>
                <div class="text-2xl font-bold text-slate-900"
                     th:text="${totalNetIncome != null
                        ? (#numbers.formatDecimal(totalNetIncome, 0, 'POINT', 0, 'POINT') + ' đ')
                        : '0 đ'}">
                    0 đ
                </div>
                <div class="text-xs text-slate-500 mt-1">Trừ trên doanh thu đã ghi nhận</div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-white p-6 border-l-4 border-red-500 shadow-sm">
                <h3 class="text-sm font-medium text-slate-500 mb-1">Bạn Nhận (ước tính)</h3>
                <div class="text-2xl font-bold text-slate-900" th:text="${(estimatedRevenue != null and totalCommission != null)
                        ? (#numbers.formatDecimal(estimatedRevenue.subtract(totalCommission), 0, 'POINT', 0, 'POINT') + ' đ')
                        : '0 đ'}">0 đ</div>
                <div class="text-xs text-slate-500 mt-1">Doanh thu − hoa hồng</div>
            </div>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white overflow-hidden mb-6">
            <div class="px-4 py-3 border-b border-slate-200">
                <h2 class="font-semibold text-slate-900">Đơn Theo Trạng Thái</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Trạng thái</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Số đơn</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="statusName : ${orderStatusNames}" class="border-t border-slate-100 hover:bg-slate-50">
                            <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-sm font-medium bg-slate-100 text-slate-700" th:text="${statusName}">Status</span></td>
                            <td class="px-4 py-3 text-sm" th:text="${orderCountByStatus.get(statusName) ?: 0}">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a href="/seller/orders" class="no-underline inline-block px-4 py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600">Xem Danh Sách Đơn Hàng</a>
    </th:block>
</body>
</html>
