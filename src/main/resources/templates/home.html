<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Trang chủ - E-commerce</title>

</head>
<body>
    <th:block th:fragment="content">
        <!-- Hero -->
        <section class="bg-primary-50 border-b border-slate-200 py-12 sm:py-16">
            <div class="max-w-3xl">
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-3" th:text="${slogan}">Mua sắm thông minh – Giá tốt mỗi ngày</h1>
                <p class="text-slate-600 text-base sm:text-lg mb-6" th:text="${sloganSubtext}">Khám phá hàng ngàn sản phẩm điện tử, công nghệ từ các shop uy tín. Giao hàng nhanh, bảo hành chính hãng.</p>
                <a th:href="@{/products}" class="inline-block no-underline px-5 py-2.5 rounded bg-primary-500 text-white font-medium hover:bg-primary-600 transition">Xem sản phẩm</a>
            </div>
        </section>

        <!-- Sản phẩm đề xuất -->
        <section class="mt-8 sm:mt-10">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <h2 class="text-xl font-semibold text-slate-900">Sản phẩm đề xuất</h2>
                <a th:href="@{/products}" class="no-underline px-4 py-2 rounded border-2 border-primary-500 text-primary-600 font-medium hover:bg-primary-50 transition">Xem tất cả</a>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <th:block th:if="${featuredProducts != null and !featuredProducts.empty}" th:each="product : ${featuredProducts}">
                    <a th:href="@{/products/{id}(id=${product.id})}" class="block no-underline rounded-lg bg-white border border-slate-200 shadow overflow-hidden hover:shadow-card-hover transition">
                        <div class="aspect-square bg-slate-100">
                            <img th:with="thumbnailImage=${product.images != null and !product.images.empty ? product.images.?[isThumbnail == true] : null},
                                              firstImage=${product.images != null and !product.images.empty ? product.images[0] : null},
                                              displayImage=${thumbnailImage != null and !thumbnailImage.empty ? thumbnailImage[0] : firstImage}"
                                 th:src="${displayImage != null ? displayImage.imageUrl : '/images/placeholder.png'}"
                                 th:alt="${product.name}"
                                 class="w-full h-full object-cover"
                                 onerror="this.src='/images/placeholder.png'">
                        </div>
                        <div class="p-4">
                            <h3 class="font-medium text-slate-900 line-clamp-2 mb-1" th:text="${product.name}">Tên sản phẩm</h3>
                            <div class="text-primary-600 font-semibold" th:text="|${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'POINT')} VNĐ|">0 VNĐ</div>
                            <div class="text-sm text-slate-500 mt-1" th:text="${product.shopName ?: 'N/A'}">Shop</div>
                        </div>
                    </a>
                </th:block>
            </div>
            <div th:if="${featuredProducts == null or featuredProducts.empty}" class="text-center py-12 text-slate-500">
                Chưa có sản phẩm nào. <a th:href="@{/products}" class="no-underline text-primary-600 hover:underline">Xem danh sách sản phẩm</a>
            </div>
        </section>
    </th:block>
</body>
</html>
