<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Xem Lại Thông Tin - eKYC</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between gap-2 mb-6 p-4 bg-white rounded-xl border border-slate-200">
                <span class="flex-1 text-center py-2 rounded-lg bg-green-500 text-white font-medium text-sm">Tải lên giấy tờ</span>
                <span class="flex-1 text-center py-2 rounded-lg bg-violet-500 text-white font-medium text-sm">Xem lại thông tin</span>
                <span class="flex-1 text-center py-2 rounded-lg bg-slate-100 text-slate-500 font-medium text-sm">Xác nhận</span>
            </div>

            <div class="space-y-3 mb-6">
                <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm flex items-center gap-2"><span>✓</span><span th:text="${success}"></span></div>
                <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm flex items-center gap-2"><span>✗</span><span th:text="${error}"></span></div>
            </div>

            <div class="rounded-xl bg-white border border-slate-200 overflow-hidden shadow-sm mb-6" th:if="${frontInfo}">
                <div class="flex items-center gap-2 px-5 py-4 bg-gradient-to-r from-violet-500 to-purple-600 text-white font-semibold text-lg">
                    <span>🪪</span>
                    <span>Thông Tin Mặt Trước CCCD</span>
                </div>
                <div class="p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="p-4 bg-slate-50 rounded-lg border-l-4 border-violet-500">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Số CCCD</label>
                        <p class="text-slate-900 font-medium" th:text="${frontInfo.idNumber} ?: 'N/A'"></p>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border-l-4 border-violet-500">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Họ và Tên</label>
                        <p class="text-slate-900 font-medium" th:text="${frontInfo.fullName} ?: 'N/A'"></p>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border-l-4 border-violet-500">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Ngày Sinh</label>
                        <p class="text-slate-900 font-medium" th:text="${frontInfo.birthDay} ?: 'N/A'"></p>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border-l-4 border-violet-500">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Giới Tính</label>
                        <p class="text-slate-900 font-medium" th:text="${frontInfo.gender} ?: 'N/A'"></p>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border-l-4 border-violet-500">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Quốc Tịch</label>
                        <p class="text-slate-900 font-medium" th:text="${frontInfo.nationality} ?: 'N/A'"></p>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border-l-4 border-violet-500">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Quê Quán</label>
                        <p class="text-slate-900 font-medium" th:text="${frontInfo.originLocation} ?: 'N/A'"></p>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border-l-4 border-violet-500 sm:col-span-2 lg:col-span-3">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Nơi Thường Trú</label>
                        <p class="text-slate-900 font-medium" th:text="${frontInfo.recentLocation} ?: 'N/A'"></p>
                    </div>
                </div>
            </div>

            <div class="rounded-xl bg-white border border-slate-200 overflow-hidden shadow-sm mb-6" th:if="${backInfo}">
                <div class="flex items-center gap-2 px-5 py-4 bg-gradient-to-r from-pink-400 to-rose-500 text-white font-semibold text-lg">
                    <span>🪪</span>
                    <span>Thông Tin Mặt Sau CCCD</span>
                </div>
                <div class="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="p-4 bg-slate-50 rounded-lg border-l-4 border-pink-500">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Ngày Cấp</label>
                        <p class="text-slate-900 font-medium" th:text="${backInfo.issueDate} ?: 'N/A'"></p>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-lg border-l-4 border-pink-500">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Nơi Cấp</label>
                        <p class="text-slate-900 font-medium" th:text="${backInfo.issuePlace} ?: 'N/A'"></p>
                    </div>
                </div>
            </div>

            <div class="rounded-xl bg-amber-50 border-2 border-amber-300 p-5 my-6">
                <p class="font-semibold text-amber-800 flex items-center gap-2"><span>⚠️</span> Vui lòng kiểm tra kỹ thông tin trước khi xác nhận</p>
                <p class="text-amber-800 text-sm mt-2">Sau khi xác nhận, hệ thống sẽ so sánh khuôn mặt trên CCCD với ảnh selfie của bạn để hoàn tất quá trình xác minh danh tính.</p>
            </div>

            <div class="flex flex-wrap justify-between items-center gap-4 mt-8">
                <a th:href="@{/kyc/session/{id}(id=${kycSession.id})}" class="no-underline inline-flex items-center px-6 py-3 rounded-full bg-slate-500 text-white font-semibold hover:bg-slate-600 transition">← Quay Lại</a>
                <form th:action="@{/kyc/session/{id}/verify(id=${kycSession.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="px-8 py-3 rounded-full bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition">✓ Xác Nhận và Xác Minh</button>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
