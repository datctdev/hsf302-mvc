<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Sản Phẩm - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <h1 class="text-2xl font-bold text-slate-900 mb-6">Sản Phẩm</h1>

        <!-- Hidden form for HTMX filter/sort (params sent with hx-include) -->
        <form id="productFilterForm" class="contents">
            <input type="hidden" name="page" value="0">
            <input type="hidden" name="size" value="20">
        </form>

        <!-- Search -->
        <div class="flex flex-wrap gap-2 mb-6">
            <input type="text" name="search" id="searchInput" placeholder="Tìm kiếm sản phẩm..."
                   class="flex-1 min-w-[200px] rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                   form="productFilterForm">
            <button type="button" class="px-4 py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 transition"
                    onclick="productListHxReload(0)">Tìm kiếm</button>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar filters -->
            <aside class="lg:w-56 shrink-0">
                <div class="bg-white rounded-xl shadow-card p-4 sticky top-4">
                    <h3 class="font-semibold text-slate-900 mb-4">Lọc sản phẩm</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Danh mục</label>
                            <select name="categoryId" id="categoryFilter" form="productFilterForm" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                <option value="">Tất cả</option>
                                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Category</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Giá</label>
                            <div class="flex items-center gap-2">
                                <input type="number" name="minPrice" id="minPrice" placeholder="Từ" min="0" form="productFilterForm" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500">
                                <span class="text-slate-400">-</span>
                                <input type="number" name="maxPrice" id="maxPrice" placeholder="Đến" min="0" form="productFilterForm" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500">
                            </div>
                        </div>
                        <button type="button" class="w-full py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 transition"
                                onclick="productListHxReload(0)">Áp dụng</button>
                        <button type="button" onclick="clearFiltersAndReload()" class="w-full py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50 transition">Xóa bộ lọc</button>
                    </div>
                </div>
            </aside>

            <!-- Main content: container for HTMX swap -->
            <div class="flex-1 min-w-0" id="product-list-container">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                    <span class="text-slate-600"><span id="productCount" th:text="${totalItems}">0</span> sản phẩm</span>
                    <div class="flex items-center gap-2">
                        <label class="text-sm text-slate-600">Sắp xếp:</label>
                        <select name="sort" id="sortSelect" form="productFilterForm" class="rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                                onchange="productListHxReload(0)">
                            <option value="createdAt,desc">Mới nhất</option>
                            <option value="price,asc">Giá: Thấp → Cao</option>
                            <option value="price,desc">Giá: Cao → Thấp</option>
                            <option value="name,asc">Tên: A → Z</option>
                        </select>
                    </div>
                </div>

                <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <th:block th:if="${products != null and !products.empty}" th:each="product : ${products}">
                        <a th:href="@{/products/{id}(id=${product.id})}" class="block no-underline rounded-lg bg-white border border-slate-200 shadow overflow-hidden hover:shadow-card-hover transition">
                            <div class="aspect-square bg-slate-100">
                                <img th:with="thumbnailImage=${product.images != null and !product.images.empty ? product.images.?[isThumbnail == true] : null}, firstImage=${product.images != null and !product.images.empty ? product.images[0] : null}, displayImage=${thumbnailImage != null and !thumbnailImage.empty ? thumbnailImage[0] : firstImage}"
                                     th:src="${displayImage != null ? displayImage.imageUrl : '/images/placeholder.png'}" th:alt="${product.name}"
                                     class="w-full h-full object-cover" onerror="this.src='/images/placeholder.png'">
                            </div>
                            <div class="p-4">
                                <h3 class="font-medium text-slate-900 line-clamp-2 mb-1" th:text="${product.name}">Product Name</h3>
                                <div class="text-primary-600 font-semibold" th:text="|${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'POINT')} VNĐ|">0 VNĐ</div>
                                <div class="text-sm text-slate-500 mt-1" th:text="${product.shopName ?: 'N/A'}">Shop</div>
                            </div>
                        </a>
                    </th:block>
                </div>
                <div th:if="${products == null or products.empty}" class="text-center py-12 text-slate-500 rounded-lg bg-slate-50">
                    Không tìm thấy sản phẩm nào.
                </div>

                <div id="pagination" class="flex flex-wrap justify-center gap-2 mt-8"></div>

                <div id="load-more-wrap" class="mt-6 text-center">
                    <button th:if="${hasMore}" type="button" class="px-6 py-2.5 rounded-lg border-2 border-primary-500 text-primary-600 font-medium hover:bg-primary-50 transition"
                            th:attr="hx-get=@{/products(size=20, sortBy=${sortBy}, sortDir=${sortDir}, search=${search}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, page=${nextPage}, partial='append')}"
                            hx-target="#productsGrid" hx-swap="beforeend" hx-trigger="click">Xem thêm</button>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            const pageSize = 20;

            function productListParams(page) {
                var p = { page: page || 0, size: pageSize };
                var sortEl = document.getElementById('sortSelect');
                p.sort = (sortEl && sortEl.value) ? sortEl.value : 'createdAt,desc';
                var searchEl = document.getElementById('searchInput');
                if (searchEl && searchEl.value && searchEl.value.trim()) p.search = searchEl.value.trim();
                var catEl = document.getElementById('categoryFilter');
                if (catEl && catEl.value) p.categoryId = catEl.value;
                var minEl = document.getElementById('minPrice');
                if (minEl && minEl.value) p.minPrice = minEl.value;
                var maxEl = document.getElementById('maxPrice');
                if (maxEl && maxEl.value) p.maxPrice = maxEl.value;
                return p;
            }

            function productListHxReload(page) {
                var params = productListParams(page);
                var qs = new URLSearchParams(params).toString();
                htmx.ajax('GET', '/products?' + qs, {
                    target: '#product-list-container',
                    swap: 'innerHTML',
                    headers: { 'HX-Request': 'true' }
                });
            }

            function clearFiltersAndReload() {
                document.getElementById('categoryFilter').value = '';
                var minEl = document.getElementById('minPrice'); if (minEl) minEl.value = '';
                var maxEl = document.getElementById('maxPrice'); if (maxEl) maxEl.value = '';
                document.getElementById('searchInput').value = '';
                var sortEl = document.getElementById('sortSelect'); if (sortEl) sortEl.value = 'createdAt,desc';
                productListHxReload(0);
            }

            document.addEventListener('DOMContentLoaded', function() {
                var searchInput = document.getElementById('searchInput');
                if (searchInput) searchInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); productListHxReload(0); } });
            });
        </script>
    </th:block>

    <!-- Fragment: full list (for HTMX filter/sort swap) -->
    <th:block th:fragment="productListFragment">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
            <span class="text-slate-600"><span id="productCount" th:text="${totalItems}">0</span> sản phẩm</span>
            <div class="flex items-center gap-2">
                <label class="text-sm text-slate-600">Sắp xếp:</label>
                <select name="sort" id="sortSelect" form="productFilterForm" class="rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                        onchange="productListHxReload(0)">
                    <option value="createdAt,desc" th:selected="${sortBy == 'createdAt' and sortDir == 'desc'}">Mới nhất</option>
                    <option value="price,asc" th:selected="${sortBy == 'price' and sortDir == 'asc'}">Giá: Thấp → Cao</option>
                    <option value="price,desc" th:selected="${sortBy == 'price' and sortDir == 'desc'}">Giá: Cao → Thấp</option>
                    <option value="name,asc" th:selected="${sortBy == 'name' and sortDir == 'asc'}">Tên: A → Z</option>
                </select>
            </div>
        </div>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <th:block th:each="product : ${products}">
                <a th:href="@{/products/{id}(id=${product.id})}" class="block no-underline rounded-lg bg-white border border-slate-200 shadow overflow-hidden hover:shadow-card-hover transition">
                    <div class="aspect-square bg-slate-100">
                        <img th:with="thumbnailImage=${product.images != null and !product.images.empty ? product.images.?[isThumbnail == true] : null}, firstImage=${product.images != null and !product.images.empty ? product.images[0] : null}, displayImage=${thumbnailImage != null and !thumbnailImage.empty ? thumbnailImage[0] : firstImage}"
                             th:src="${displayImage != null ? displayImage.imageUrl : '/images/placeholder.png'}" th:alt="${product.name}"
                             class="w-full h-full object-cover" onerror="this.src='/images/placeholder.png'">
                    </div>
                    <div class="p-4">
                        <h3 class="font-medium text-slate-900 line-clamp-2 mb-1" th:text="${product.name}">Product Name</h3>
                        <div class="text-primary-600 font-semibold" th:text="|${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'POINT')} VNĐ|">0 VNĐ</div>
                        <div class="text-sm text-slate-500 mt-1" th:text="${product.shopName ?: 'N/A'}">Shop</div>
                    </div>
                </a>
            </th:block>
        </div>
        <div th:if="${products == null or products.empty}" class="text-center py-12 text-slate-500 rounded-lg bg-slate-50">
            Không tìm thấy sản phẩm nào.
        </div>
        <div id="pagination" class="flex flex-wrap justify-center gap-2 mt-8"></div>
        <div id="load-more-wrap" class="mt-6 text-center" th:if="${hasMore}">
            <button type="button" class="px-6 py-2.5 rounded-lg border-2 border-primary-500 text-primary-600 font-medium hover:bg-primary-50 transition"
                    th:attr="hx-get=@{/products(size=20, sortBy=${sortBy}, sortDir=${sortDir}, search=${search}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, page=${nextPage}, partial='append')}"
                    hx-target="#productsGrid" hx-swap="beforeend" hx-trigger="click">Xem thêm</button>
        </div>
    </th:block>

    <!-- Fragment: append cards + OOB load-more (for "Xem thêm") -->
    <th:block th:fragment="productCardsAppend">
        <th:block th:each="product : ${products}">
            <a th:href="@{/products/{id}(id=${product.id})}" class="block no-underline rounded-lg bg-white border border-slate-200 shadow overflow-hidden hover:shadow-card-hover transition">
                <div class="aspect-square bg-slate-100">
                    <img th:with="thumbnailImage=${product.images != null and !product.images.empty ? product.images.?[isThumbnail == true] : null}, firstImage=${product.images != null and !product.images.empty ? product.images[0] : null}, displayImage=${thumbnailImage != null and !thumbnailImage.empty ? thumbnailImage[0] : firstImage}"
                         th:src="${displayImage != null ? displayImage.imageUrl : '/images/placeholder.png'}" th:alt="${product.name}"
                         class="w-full h-full object-cover" onerror="this.src='/images/placeholder.png'">
                </div>
                <div class="p-4">
                    <h3 class="font-medium text-slate-900 line-clamp-2 mb-1" th:text="${product.name}">Product Name</h3>
                    <div class="text-primary-600 font-semibold" th:text="|${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'POINT')} VNĐ|">0 VNĐ</div>
                    <div class="text-sm text-slate-500 mt-1" th:text="${product.shopName ?: 'N/A'}">Shop</div>
                </div>
            </a>
        </th:block>
        <div id="load-more-wrap" class="mt-6 text-center" hx-swap-oob="true">
            <button th:if="${hasMore}" type="button" class="px-6 py-2.5 rounded-lg border-2 border-primary-500 text-primary-600 font-medium hover:bg-primary-50 transition"
                    th:attr="hx-get=@{/products(size=20, sortBy=${sortBy}, sortDir=${sortDir}, search=${search}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, page=${nextPage}, partial='append')}"
                    hx-target="#productsGrid" hx-swap="beforeend" hx-trigger="click">Xem thêm</button>
        </div>
    </th:block>
</body>
</html>
