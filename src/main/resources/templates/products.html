<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - E-commerce</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>

<!-- Header -->
<th:block th:replace="~{fragments/header :: header-simple}"></th:block>

<!-- Navigation -->
<th:block th:replace="~{fragments/nav-home :: nav-home}"></th:block>

<!-- Main Content -->
<main class="main-content">
    <div class="container">

        <!-- Page Header -->
        <div class="products-page-header">
            <h1>Sản phẩm</h1>

            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm sản phẩm...">
                <button class="btn btn-primary" onclick="performSearch()">Tìm kiếm</button>
            </div>
        </div>

        <div class="products-container">

            <!-- Sidebar Filters -->
            <aside class="products-sidebar">
                <div class="filter-section">
                    <h3>🔎 Bộ lọc</h3>

                    <div class="filter-group">
                        <label>Danh mục</label>
                        <select id="categoryFilter">
                            <option value="">Tất cả</option>
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}">Category</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Khoảng giá</label>
                        <div class="price-range">
                            <input type="number" id="minPrice" placeholder="Từ" min="0">
                            <span>—</span>
                            <input type="number" id="maxPrice" placeholder="Đến" min="0">
                        </div>
                    </div>

                    <button class="btn btn-primary filter-btn" onclick="applyFilters()">Áp dụng</button>
                    <button class="btn btn-secondary filter-btn" onclick="clearFilters()">Xóa bộ lọc</button>
                </div>
            </aside>

            <!-- Main Products Area -->
            <div class="products-main">

                <!-- Products Header -->
                <div class="products-header">
                    <div class="products-count">
                        <strong><span id="productCount">0</span></strong> sản phẩm
                    </div>

                    <div class="products-sort">
                        <label>Sắp xếp:</label>
                        <select class="sort-select" id="sortSelect">
                            <option value="createdAt,desc">Mới nhất</option>
                            <option value="price,asc">Giá: Thấp → Cao</option>
                            <option value="price,desc">Giá: Cao → Thấp</option>
                            <option value="name,asc">Tên: A → Z</option>
                        </select>
                    </div>
                </div>

                <!-- Products Grid -->
                <div id="productsGrid" class="products-grid">

                    <div th:if="${products != null and !products.empty}" th:each="product : ${products}">
                        <a th:href="@{/products/{id}(id=${product.id})}" class="product-card">

                            <div class="product-image-wrapper">
                                <img th:with="thumbnailImage=${product.images != null and !product.images.empty ? product.images.?[isThumbnail == true] : null},
                                              firstImage=${product.images != null and !product.images.empty ? product.images[0] : null},
                                              displayImage=${thumbnailImage != null and !thumbnailImage.empty ? thumbnailImage[0] : firstImage}"
                                     th:src="${displayImage != null ? displayImage.imageUrl : '/images/placeholder.png'}"
                                     th:alt="${product.name}"
                                     class="product-card-image"
                                     onerror="this.src='/images/placeholder.png'">
                            </div>

                            <div class="product-card-body">
                                <h3 class="product-card-title" th:text="${product.name}">Product Name</h3>

                                <div class="product-card-price"
                                     th:text="|${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'POINT')} VNĐ|">
                                    0 VNĐ
                                </div>

                                <div class="product-card-shop"
                                     th:text="${product.shopName ?: 'N/A'}">
                                    Shop Name
                                </div>
                            </div>
                        </a>
                    </div>

                    <div th:if="${products == null or products.empty}" class="empty-state">
                        Không tìm thấy sản phẩm nào.
                    </div>

                </div>

                <!-- Pagination -->
                <div id="pagination" class="pagination"></div>

            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<!-- JavaScript -->
<script th:src="@{/js/common.js}"></script>

<script>
    /* === JS GIỮ NGUYÊN LOGIC CỦA BẠN === */
    let currentPage = 0;
    const pageSize = 20;
    let currentFilters = {
        search: null,
        categoryId: null,
        shopId: null,
        minPrice: null,
        maxPrice: null,
        sortBy: 'createdAt',
        sortDir: 'desc'
    };

    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        currentPage = parseInt(urlParams.get('page') || '0');
        currentFilters.search = urlParams.get('search') || null;
        currentFilters.categoryId = urlParams.get('categoryId') || null;
        currentFilters.minPrice = urlParams.get('minPrice') ? parseFloat(urlParams.get('minPrice')) : null;
        currentFilters.maxPrice = urlParams.get('maxPrice') ? parseFloat(urlParams.get('maxPrice')) : null;
        currentFilters.sortBy = urlParams.get('sortBy') || 'createdAt';
        currentFilters.sortDir = urlParams.get('sortDir') || 'desc';

        if (currentFilters.search) document.getElementById('searchInput').value = currentFilters.search;
        if (currentFilters.categoryId) document.getElementById('categoryFilter').value = currentFilters.categoryId;
        if (currentFilters.minPrice) document.getElementById('minPrice').value = currentFilters.minPrice;
        if (currentFilters.maxPrice) document.getElementById('maxPrice').value = currentFilters.maxPrice;

        document.getElementById('productCount').textContent = /*[[${totalItems}]]*/ 0;

        displayPaginationFromModel();

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });
    });

    function displayPaginationFromModel() {
        const totalPages = /*[[${totalPages}]]*/ 1;
        const currentPageNum = /*[[${currentPage}]]*/ 0;

        if (totalPages <= 1) {
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        displayPagination({
            totalPages: totalPages,
            number: currentPageNum
        });
    }

    document.getElementById('sortSelect').addEventListener('change', function() {
        const [sortBy, sortDir] = this.value.split(',');
        currentFilters.sortBy = sortBy;
        currentFilters.sortDir = sortDir;
        currentPage = 0;
        reloadProducts();
    });

    function performSearch() {
        const searchTerm = document.getElementById('searchInput').value.trim();
        currentFilters.search = searchTerm || null;
        currentPage = 0;
        reloadProducts();
    }

    function applyFilters() {
        const categoryId = document.getElementById('categoryFilter').value;
        const minPrice = document.getElementById('minPrice').value;
        const maxPrice = document.getElementById('maxPrice').value;

        currentFilters.categoryId = categoryId || null;
        currentFilters.minPrice = minPrice ? parseFloat(minPrice) : null;
        currentFilters.maxPrice = maxPrice ? parseFloat(maxPrice) : null;
        currentPage = 0;
        reloadProducts();
    }

    function clearFilters() {
        document.getElementById('categoryFilter').value = '';
        document.getElementById('minPrice').value = '';
        document.getElementById('maxPrice').value = '';
        document.getElementById('searchInput').value = '';
        currentFilters = {
            search: null,
            categoryId: null,
            shopId: null,
            minPrice: null,
            maxPrice: null,
            sortBy: 'createdAt',
            sortDir: 'desc'
        };
        currentPage = 0;
        reloadProducts();
    }

    function reloadProducts() {
        const params = new URLSearchParams();
        params.append('page', currentPage);
        params.append('size', pageSize);
        params.append('sortBy', currentFilters.sortBy);
        params.append('sortDir', currentFilters.sortDir);

        if (currentFilters.search) params.append('search', currentFilters.search);
        if (currentFilters.categoryId) params.append('categoryId', currentFilters.categoryId);
        if (currentFilters.minPrice) params.append('minPrice', currentFilters.minPrice);
        if (currentFilters.maxPrice) params.append('maxPrice', currentFilters.maxPrice);

        window.location.href = '/products?' + params.toString();
    }
</script>

</body>
</html>
