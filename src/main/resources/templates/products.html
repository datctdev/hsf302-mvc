<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Sản Phẩm - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <h1 class="text-2xl font-bold text-slate-900 mb-6">Sản Phẩm</h1>

        <!-- Search -->
        <div class="flex flex-wrap gap-2 mb-6">
            <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm..."
                   class="flex-1 min-w-[200px] rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            <button type="button" onclick="performSearch()" class="px-4 py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 transition">Tìm kiếm</button>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar filters -->
            <aside class="lg:w-56 shrink-0">
                <div class="bg-white rounded-xl shadow-card p-4 sticky top-4">
                    <h3 class="font-semibold text-slate-900 mb-4">Lọc sản phẩm</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Danh mục</label>
                            <select id="categoryFilter" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                <option value="">Tất cả</option>
                                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Category</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Giá</label>
                            <div class="flex items-center gap-2">
                                <input type="number" id="minPrice" placeholder="Từ" min="0" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500">
                                <span class="text-slate-400">-</span>
                                <input type="number" id="maxPrice" placeholder="Đến" min="0" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500">
                            </div>
                        </div>
                        <button type="button" onclick="applyFilters()" class="w-full py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 transition">Áp dụng</button>
                        <button type="button" onclick="clearFilters()" class="w-full py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50 transition">Xóa bộ lọc</button>
                    </div>
                </div>
            </aside>

            <!-- Main content -->
            <div class="flex-1 min-w-0">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                    <span class="text-slate-600"><span id="productCount" th:text="${totalItems}">0</span> sản phẩm</span>
                    <div class="flex items-center gap-2">
                        <label class="text-sm text-slate-600">Sắp xếp:</label>
                        <select id="sortSelect" onchange="loadProducts()" class="rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            <option value="createdAt,desc">Mới nhất</option>
                            <option value="price,asc">Giá: Thấp → Cao</option>
                            <option value="price,desc">Giá: Cao → Thấp</option>
                            <option value="name,asc">Tên: A → Z</option>
                        </select>
                    </div>
                </div>

                <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <th:block th:if="${products != null and !products.empty}" th:each="product : ${products}">
                        <a th:href="@{/products/{id}(id=${product.id})}" class="block no-underline rounded-lg bg-white border border-slate-200 shadow overflow-hidden hover:shadow-card-hover transition">
                            <div class="aspect-square bg-slate-100">
                                <img th:with="thumbnailImage=${product.images != null and !product.images.empty ? product.images.?[isThumbnail == true] : null}, firstImage=${product.images != null and !product.images.empty ? product.images[0] : null}, displayImage=${thumbnailImage != null and !thumbnailImage.empty ? thumbnailImage[0] : firstImage}"
                                     th:src="${displayImage != null ? displayImage.imageUrl : '/images/placeholder.png'}" th:alt="${product.name}"
                                     class="w-full h-full object-cover" onerror="this.src='/images/placeholder.png'">
                            </div>
                            <div class="p-4">
                                <h3 class="font-medium text-slate-900 line-clamp-2 mb-1" th:text="${product.name}">Product Name</h3>
                                <div class="text-primary-600 font-semibold" th:text="|${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'POINT')} VNĐ|">0 VNĐ</div>
                                <div class="text-sm text-slate-500 mt-1" th:text="${product.shopName ?: 'N/A'}">Shop</div>
                            </div>
                        </a>
                    </th:block>
                </div>
                <div th:if="${products == null or products.empty}" class="text-center py-12 text-slate-500 rounded-lg bg-slate-50">
                    Không tìm thấy sản phẩm nào.
                </div>

                <div id="pagination" class="flex flex-wrap justify-center gap-2 mt-8"></div>
            </div>
        </div>

        <script th:inline="javascript">
            let currentPage = /*[[${currentPage}]]*/ 0;
            const pageSize = 20;
            let currentFilters = {
                search: null, categoryId: null, shopId: null, minPrice: null, maxPrice: null,
                sortBy: 'createdAt', sortDir: 'desc'
            };

            document.addEventListener('DOMContentLoaded', function() {
                const urlParams = new URLSearchParams(window.location.search);
                currentPage = parseInt(urlParams.get('page') || '0');
                currentFilters.search = urlParams.get('search') || null;
                currentFilters.categoryId = urlParams.get('categoryId') || null;
                currentFilters.minPrice = urlParams.get('minPrice') ? parseFloat(urlParams.get('minPrice')) : null;
                currentFilters.maxPrice = urlParams.get('maxPrice') ? parseFloat(urlParams.get('maxPrice')) : null;
                const sort = (urlParams.get('sortBy') || 'createdAt') + ',' + (urlParams.get('sortDir') || 'desc');
                currentFilters.sortBy = urlParams.get('sortBy') || 'createdAt';
                currentFilters.sortDir = urlParams.get('sortDir') || 'desc';

                if (currentFilters.search) document.getElementById('searchInput').value = currentFilters.search;
                if (currentFilters.categoryId) document.getElementById('categoryFilter').value = currentFilters.categoryId;
                if (currentFilters.minPrice) document.getElementById('minPrice').value = currentFilters.minPrice;
                if (currentFilters.maxPrice) document.getElementById('maxPrice').value = currentFilters.maxPrice;
                document.getElementById('sortSelect').value = sort;
                document.getElementById('productCount').textContent = /*[[${totalItems}]]*/ 0;
                displayPaginationFromModel();
                document.getElementById('searchInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') performSearch(); });
            });

            function displayPaginationFromModel() {
                const totalPages = /*[[${totalPages}]]*/ 1;
                const currentPageNum = /*[[${currentPage}]]*/ 0;
                if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
                displayPagination({ totalPages: totalPages, number: currentPageNum });
            }

            function displayPagination(pageData) {
                const pagination = document.getElementById('pagination');
                if (pageData.totalPages <= 1) { pagination.innerHTML = ''; return; }
                let html = '';
                html += '<button ' + (currentPage === 0 ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage - 1) + ')" class="px-3 py-1.5 rounded border border-slate-300 text-sm font-medium disabled:opacity-50 hover:bg-slate-50">Trước</button>';
                const startPage = Math.max(0, currentPage - 2), endPage = Math.min(pageData.totalPages - 1, currentPage + 2);
                if (startPage > 0) { html += '<button onclick="goToPage(0)" class="px-3 py-1.5 rounded border border-slate-300 text-sm font-medium hover:bg-slate-50">1</button>'; if (startPage > 1) html += '<span class="px-2 text-slate-400">...</span>'; }
                for (let i = startPage; i <= endPage; i++) {
                    html += '<button class="px-3 py-1.5 rounded text-sm font-medium ' + (i === currentPage ? 'bg-primary-500 text-white' : 'border border-slate-300 hover:bg-slate-50') + '" onclick="goToPage(' + i + ')">' + (i + 1) + '</button>';
                }
                if (endPage < pageData.totalPages - 1) { if (endPage < pageData.totalPages - 2) html += '<span class="px-2 text-slate-400">...</span>'; html += '<button onclick="goToPage(' + (pageData.totalPages - 1) + ')" class="px-3 py-1.5 rounded border border-slate-300 text-sm font-medium hover:bg-slate-50">' + pageData.totalPages + '</button>'; }
                html += '<button ' + (currentPage >= pageData.totalPages - 1 ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage + 1) + ')" class="px-3 py-1.5 rounded border border-slate-300 text-sm font-medium disabled:opacity-50 hover:bg-slate-50">Sau</button>';
                pagination.innerHTML = html;
            }

            function goToPage(page) { currentPage = page; reloadProducts(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
            function performSearch() { currentFilters.search = document.getElementById('searchInput').value.trim() || null; currentPage = 0; reloadProducts(); }
            function applyFilters() {
                currentFilters.categoryId = document.getElementById('categoryFilter').value || null;
                currentFilters.minPrice = document.getElementById('minPrice').value ? parseFloat(document.getElementById('minPrice').value) : null;
                currentFilters.maxPrice = document.getElementById('maxPrice').value ? parseFloat(document.getElementById('maxPrice').value) : null;
                currentPage = 0; reloadProducts();
            }
            function clearFilters() {
                document.getElementById('categoryFilter').value = ''; document.getElementById('minPrice').value = ''; document.getElementById('maxPrice').value = ''; document.getElementById('searchInput').value = '';
                currentFilters = { search: null, categoryId: null, shopId: null, minPrice: null, maxPrice: null, sortBy: 'createdAt', sortDir: 'desc' };
                currentPage = 0; reloadProducts();
            }
            function loadProducts() {
                const v = document.getElementById('sortSelect').value.split(',');
                currentFilters.sortBy = v[0]; currentFilters.sortDir = v[1]; currentPage = 0; reloadProducts();
            }
            function reloadProducts() {
                const params = new URLSearchParams();
                params.append('page', currentPage); params.append('size', pageSize); params.append('sortBy', currentFilters.sortBy); params.append('sortDir', currentFilters.sortDir);
                if (currentFilters.search) params.append('search', currentFilters.search);
                if (currentFilters.categoryId) params.append('categoryId', currentFilters.categoryId);
                if (currentFilters.minPrice) params.append('minPrice', currentFilters.minPrice);
                if (currentFilters.maxPrice) params.append('maxPrice', currentFilters.maxPrice);
                window.location.href = '/products?' + params.toString();
            }
        </script>
    </th:block>
</body>
</html>
