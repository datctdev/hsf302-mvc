<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Biên Lai Hoa Hồng - Admin</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .saas-card { background: #ffffff; border-radius: 1.25rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow: hidden; margin-bottom: 1.5rem;}
        .info-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px dashed #e2e8f0; }
        .info-row:last-child { border-bottom: none; padding-bottom: 0;}
        .info-label { color: #64748b; font-size: 0.875rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem;}
        .info-value { color: #1e293b; font-size: 0.875rem; font-weight: 800; text-align: right;}
        .modern-table { width: 100%; border-collapse: collapse;}
        .modern-table th { background: #f8fafc; color: #64748b; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; padding: 1rem; text-align: left; border-bottom: 2px solid #f1f5f9;}
        .modern-table td { padding: 1rem; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.875rem; vertical-align: middle; font-weight: 600;}
    </style>

    <div style="background-color: #f8fafc; padding: 1.5rem; border-radius: 12px; min-height: calc(100vh - 100px); display: flex; justify-content: center;">

        <div style="width: 100%; max-width: 800px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <a th:href="@{/admin/commission/orders}" style="color: #64748b; text-decoration: none; font-weight: 700; font-size: 0.875rem;"><i class="fa-solid fa-arrow-left"></i> Quay lại lịch sử</a>
            </div>

            <div class="saas-card">
                <div style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 2rem; color: white; display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h1 style="margin: 0; font-size: 1.5rem; font-weight: 900;"><i class="fa-solid fa-receipt text-indigo-400 mr-2"></i> Biên Lai Thu Phí</h1>
                        <p style="margin: 0.5rem 0 0 0; color: #94a3b8; font-size: 0.875rem;" th:text="${#temporals.format(commission.createdAt,'dd/MM/yyyy HH:mm')}">Date</p>
                    </div>
                    <div style="text-align: right;">
                        <p style="margin: 0; font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Mã Đơn Hàng</p>
                        <p style="margin: 0; font-size: 1.1rem; font-weight: 900; font-family: monospace;" th:text="${commission.orderId}">ID</p>
                    </div>
                </div>

                <div style="padding: 1.5rem;">
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-shop text-slate-400"></i> Gian Hàng Bán</span>
                        <span class="info-value text-blue-600" th:text="${commission.sellerName}">Seller</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Tổng Giá Trị Đơn (Tiền hàng)</span>
                        <span class="info-value" th:text="${commission.orderAmount != null ? #numbers.formatDecimal(commission.orderAmount, 0, 'POINT', 0, 'POINT') : '0'}">0</span>
                    </div>
                    <div class="info-row" style="background: #ecfdf5; padding: 1rem; border-radius: 0.75rem; margin-top: 1rem; border: 1px solid #a7f3d0;">
                        <span class="info-label text-emerald-700" style="font-size: 1rem;">Nền Tảng Đã Thu</span>
                        <span class="info-value text-emerald-700" style="font-size: 1.25rem;" th:text="${commission.totalCommission != null ? '+' + #numbers.formatDecimal(commission.totalCommission, 0, 'POINT', 0, 'POINT') : '0'}">0</span>
                    </div>
                </div>

                <div style="padding: 0; border-top: 2px dashed #f1f5f9;">
                    <div style="padding: 1rem 1.5rem; background: #f8fafc; border-bottom: 1px solid #f1f5f9;">
                        <h3 style="margin: 0; font-size: 0.875rem; font-weight: 800; color: #475569; text-transform: uppercase;">Chi tiết đối soát theo sản phẩm</h3>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="modern-table">
                            <thead>
                            <tr>
                                <th>Sản Phẩm</th>
                                <th style="text-align: right;">Đơn giá</th>
                                <th style="text-align: center;">SL</th>
                                <th style="text-align: center;">Áp dụng</th>
                                <th style="text-align: right;">Phí Thu</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${commission.items}">
                                <td style="color: #1e293b; max-width: 200px; white-space: normal;" th:text="${item.productName}">Product</td>
                                <td style="text-align: right;" th:text="${item.unitPrice != null ? #numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'POINT') : '0'}">0</td>
                                <td style="text-align: center;" th:text="${item.quantity}">1</td>
                                <td style="text-align: center; color: #2563eb;" th:text="${item.commissionRate != null ? #numbers.formatDecimal(item.commissionRate, 1, 'POINT', 0, 'POINT') + '%' : '0%'}">0%</td>
                                <td style="text-align: right; color: #10b981; font-weight: 800;" th:text="${item.commissionAmount != null ? '+' + #numbers.formatDecimal(item.commissionAmount, 0, 'POINT', 0, 'POINT') : '0'}">0</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</th:block>
</body>
</html>
