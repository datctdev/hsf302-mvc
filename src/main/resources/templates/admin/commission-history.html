<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Lịch sử hoa hồng - Admin</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .saas-card { background: #ffffff; border-radius: 1.25rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow: hidden; margin-bottom: 1.5rem;}
        .btn-action { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; border: none; text-decoration: none;}
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #ffffff; color: #475569; border: 1px solid #cbd5e1; }
        .btn-secondary:hover { background: #f8fafc; color: #1e293b;}
        .modern-table { width: 100%; border-collapse: collapse; min-width: 900px;}
        .modern-table th { background: #f8fafc; color: #64748b; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; padding: 1rem 1.25rem; text-align: left; border-bottom: 2px solid #f1f5f9;}
        .modern-table td { padding: 1.25rem; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.875rem; vertical-align: middle; font-weight: 600;}
        .modern-table tr:hover td { background: #f8fafc; }
        .filter-input { background: white; border: 1px solid #cbd5e1; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; color: #1e293b; outline: none; }
    </style>

    <div style="background-color: #f8fafc; padding: 1.5rem; border-radius: 12px; min-height: calc(100vh - 100px);">

        <div class="saas-card" style="overflow: visible;">
            <div style="padding: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div>
                        <h1 style="font-size: 1.5rem; font-weight: 900; color: #1e293b; margin: 0 0 0.25rem 0;"><i class="fa-solid fa-clock-rotate-left text-blue-500 mr-2"></i>Lịch Sử Thu Hoa Hồng</h1>
                        <p style="color: #64748b; margin: 0; font-size: 0.875rem;">Bảng kê chi tiết tiền phí nền tảng đã thu được trên từng đơn hàng.</p>
                    </div>
                    <a th:href="@{/admin/commission}" class="btn-action btn-secondary"><i class="fa-solid fa-arrow-left"></i> Về tổng quan</a>
                </div>

                <form method="get" th:action="@{/admin/commission/orders}" style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; background: #f8fafc; padding: 1rem; border-radius: 1rem; border: 1px solid #e2e8f0;">
                    <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b;">TỪ NGÀY</label>
                        <input type="date" name="from" th:value="${param.from}" class="filter-input">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b;">ĐẾN NGÀY</label>
                        <input type="date" name="to" th:value="${param.to}" class="filter-input">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 200px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b;">TÌM TÊN GIAN HÀNG</label>
                        <input type="text" name="sellerName" th:value="${param.sellerName}" placeholder="Nhập tên shop..." class="filter-input">
                    </div>
                    <button type="submit" class="btn-action btn-primary"><i class="fa-solid fa-filter"></i> Lọc dữ liệu</button>
                </form>
            </div>
        </div>

        <div class="saas-card">
            <div style="overflow-x: auto;">
                <table class="modern-table">
                    <thead>
                    <tr>
                        <th>Thời Gian</th>
                        <th>Mã Đơn Hàng</th>
                        <th>Gian Hàng (Shop)</th>
                        <th style="text-align: right;">Tiền Hàng</th>
                        <th style="text-align: right;">Thu Nền Tảng</th>
                        <th style="text-align: center;">Chi Tiết</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(commissions)}">
                        <td colspan="6" style="text-align: center; padding: 3rem; color: #94a3b8;">Không tìm thấy lịch sử giao dịch.</td>
                    </tr>
                    <tr th:each="c : ${commissions}">
                        <td style="color: #64748b;"><i class="fa-regular fa-clock"></i> <span th:text="${#temporals.format(c.createdAt,'dd/MM/yyyy HH:mm')}">Date</span></td>
                        <td style="font-family: monospace; color: #2563eb;" th:text="${c.orderId}">ID</td>
                        <td><i class="fa-solid fa-shop text-slate-300 mr-1"></i> <span th:text="${c.sellerName}">Shop</span></td>
                        <td style="text-align: right; color: #1e293b;" th:text="${c.orderAmount != null ? #numbers.formatDecimal(c.orderAmount, 0, 'POINT', 0, 'POINT') : '0'}">0</td>
                        <td style="text-align: right; color: #10b981; font-weight: 900;" th:text="${c.commissionAmount != null ? '+' + #numbers.formatDecimal(c.commissionAmount, 0, 'POINT', 0, 'POINT') : '0'}">0</td>
                        <td style="text-align: center;">
                            <a th:href="@{'/admin/commission/orders/' + ${c.orderId}}" style="color: #2563eb; font-size: 1.1rem;" title="Xem Biên Lai"><i class="fa-solid fa-circle-info"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
