<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Đơn Hàng - Admin</title>
</head>
<body>
    <th:block th:fragment="content">
        <h2 class="text-xl font-bold text-slate-900 mb-6">Quản Lý Đơn Hàng</h2>

        <div class="flex flex-wrap gap-4 items-center mb-6">
            <label class="text-sm font-medium text-slate-700">Lọc theo trạng thái:</label>
            <select id="statusFilter" onchange="filterOrders()" class="rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <option value="">Tất cả</option>
                <option th:each="status : ${orderStatuses}" th:value="${status}" th:text="${status}" th:selected="${currentStatus != null and currentStatus.equals(status.toString())}">Status</option>
            </select>
        </div>

        <div th:if="${orders == null or orders.empty}" class="text-center py-12 rounded-xl bg-slate-50 border border-slate-200">
            <p class="text-slate-500">Chưa có đơn hàng nào.</p>
        </div>

        <div th:if="${orders != null and !orders.empty}" class="space-y-4">
            <div th:each="order : ${orders}" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 hover:shadow-card-hover transition">
                <div class="flex flex-wrap justify-between items-start gap-4 mb-4">
                    <div>
                        <h3 class="font-semibold text-slate-900" th:text="'Đơn hàng: ' + ${order.orderNumber}">Order Number</h3>
                        <p class="text-sm text-slate-500 mt-1" th:text="'Ngày đặt: ' + ${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">Date</p>
                    </div>
                    <span class="px-2.5 py-1 rounded text-sm font-medium bg-slate-100 text-slate-700"
                          th:classappend="${order.status == 'PENDING'} ? 'bg-amber-100 text-amber-800' : (${order.status == 'DELIVERED'} ? 'bg-green-100 text-green-800' : (${order.status == 'CANCELLED'} ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800'))"
                          th:text="${order.status}">Status</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
                    <div><span class="text-slate-500">Khách hàng:</span> <span th:text="${order.userName}">User</span></div>
                    <div><span class="text-slate-500">Shop:</span> <span th:text="${order.shopName}">Shop</span></div>
                    <div><span class="text-slate-500">Tổng tiền:</span> <span th:text="|${#numbers.formatDecimal(order.total, 0, 'POINT', 0, 'POINT')} VNĐ|">Total</span></div>
                    <div><span class="text-slate-500">Hoa hồng:</span> <span th:text="${order.platformCommission != null ? (#numbers.formatDecimal(order.platformCommission, 0, 'POINT', 0, 'POINT') + ' VNĐ') : '0 VNĐ'}">0 VNĐ</span></div>
                </div>
                <div class="mt-4">
                    <a th:href="@{'/admin/orders/' + ${order.id}}" class="inline-block no-underline px-4 py-2 rounded-lg bg-primary-500 text-white text-sm font-medium hover:bg-primary-600 transition">Xem Chi Tiết</a>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            function filterOrders() {
                const status = document.getElementById('statusFilter').value;
                window.location.href = '/admin/orders' + (status ? '?status=' + encodeURIComponent(status) : '');
            }
        </script>
    </th:block>
</body>
</html>
