<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Sản Phẩm - Admin</title>
</head>
<body>
    <th:block th:fragment="content">
        <h2 class="text-xl font-bold text-slate-900 mb-6">Quản Lý Sản Phẩm</h2>

        <div class="space-y-3 mb-6">
            <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
        </div>

        <form method="get" th:action="@{/admin/products}" class="flex flex-wrap gap-4 items-end mb-6">
            <input type="hidden" name="page" value="0"/>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Shop</label>
                <select name="shopId" onchange="this.form.submit()" class="rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500 min-w-[160px]">
                    <option value="">Tất cả</option>
                    <option th:each="s : ${shops}" th:value="${s.id}" th:text="${s.name}" th:selected="${currentShopId != null and currentShopId.equals(s.id)}">Shop</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Trạng thái</label>
                <select name="status" onchange="this.form.submit()" class="rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500 min-w-[120px]">
                    <option value="">Tất cả</option>
                    <option th:each="st : ${productStatuses}" th:value="${st.name()}" th:text="${st.name()}" th:selected="${currentStatus != null and currentStatus.equals(st.name())}">Status</option>
                </select>
            </div>
            <button type="submit" class="px-4 py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 transition">Lọc</button>
        </form>

        <div th:if="${products == null or products.empty}" class="text-center py-12 rounded-xl bg-slate-50 border border-slate-200">
            <p class="text-slate-500">Chưa có sản phẩm nào.</p>
        </div>

        <div th:if="${products != null and !products.empty}" class="rounded-xl border border-slate-200 overflow-hidden bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-100">
                        <tr>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Tên</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">SKU</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Shop</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Trạng thái</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Giá gốc</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Ẩn</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}" class="border-t border-slate-200 hover:bg-slate-50">
                            <td class="px-4 py-3"><a th:href="@{'/products/' + ${p.id}}" th:text="${p.name}" target="_blank" class="no-underline text-primary-600 hover:underline"></a></td>
                            <td class="px-4 py-3 text-sm text-slate-600" th:text="${p.sku}">SKU</td>
                            <td class="px-4 py-3 text-sm" th:text="${p.shop != null ? p.shop.name : 'N/A'}">Shop</td>
                            <td class="px-4 py-3">
                                <span class="px-2 py-0.5 rounded text-xs font-medium" th:classappend="${p.status.name() == 'PUBLISHED'} ? 'bg-green-100 text-green-800' : (${p.status.name() == 'DRAFT'} ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600')" th:text="${p.status.name()}">Status</span>
                            </td>
                            <td class="px-4 py-3 text-sm" th:text="${p.basePrice != null ? (#numbers.formatDecimal(p.basePrice, 0, 'POINT', 0, 'POINT') + ' đ') : 'N/A'}">Price</td>
                            <td class="px-4 py-3"><span th:if="${p.deleted}" class="px-2 py-0.5 rounded text-xs bg-red-100 text-red-800">Đã ẩn</span><span th:unless="${p.deleted}" class="text-slate-400">—</span></td>
                            <td class="px-4 py-3">
                                <div class="flex flex-wrap gap-2">
                                    <th:block th:if="${!p.deleted and p.status.name() == 'PUBLISHED'}">
                                        <form th:action="@{'/admin/products/' + ${p.id} + '/unpublish'}" method="post" class="inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="px-2 py-1 rounded text-xs font-medium border border-amber-500 text-amber-700 hover:bg-amber-50" onclick="return confirm('Gỡ xuất bản sản phẩm này?')">Gỡ xuất bản</button>
                                        </form>
                                        <form th:action="@{'/admin/products/' + ${p.id} + '/hide'}" method="post" class="inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="px-2 py-1 rounded text-xs font-medium border border-slate-300 text-slate-600 hover:bg-slate-50" onclick="return confirm('Ẩn sản phẩm khỏi danh sách?')">Ẩn</button>
                                        </form>
                                    </th:block>
                                    <th:block th:if="${!p.deleted and (p.status.name() == 'DRAFT' or p.status.name() == 'ARCHIVED')}">
                                        <form th:action="@{'/admin/products/' + ${p.id} + '/publish'}" method="post" class="inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="px-2 py-1 rounded text-xs font-medium bg-green-600 text-white hover:bg-green-700">Xuất bản</button>
                                        </form>
                                    </th:block>
                                    <th:block th:if="${p.deleted}">
                                        <form th:action="@{'/admin/products/' + ${p.id} + '/restore'}" method="post" class="inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="px-2 py-1 rounded text-xs font-medium bg-green-600 text-white hover:bg-green-700">Khôi phục</button>
                                        </form>
                                    </th:block>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${productPage.totalPages > 1}" class="flex flex-wrap items-center gap-2 px-4 py-3 border-t border-slate-200 bg-slate-50">
                <a th:if="${!productPage.first}" th:href="@{/admin/products(shopId=${currentShopId}, status=${currentStatus}, page=${productPage.number - 1}, size=${productPage.size})}" class="px-3 py-1.5 rounded border border-slate-300 text-sm font-medium hover:bg-slate-100 no-underline text-slate-700">Trước</a>
                <span class="text-sm text-slate-600" th:text="'Trang ' + (${productPage.number + 1}) + ' / ' + (${productPage.totalPages}) + ' (Tổng: ' + (${productPage.totalElements}) + ' SP)'">Trang</span>
                <a th:if="${!productPage.last}" th:href="@{/admin/products(shopId=${currentShopId}, status=${currentStatus}, page=${productPage.number + 1}, size=${productPage.size})}" class="px-3 py-1.5 rounded border border-slate-300 text-sm font-medium hover:bg-slate-100 no-underline text-slate-700">Sau</a>
            </div>
        </div>
    </th:block>
</body>
</html>
