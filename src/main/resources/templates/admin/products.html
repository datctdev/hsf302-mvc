<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Sản Phẩm - Admin</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --card-shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --border-light: #f1f5f9;
        }

        .page-wrapper { background-color: #f8fafc; padding: 1.5rem; border-radius: 12px; min-height: calc(100vh - 100px); }

        .saas-card {
            background: #ffffff; border-radius: 1.25rem; border: 1px solid var(--border-light);
            box-shadow: var(--card-shadow); overflow: hidden; display: flex; flex-direction: column;
            margin-bottom: 1.5rem;
        }

        .icon-box { width: 3rem; height: 3rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.06); flex-shrink: 0;}
        .icon-blue { background-color: #eff6ff; color: #2563eb; border: 1px solid #dbeafe; }

        /* Badges */
        .status-badge { padding: 0.35rem 0.75rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap;}
        .badge-published { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .badge-draft { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .badge-archived { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
        .badge-hidden { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }

        /* Table Hiện Đại */
        .table-wrapper { overflow-x: auto; width: 100%; }
        .modern-table { width: 100%; border-collapse: collapse; min-width: 900px; }
        .modern-table th { background: #f8fafc; color: #64748b; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; padding: 1rem 1.25rem; text-align: left; border-bottom: 2px solid #f1f5f9; white-space: nowrap;}
        .modern-table td { padding: 1rem 1.25rem; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.875rem; font-weight: 500; vertical-align: middle;}
        .modern-table tr:hover td { background: #f8fafc; }
        .modern-table tr:last-child td { border-bottom: none; }

        /* Buttons */
        .btn-sm-action { padding: 0.4rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.35rem; outline: none; border: 1px solid transparent; text-decoration: none; white-space: nowrap;}
        .btn-outline-amber { background: white; color: #d97706; border-color: #fcd34d; }
        .btn-outline-amber:hover { background: #fffbeb; border-color: #f59e0b; }
        .btn-outline-slate { background: white; color: #64748b; border-color: #cbd5e1; }
        .btn-outline-slate:hover { background: #f8fafc; border-color: #94a3b8; color: #1e293b;}
        .btn-fill-emerald { background: #10b981; color: white; box-shadow: 0 2px 4px rgba(16,185,129,0.2); }
        .btn-fill-emerald:hover { background: #059669; box-shadow: 0 4px 6px rgba(16,185,129,0.3); }

        /* Product Title Link */
        .product-link { color: #2563eb; font-weight: 700; text-decoration: none; transition: color 0.2s; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.4;}
        .product-link:hover { color: #1d4ed8; text-decoration: underline; }

        .sku-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.8rem; color: #64748b; background: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 0.25rem; }
    </style>

    <div class="page-wrapper">

        <div th:if="${success}" class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center gap-3 text-emerald-700 font-medium shadow-sm">
            <i class="fa-solid fa-circle-check text-xl"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 flex items-center gap-3 text-rose-700 font-medium shadow-sm">
            <i class="fa-solid fa-circle-exclamation text-xl"></i> <span th:text="${error}"></span>
        </div>

        <div class="saas-card" style="overflow: visible;">
            <div style="padding: 1.5rem; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1.5rem;">

                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div class="icon-box icon-blue"><i class="fa-solid fa-box-open"></i></div>
                    <div>
                        <h1 style="font-size: 1.5rem; font-weight: 900; color: #1e293b; margin: 0;">Quản Lý Sản Phẩm</h1>
                        <p style="color: #64748b; margin: 0.25rem 0 0 0; font-size: 0.875rem;">Giám sát danh mục, kiểm duyệt và quản lý trạng thái hiển thị.</p>
                    </div>
                </div>

                <form method="get" th:action="@{/admin/products}" style="margin: 0; display: flex; flex-wrap: wrap; gap: 1rem; background: #f8fafc; padding: 0.5rem; border-radius: 1rem; border: 1px solid #e2e8f0; align-items: center;">
                    <input type="hidden" name="page" value="0"/>

                    <div style="display: flex; align-items: center; gap: 0.5rem; padding-left: 0.5rem;">
                        <label style="font-size: 0.875rem; font-weight: 700; color: #475569;"><i class="fa-solid fa-store text-slate-400 mr-1"></i> Gian hàng:</label>
                        <select name="shopId" onchange="this.form.submit()" style="background: white; border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.4rem 0.75rem; font-size: 0.875rem; font-weight: 600; color: #1e293b; outline: none; cursor: pointer; min-width: 140px;">
                            <option value="">Tất cả các Shop</option>
                            <option th:each="s : ${shops}" th:value="${s.id}" th:text="${s.name}" th:selected="${currentShopId != null and currentShopId.equals(s.id)}">Shop Name</option>
                        </select>
                    </div>

                    <div style="width: 1px; height: 20px; background: #e2e8f0;"></div> <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label style="font-size: 0.875rem; font-weight: 700; color: #475569;"><i class="fa-solid fa-tags text-slate-400 mr-1"></i> Trạng thái:</label>
                    <select name="status" onchange="this.form.submit()" style="background: white; border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.4rem 0.75rem; font-size: 0.875rem; font-weight: 600; color: #1e293b; outline: none; cursor: pointer; min-width: 120px;">
                        <option value="">Tất cả trạng thái</option>
                        <option th:each="st : ${productStatuses}" th:value="${st.name()}" th:text="${st.name()}" th:selected="${currentStatus != null and currentStatus.equals(st.name())}">Status</option>
                    </select>
                </div>

                    <button type="submit" style="display: none;">Lọc</button>
                </form>
            </div>
        </div>

        <div class="saas-card" style="margin-bottom: 0;">

            <div th:if="${products != null and !products.empty}" class="table-wrapper custom-scroll">
                <table class="modern-table">
                    <thead>
                    <tr>
                        <th style="width: 30%;">Tên Sản Phẩm</th>
                        <th>Mã SKU</th>
                        <th>Gian Hàng</th>
                        <th>Trạng Thái</th>
                        <th style="text-align: right;">Giá Gốc</th>
                        <th>Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${products}">
                        <td>
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <div style="flex: 1; min-width: 0;">
                                    <a th:href="@{'/products/' + ${p.id}}" th:text="${p.name}" target="_blank" class="product-link">Tên sản phẩm</a>
                                </div>
                            </div>
                        </td>
                        <td><span class="sku-text" th:text="${p.sku}">SKU-000</span></td>
                        <td>
                                    <span style="display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 600; color: #475569;">
                                        <i class="fa-solid fa-shop text-slate-400" style="font-size: 0.75rem;"></i>
                                        <span th:text="${p.shop != null ? p.shop.name : 'N/A'}">Tên Shop</span>
                                    </span>
                        </td>
                        <td>
                            <div style="display: flex; flex-direction: column; gap: 0.35rem; align-items: flex-start;">
                                        <span class="status-badge" th:classappend="${p.status.name() == 'PUBLISHED'} ? 'badge-published' : (${p.status.name() == 'DRAFT'} ? 'badge-draft' : 'badge-archived')">
                                            <i th:classappend="${p.status.name() == 'PUBLISHED'} ? 'fa-solid fa-globe' : 'fa-solid fa-file-pen'"></i>
                                            <span th:text="${p.status.name()}"></span>
                                        </span>
                                <span th:if="${p.deleted}" class="status-badge badge-hidden" style="font-size: 0.65rem; padding: 0.2rem 0.5rem;"><i class="fa-solid fa-eye-slash"></i> Đã bị ẩn</span>
                            </div>
                        </td>
                        <td style="text-align: right; font-weight: 800; color: #1e293b;">
                            <span th:text="${p.basePrice != null ? (#numbers.formatDecimal(p.basePrice, 0, 'POINT', 0, 'POINT') + ' đ') : 'N/A'}">0 đ</span>
                        </td>
                        <td>
                            <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                                <th:block th:if="${!p.deleted and p.status.name() == 'PUBLISHED'}">
                                    <form th:action="@{'/admin/products/' + ${p.id} + '/unpublish'}" method="post" style="margin: 0;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn-sm-action btn-outline-amber" title="Gỡ khỏi gian hàng" onclick="return confirm('Gỡ xuất bản sản phẩm này?')"><i class="fa-solid fa-arrow-down-to-bracket"></i> Gỡ</button>
                                    </form>
                                    <form th:action="@{'/admin/products/' + ${p.id} + '/hide'}" method="post" style="margin: 0;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn-sm-action btn-outline-slate" title="Ẩn hoàn toàn sản phẩm" onclick="return confirm('Ẩn sản phẩm này khỏi hệ thống?')"><i class="fa-solid fa-eye-slash"></i> Ẩn</button>
                                    </form>
                                </th:block>

                                <th:block th:if="${!p.deleted and (p.status.name() == 'DRAFT' or p.status.name() == 'ARCHIVED')}">
                                    <form th:action="@{'/admin/products/' + ${p.id} + '/publish'}" method="post" style="margin: 0;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn-sm-action btn-fill-emerald" title="Đưa sản phẩm lên sàn"><i class="fa-solid fa-upload"></i> Xuất bản</button>
                                    </form>
                                </th:block>

                                <th:block th:if="${p.deleted}">
                                    <form th:action="@{'/admin/products/' + ${p.id} + '/restore'}" method="post" style="margin: 0;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn-sm-action btn-fill-emerald" title="Khôi phục sản phẩm bị ẩn"><i class="fa-solid fa-rotate-left"></i> Khôi phục</button>
                                    </form>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${productPage != null and productPage.totalPages > 1}" style="padding: 1rem 1.5rem; background: #f8fafc; border-top: 1px solid #f1f5f9; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
                <span style="font-size: 0.875rem; color: #64748b; font-weight: 600;" th:text="'Trang ' + (${productPage.number + 1}) + ' / ' + (${productPage.totalPages}) + ' (Tổng: ' + (${productPage.totalElements}) + ' SP)'">Tổng quan</span>

                <div style="display: flex; gap: 0.5rem;">
                    <a th:if="${!productPage.first}" th:href="@{/admin/products(shopId=${currentShopId}, status=${currentStatus}, page=${productPage.number - 1}, size=${productPage.size})}" class="btn-sm-action btn-outline-slate">
                        <i class="fa-solid fa-chevron-left"></i> Trước
                    </a>
                    <button th:unless="${!productPage.first}" class="btn-sm-action btn-outline-slate" style="opacity: 0.5; cursor: not-allowed;" disabled><i class="fa-solid fa-chevron-left"></i> Trước</button>

                    <a th:if="${!productPage.last}" th:href="@{/admin/products(shopId=${currentShopId}, status=${currentStatus}, page=${productPage.number + 1}, size=${productPage.size})}" class="btn-sm-action btn-outline-slate">
                        Sau <i class="fa-solid fa-chevron-right"></i>
                    </a>
                    <button th:unless="${!productPage.last}" class="btn-sm-action btn-outline-slate" style="opacity: 0.5; cursor: not-allowed;" disabled>Sau <i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div th:if="${products == null or products.empty}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 1rem; background: white;">
                <div style="width: 5rem; height: 5rem; background: #f8fafc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #cbd5e1; margin-bottom: 1rem;">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h3 style="font-size: 1.25rem; font-weight: 800; color: #334155; margin: 0 0 0.5rem 0;">Danh sách trống</h3>
                <p style="font-size: 0.875rem; color: #64748b; margin: 0;">Không tìm thấy sản phẩm nào phù hợp với bộ lọc hiện tại.</p>
            </div>

        </div>

    </div>

</th:block>

<th:block th:fragment="scripts"></th:block>
</body>
</html>
