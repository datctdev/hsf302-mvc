<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Chỉnh Sửa Hồ Sơ User - Admin</title>
</head>
<body>

<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --border-light: #f1f5f9;
        }

        .page-wrapper { background-color: #f8fafc; padding: 1.5rem; border-radius: 12px; min-height: calc(100vh - 100px); }

        .saas-card {
            background: #ffffff; border-radius: 1.25rem; border: 1px solid var(--border-light);
            box-shadow: var(--card-shadow); overflow: hidden;
        }

        .icon-box { width: 3rem; height: 3rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.06); flex-shrink: 0;}
        .icon-blue { background-color: #eff6ff; color: #2563eb; border: 1px solid #dbeafe; }

        /* Form Styling */
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.875rem; font-weight: 700; color: #334155; margin-bottom: 0.5rem; }
        .form-control {
            width: 100%; border-radius: 0.75rem; border: 1px solid #cbd5e1; padding: 0.75rem 1rem;
            font-size: 0.875rem; color: #1e293b; outline: none; transition: all 0.2s; background: #fff;
        }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

        /* Avatar Header */
        .avatar-header { background: linear-gradient(to bottom, #f8fafc 0%, #ffffff 100%); padding: 2.5rem 1.5rem; border-bottom: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center; }
        .avatar-wrap {
            width: 6rem; height: 6rem; border-radius: 1.5rem; overflow: hidden; border: 4px solid #fff;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); flex-shrink: 0; background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            display: flex; align-items: center; justify-content: center; color: white; font-size: 2.5rem; font-weight: 900;
        }
        .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

        /* Buttons */
        .btn-action { padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; border: none; outline: none; text-decoration: none; }
        .btn-primary { background: #2563eb; color: white; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { background: #1d4ed8; box-shadow: 0 6px 8px -1px rgba(37, 99, 235, 0.3); transform: translateY(-1px); }
        .btn-secondary { background: #ffffff; color: #475569; border: 1px solid #cbd5e1; }
        .btn-secondary:hover { background: #f8fafc; border-color: #94a3b8; color: #1e293b;}
    </style>

    <div class="page-wrapper">

        <div class="saas-card" style="margin-bottom: 2rem; overflow: visible;">
            <div style="padding: 1.5rem; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1.5rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div class="icon-box icon-blue"><i class="fa-solid fa-user-pen"></i></div>
                    <div>
                        <h1 style="font-size: 1.5rem; font-weight: 900; color: #1e293b; margin: 0;">Cập Nhật Hồ Sơ Người Dùng</h1>
                        <p style="color: #64748b; margin: 0.25rem 0 0 0; font-size: 0.875rem;">Điều chỉnh thông tin cá nhân, phân quyền và trạng thái hoạt động.</p>
                    </div>
                </div>
                <a th:href="@{/admin/users}" class="btn-action btn-secondary"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách</a>
            </div>
        </div>

        <div th:if="${success}" class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center gap-3 text-emerald-700 font-medium shadow-sm max-w-4xl mx-auto">
            <i class="fa-solid fa-circle-check text-xl"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 flex items-center gap-3 text-rose-700 font-medium shadow-sm max-w-4xl mx-auto">
            <i class="fa-solid fa-circle-exclamation text-xl"></i> <span th:text="${error}"></span>
        </div>

        <div class="saas-card" style="max-width: 48rem; margin: 0 auto;">
            <form th:action="@{'/admin/users/edit/' + ${user.id}}" method="post" style="margin: 0; display: flex; flex-direction: column;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="avatar-header">
                    <div class="avatar-wrap">
                        <img th:if="${user.avatarUrl != null}" th:src="${user.avatarUrl}" alt="Avatar">
                        <span th:unless="${user.avatarUrl != null}" th:text="${#strings.substring(user.fullName ?: user.email, 0, 1).toUpperCase()}">U</span>
                    </div>
                    <h2 style="margin: 1rem 0 0.25rem 0; font-size: 1.25rem; font-weight: 800; color: #1e293b;" th:text="${user?.fullName ?: 'Người dùng chưa có tên'}">User Name</h2>
                    <p style="margin: 0; color: #64748b; font-size: 0.875rem;"><i class="fa-solid fa-fingerprint"></i> ID: <span th:text="${user?.id}">-</span></p>
                </div>

                <div style="padding: 2rem;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">

                        <div class="form-group">
                            <label for="fullName" class="form-label">Họ và tên <span style="color: #ef4444;">*</span></label>
                            <input type="text" id="fullName" name="fullName" th:value="${user?.fullName}" required class="form-control" placeholder="Nhập họ và tên...">
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">Email đăng nhập <span style="color: #ef4444;">*</span></label>
                            <input type="email" id="email" name="email" th:value="${user?.email}" required class="form-control" placeholder="example@gmail.com">
                        </div>

                        <div class="form-group">
                            <label for="phoneNumber" class="form-label">Số điện thoại liên hệ</label>
                            <div style="position: relative;">
                                <div style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"><i class="fa-solid fa-phone"></i></div>
                                <input type="text" id="phoneNumber" name="phoneNumber" th:value="${user?.phoneNumber}" class="form-control" style="padding-left: 2.5rem;" placeholder="09xxxx...">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="roleName" class="form-label">Vai trò (Role) hệ thống <span style="color: #ef4444;">*</span></label>
                            <select id="roleName" name="roleName" required class="form-control" style="cursor: pointer;">
                                <option value="ROLE_BUYER" th:selected="${user != null and user.roles != null and user.roles.contains('ROLE_BUYER')}">Người mua (Buyer)</option>
                                <option value="ROLE_SELLER" th:selected="${user != null and user.roles != null and user.roles.contains('ROLE_SELLER')}">Chủ Shop (Seller)</option>
                                <option value="ROLE_ADMIN" th:selected="${user != null and user.roles != null and user.roles.contains('ROLE_ADMIN')}">Quản trị viên (Admin)</option>
                            </select>
                        </div>
                    </div>

                    <input type="hidden" name="isActive" th:value="${user?.isActive}">
                </div>

                <div style="padding: 1.25rem 2rem; background: #f8fafc; border-top: 1px solid #f1f5f9; display: flex; justify-content: flex-end; gap: 1rem;">
                    <a th:href="@{/admin/users}" class="btn-action btn-secondary">Hủy thao tác</a>
                    <button type="submit" class="btn-action btn-primary"><i class="fa-solid fa-floppy-disk"></i> Lưu Thay Đổi</button>
                </div>

            </form>
        </div>

    </div>
</th:block>

<th:block th:fragment="scripts"></th:block>

</body>
</html>
