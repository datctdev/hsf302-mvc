<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Chỉnh Sửa User - Admin</title>
</head>
<body>
    <th:block th:fragment="content">
        <h2 class="text-xl font-bold text-slate-900 mb-6">Chỉnh Sửa User</h2>

        <div class="space-y-3 mb-6">
            <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
        </div>

        <form th:action="@{'/admin/users/edit/' + ${user.id}}" method="post" class="max-w-md space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div th:if="${user != null}" class="flex justify-center mb-6">
                <img th:if="${user.avatarUrl != null}" th:src="${user.avatarUrl}" class="w-24 h-24 rounded-full object-cover" alt="Avatar">
                <div th:unless="${user.avatarUrl != null}" class="w-24 h-24 rounded-full bg-primary-500 text-white flex items-center justify-center text-2xl font-bold" th:text="${#strings.substring(user.fullName ?: user.email, 0, 1).toUpperCase()}">U</div>
            </div>
            <div>
                <label for="fullName" class="block text-sm font-medium text-slate-700 mb-1">Họ và tên *</label>
                <input type="text" id="fullName" name="fullName" th:value="${user?.fullName}" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
                <input type="email" id="email" name="email" th:value="${user?.email}" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
            </div>
            <div>
                <label for="phoneNumber" class="block text-sm font-medium text-slate-700 mb-1">Số điện thoại</label>
                <input type="text" id="phoneNumber" name="phoneNumber" th:value="${user?.phoneNumber}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
            </div>
            <div>
                <label for="roleName" class="block text-sm font-medium text-slate-700 mb-1">Role *</label>
                <select id="roleName" name="roleName" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
                    <option value="ROLE_BUYER" th:selected="${user != null and user.roles != null and user.roles.contains('ROLE_BUYER')}">Buyer</option>
                    <option value="ROLE_SELLER" th:selected="${user != null and user.roles != null and user.roles.contains('ROLE_SELLER')}">Seller</option>
                    <option value="ROLE_ADMIN" th:selected="${user != null and user.roles != null and user.roles.contains('ROLE_ADMIN')}">Admin</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <input type="checkbox" id="isActive" name="isActive" th:checked="${user != null and user.isActive}" class="rounded border-slate-300 text-primary-600 focus:ring-primary-500">
                <label for="isActive" class="text-sm font-medium text-slate-700 cursor-pointer">Đang hoạt động</label>
            </div>
            <div class="flex gap-3 pt-2">
                <a th:href="@{/admin/users}" class="no-underline px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">Hủy</a>
                <button type="submit" class="px-4 py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600">Lưu</button>
            </div>
        </form>
    </th:block>
</body>
</html>
