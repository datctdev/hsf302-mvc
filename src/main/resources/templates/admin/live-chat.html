<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Live Chat - Admin</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <div class="mb-4">
        <h1 class="text-2xl font-bold text-slate-800">Live Chat</h1>
        <p class="text-slate-600 text-sm mt-1">Tin nhắn từ khách chuyển tiếp từ chatbot. Chọn cuộc hội thoại và trả lời.</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 h-[calc(100vh-12rem)]">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
            <div class="px-4 py-3 border-b border-slate-200 font-semibold text-slate-700">Cuộc hội thoại</div>
            <div id="live-chat-list" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>
            <div id="live-chat-empty" class="flex-1 flex items-center justify-center text-slate-400 text-sm p-4">Chưa có tin nhắn nào. Khách bấm "Gặp nhân viên" trong chatbot sẽ xuất hiện ở đây.</div>
        </div>
        <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
            <div id="live-chat-header" class="px-4 py-3 border-b border-slate-200 text-slate-500 text-sm hidden">Chọn một cuộc hội thoại</div>
            <div id="live-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div id="live-chat-reply-area" class="p-3 border-t border-slate-200 hidden">
                <div class="flex gap-2">
                    <input type="text" id="live-chat-reply-input" placeholder="Nhập tin nhắn trả lời..." maxlength="2000" class="flex-1 rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 outline-none"/>
                    <button type="button" id="live-chat-reply-btn" class="px-4 py-2.5 rounded-xl bg-blue-600 text-white hover:bg-blue-700 text-sm font-medium">
                        <i class="fa-solid fa-paper-plane mr-1"></i> Gửi
                    </button>
                </div>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <script th:inline="javascript">
        (function() {
            var listEl = document.getElementById('live-chat-list');
            var emptyEl = document.getElementById('live-chat-empty');
            var headerEl = document.getElementById('live-chat-header');
            var messagesEl = document.getElementById('live-chat-messages');
            var replyArea = document.getElementById('live-chat-reply-area');
            var replyInput = document.getElementById('live-chat-reply-input');
            var replyBtn = document.getElementById('live-chat-reply-btn');
            var wsPath = /*[[@{/ws-chat}]]*/ '/ws-chat';
            var base = window.location.origin || '';
            var conversations = {};
            var selectedSessionId = null;
            var stompClient = null;

            function ensureStomp() {
                if (stompClient && stompClient.connected) return Promise.resolve();
                return new Promise(function(resolve, reject) {
                    stompClient = new StompJs.Client({ webSocketFactory: function() { return new SockJS(base + wsPath); } });
                    stompClient.onConnect = function() {
                        stompClient.subscribe('/topic/admin/live-chat', function(msg) {
                            var data = msg.body ? JSON.parse(msg.body) : {};
                            var sid = data.sessionId || 'unknown';
                            if (!conversations[sid]) conversations[sid] = [];
                            conversations[sid].push({ from: data.from || 'Khách', text: data.text || '', fromAdmin: false });
                            renderList();
                            if (selectedSessionId === sid) renderMessages(sid);
                        });
                        resolve();
                    };
                    stompClient.onStompError = function() { reject(new Error('STOMP error')); };
                    stompClient.activate();
                });
            }

            function renderList() {
                var ids = Object.keys(conversations);
                if (ids.length === 0) {
                    emptyEl.classList.remove('hidden');
                    listEl.classList.add('hidden');
                    return;
                }
                emptyEl.classList.add('hidden');
                listEl.classList.remove('hidden');
                listEl.innerHTML = ids.map(function(sid) {
                    var last = conversations[sid][conversations[sid].length - 1];
                    var label = last.from || sid.substring(0, 8);
                    var active = selectedSessionId === sid ? ' bg-blue-50 border-l-4 border-blue-600' : '';
                    return '<button type="button" class="w-full text-left px-4 py-3 hover:bg-slate-50 border-b border-slate-100' + active + '" data-session-id="' + sid + '">' +
                        '<span class="font-medium text-slate-800 block truncate">' + label + '</span>' +
                        '<span class="text-xs text-slate-500">' + sid.substring(0, 12) + '...</span></button>';
                }).join('');
                listEl.querySelectorAll('button').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        selectedSessionId = btn.getAttribute('data-session-id');
                        renderList();
                        renderMessages(selectedSessionId);
                        headerEl.textContent = 'Session: ' + selectedSessionId.substring(0, 12) + '...';
                        headerEl.classList.remove('hidden');
                        replyArea.classList.remove('hidden');
                    });
                });
            }

            function renderMessages(sessionId) {
                var msgs = conversations[sessionId] || [];
                messagesEl.innerHTML = msgs.map(function(m) {
                    var isAdmin = m.fromAdmin;
                    return '<div class="flex justify-' + (isAdmin ? 'end' : 'start') + '">' +
                        '<div class="max-w-[80%] rounded-xl px-4 py-2 ' + (isAdmin ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-800') + '">' +
                        (isAdmin ? '' : '<span class="text-xs font-semibold text-slate-500">' + m.from + '</span><br/>') +
                        '<span class="text-sm">' + (m.text || '').replace(/</g, '&lt;') + '</span></div></div>';
                }).join('');
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function sendReply() {
                var text = (replyInput.value || '').trim();
                if (!text || !selectedSessionId || !stompClient || !stompClient.connected) return;
                stompClient.publish({ destination: '/app/chat/reply', body: JSON.stringify({ sessionId: selectedSessionId, text: text }) });
                if (!conversations[selectedSessionId]) conversations[selectedSessionId] = [];
                conversations[selectedSessionId].push({ from: 'Admin', text: text, fromAdmin: true });
                replyInput.value = '';
                renderMessages(selectedSessionId);
            }

            replyBtn.addEventListener('click', sendReply);
            replyInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendReply(); });

            ensureStomp().then(function() { renderList(); }).catch(function() {
                emptyEl.textContent = 'Không thể kết nối. Đảm bảo bạn đã đăng nhập Admin.';
            });
        })();
    </script>
</th:block>
</body>
</html>
