<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Cấu hình hoa hồng - Admin</title>
</head>
<body>
    <th:block th:fragment="content">
        <h2 class="text-xl font-bold text-slate-900 mb-2">Cấu hình hoa hồng nền tảng</h2>
        <p class="text-slate-600 text-sm mb-6">
            Tỷ lệ hoa hồng được áp dụng trên giá trị sản phẩm (subtotal) của mỗi đơn hàng.
            Ví dụ: sản phẩm 100.000đ, 10% → nền tảng thu 10.000đ. Chỉ đơn hàng mới sau khi cập nhật sẽ dùng tỷ lệ mới.
        </p>

        <div class="space-y-3 mb-6">
            <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
        </div>

        <div class="max-w-md rounded-xl border border-slate-200 bg-white p-6">
            <p class="text-sm text-slate-700 mb-4"><strong>Tỷ lệ hiện tại:</strong> <span th:text="${commissionRate != null ? commissionRate + '%' : '0%'}">0%</span></p>
            <form th:action="@{/admin/commission}" method="post" th:object="${updateCommissionRateRequest}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-4">
                    <label for="commissionRate" class="block text-sm font-medium text-slate-700 mb-1">Tỷ lệ hoa hồng (%)</label>
                    <input type="number" id="commissionRate" th:field="*{commissionRate}" step="0.01" min="0" max="100" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
                    <div th:if="${#fields.hasErrors('commissionRate')}" class="mt-1 text-sm text-red-600" th:errors="*{commissionRate}"></div>
                </div>
                <button type="submit" class="px-4 py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600">Cập nhật</button>
            </form>
            <hr class="my-8 border-slate-200">
            <div class="flex flex-wrap gap-3">
                <a th:href="@{/admin/commission/categories}" class="no-underline px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">Cấu hình hoa hồng theo danh mục</a>
                <a th:href="@{/admin/commission/orders}" class="no-underline px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">Xem lịch sử hoa hồng (Audit)</a>
            </div>
        </div>
    </th:block>
</body>
</html>
