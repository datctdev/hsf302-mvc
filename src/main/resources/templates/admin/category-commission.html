<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Cấu hình hoa hồng theo danh mục - Admin</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .saas-card { background: #ffffff; border-radius: 1.25rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow: hidden; }
        .btn-action { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; border: none; text-decoration: none;}
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #ffffff; color: #475569; border: 1px solid #cbd5e1; }
        .btn-secondary:hover { background: #f8fafc; color: #1e293b;}
        .modern-table { width: 100%; border-collapse: collapse; }
        .modern-table th { background: #f8fafc; color: #64748b; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; padding: 1rem 1.25rem; text-align: left; border-bottom: 2px solid #f1f5f9;}
        .modern-table td { padding: 1rem 1.25rem; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.875rem; vertical-align: middle; font-weight: 600;}
        .modern-table tr:hover td { background: #f8fafc; }
    </style>

    <div style="background-color: #f8fafc; padding: 1.5rem; border-radius: 12px; min-height: calc(100vh - 100px);">

        <div class="saas-card" style="margin-bottom: 1.5rem;">
            <div style="padding: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 style="font-size: 1.5rem; font-weight: 900; color: #1e293b; margin: 0 0 0.25rem 0;"><i class="fa-solid fa-list-check text-blue-500 mr-2"></i>Cấu Hình Theo Danh Mục</h1>
                    <p style="color: #64748b; margin: 0; font-size: 0.875rem;">Ghi đè tỷ lệ hoa hồng mặc định cho các ngành hàng đặc thù.</p>
                </div>
                <a th:href="@{/admin/commission}" class="btn-action btn-secondary"><i class="fa-solid fa-arrow-left"></i> Về tổng quan</a>
            </div>
        </div>

        <div class="saas-card">
            <div class="overflow-x-auto">
                <table class="modern-table">
                    <thead>
                    <tr>
                        <th style="width: 40%;">Tên Danh Mục</th>
                        <th style="width: 25%;">Đang Áp Dụng</th>
                        <th>Thao tác cập nhật</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(categoryCommissions)}">
                        <td colspan="3" style="text-align: center; color: #94a3b8; padding: 3rem;">Chưa có danh mục nào trên hệ thống.</td>
                    </tr>
                    <tr th:each="item : ${categoryCommissions}">
                        <td><i class="fa-solid fa-tag text-slate-300 mr-2"></i> <span th:text="${item.categoryName}">Name</span></td>
                        <td style="color: #10b981; font-weight: 800;" th:text="${item.commissionRate != null ? #numbers.formatDecimal(item.commissionRate, 1, 'POINT', 0, 'POINT') + '%' : '0%'}">0%</td>
                        <td>
                            <form th:action="@{'/admin/commission/categories/' + ${item.categoryId}}" method="post" style="margin: 0; display: flex; align-items: center; gap: 0.5rem;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <div style="display: flex; align-items: center; background: white; border: 1px solid #cbd5e1; border-radius: 0.5rem; overflow: hidden; max-width: 120px;">
                                    <input type="number" name="commissionRate" step="0.01" min="0" max="100" required style="width: 100%; border: none; padding: 0.4rem 0.5rem; font-size: 0.875rem; font-weight: 700; outline: none;" placeholder="Mới...">
                                    <span style="padding: 0.4rem 0.5rem; background: #f8fafc; color: #64748b; font-size: 0.75rem; border-left: 1px solid #cbd5e1;"><i class="fa-solid fa-percent"></i></span>
                                </div>
                                <button type="submit" class="btn-action btn-primary" style="padding: 0.45rem 0.75rem;"><i class="fa-solid fa-save"></i> Cập nhật</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
