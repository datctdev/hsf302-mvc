<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cấu hình hoa hồng theo danh mục</title>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .commission-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            background-color: #fff;
        }

        .commission-table th,
        .commission-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        .commission-table th {
            background-color: #f9fafb;
            font-weight: 600;
        }

        .input-commission {
            width: 120px;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.85rem;
        }

        .description {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .empty-message {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header-admin}"></th:block>
<th:block th:replace="~{fragments/nav-admin :: nav-admin}"></th:block>

<main class="main-content admin-content">
    <div class="container">

        <div class="section">
            <h2>Cấu hình hoa hồng theo danh mục</h2>

            <p class="description">
                Nếu danh mục không có cấu hình riêng, hệ thống sẽ sử dụng tỷ lệ hoa hồng mặc định của nền tảng.
            </p>

            <table class="commission-table">
                <thead>
                <tr>
                    <th>Danh mục</th>
                    <th>Hoa hồng hiện tại</th>
                    <th>Cập nhật</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${categoryCommissions}">
                    <td th:text="${item.categoryName}">Category Name</td>

                    <td>
                        <span th:text="${item.commissionRate + '%'}">0%</span>
                    </td>

                    <td>
                        <form th:action="@{'/admin/commission/categories/' + ${item.categoryId}}"
                              method="post">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}" />

                            <input type="number"
                                   name="commissionRate"
                                   step="0.01"
                                   min="0"
                                   max="100"
                                   required
                                   class="input-commission"/>

                            <button type="submit" class="btn btn-primary btn-sm">
                                Cập nhật
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(categoryCommissions)}">
                    <td colspan="3" class="empty-message">
                        Chưa có cấu hình hoa hồng theo danh mục.
                    </td>
                </tr>
                </tbody>
            </table>
            <br>
            <a th:href="@{/admin/commission}" class="btn btn-secondary">
                Quay lại
            </a>
        </div>
    </div>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin.js}"></script>

</body>
</html>
