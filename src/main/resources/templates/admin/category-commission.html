<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Cấu hình hoa hồng theo danh mục - Admin</title>
</head>
<body>
    <th:block th:fragment="content">
        <h2 class="text-xl font-bold text-slate-900 mb-2">Cấu hình hoa hồng theo danh mục</h2>
        <p class="text-slate-600 text-sm mb-6">
            Nếu danh mục không có cấu hình riêng, hệ thống sẽ sử dụng tỷ lệ hoa hồng mặc định của nền tảng.
        </p>

        <div class="rounded-xl border border-slate-200 overflow-hidden bg-white">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-100">
                        <tr>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Danh mục</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Hoa hồng hiện tại</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Cập nhật</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${categoryCommissions}" class="border-t border-slate-200 hover:bg-slate-50">
                            <td class="px-4 py-3 text-sm" th:text="${item.categoryName}">Category Name</td>
                            <td class="px-4 py-3 text-sm" th:text="${item.commissionRate + '%'}">0%</td>
                            <td class="px-4 py-3">
                                <form th:action="@{'/admin/commission/categories/' + ${item.categoryId}}" method="post" class="inline flex items-center gap-2">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="number" name="commissionRate" step="0.01" min="0" max="100" required class="w-28 rounded-lg border border-slate-300 px-2 py-1.5 text-sm focus:ring-2 focus:ring-primary-500"/>
                                    <button type="submit" class="px-3 py-1.5 rounded-lg bg-primary-500 text-white text-sm font-medium hover:bg-primary-600">Cập nhật</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categoryCommissions)}">
                            <td colspan="3" class="px-4 py-8 text-center text-slate-500">Chưa có cấu hình hoa hồng theo danh mục.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-6">
            <a th:href="@{/admin/commission}" class="no-underline px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">Quay lại</a>
        </div>
    </th:block>
</body>
</html>
