<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Đánh Giá - Admin</title>
</head>
<body>
    <th:block th:fragment="content">
        <h1 class="text-xl font-bold text-slate-900 mb-6">Quản Lý Đánh Giá</h1>

        <div class="flex border-b border-slate-200 mb-6">
            <a th:href="@{/admin/reviews(tab='list')}" class="px-4 py-3 font-medium border-b-2 -mb-px no-underline transition" th:classappend="${currentTab == 'list'} ? 'border-primary-500 text-primary-600' : 'border-transparent text-slate-600 hover:text-primary-600'">Tất cả đánh giá</a>
            <a th:href="@{/admin/reviews(tab='reports')}" class="px-4 py-3 font-medium border-b-2 -mb-px no-underline transition flex items-center gap-2" th:classappend="${currentTab == 'reports'} ? 'border-primary-500 text-primary-600' : 'border-transparent text-slate-600 hover:text-primary-600'">
                Báo cáo vi phạm
                <span th:if="${pendingReportCount > 0}" class="bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full" th:text="${pendingReportCount}">0</span>
            </a>
        </div>

        <div th:if="${currentTab == 'list'}">
            <form method="get" th:action="@{/admin/reviews}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-end p-4 rounded-xl bg-white border border-slate-200 mb-6">
                <input type="hidden" name="tab" value="list">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Gian hàng (Shop)</label>
                    <select name="shopId" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
                        <option value="">Tất cả Shop</option>
                        <option th:each="shop : ${shops}" th:value="${shop.id}" th:text="${shop.name}" th:selected="${currentShopId != null and currentShopId.equals(shop.id)}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Tìm kiếm</label>
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Email user, tên sản phẩm..." class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Số sao</label>
                    <select name="rating" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
                        <option value="">Tất cả</option>
                        <option value="5" th:selected="${currentRating == 5}">⭐⭐⭐⭐⭐</option>
                        <option value="4" th:selected="${currentRating == 4}">⭐⭐⭐⭐</option>
                        <option value="3" th:selected="${currentRating == 3}">⭐⭐⭐</option>
                        <option value="2" th:selected="${currentRating == 2}">⭐⭐</option>
                        <option value="1" th:selected="${currentRating == 1}">⭐</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Trạng thái</label>
                    <select name="status" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500">
                        <option value="">Tất cả</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${currentStatus == st}"></option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="px-4 py-2 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600">Lọc</button>
                    <a th:href="@{/admin/reviews(tab='list')}" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50 no-underline">Reset</a>
                </div>
            </form>

            <div class="rounded-xl border border-slate-200 overflow-hidden bg-white">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-slate-100">
                            <tr>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900 w-64">Sản phẩm</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900 w-52">Người đánh giá</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Nội dung đánh giá</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900 w-28">Trạng thái</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900 w-24">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${reviewPage.empty}">
                                <td colspan="5" class="px-4 py-8 text-center text-slate-500">Không tìm thấy đánh giá nào.</td>
                            </tr>
                            <tr th:each="review : ${reviewPage.content}" class="border-t border-slate-200 hover:bg-slate-50 align-top">
                                <td class="px-4 py-3">
                                    <div class="flex gap-2 max-w-[280px]">
                                        <img th:if="${review.product.images.size() > 0}" th:src="${review.product.images.iterator().next().imageUrl}" class="w-12 h-12 rounded object-cover border border-slate-200 flex-shrink-0">
                                        <div th:unless="${review.product.images.size() > 0}" class="w-12 h-12 rounded bg-slate-100 flex-shrink-0"></div>
                                        <div class="min-w-0">
                                            <a th:href="@{'/products/' + ${review.product.id}}" target="_blank" class="text-sm font-medium text-primary-600 hover:underline line-clamp-2 no-underline" th:text="${review.product.name}"></a>
                                            <div class="text-xs text-slate-500">Shop: <span th:text="${review.product.shop.name}"></span></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-4 py-3">
                                    <div class="flex items-center gap-2">
                                        <img th:if="${review.user.avatarUrl}" th:src="${review.user.avatarUrl}" class="w-8 h-8 rounded-full object-cover bg-slate-100">
                                        <div th:unless="${review.user.avatarUrl}" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold" th:text="${#strings.substring(review.user.email, 0, 1).toUpperCase()}">U</div>
                                        <div>
                                            <div class="text-sm font-medium text-slate-900" th:text="${review.user.fullName ?: 'No Name'}"></div>
                                            <div class="text-xs text-slate-500" th:text="${review.user.email}"></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-4 py-3">
                                    <div class="text-amber-500 text-sm"><span th:each="i : ${#numbers.sequence(1, 5)}" th:text="${i <= review.rating ? '★' : '☆'}"></span></div>
                                    <div class="text-sm text-slate-600 mt-0.5" th:text="${review.comment}"></div>
                                    <div th:if="${not #lists.isEmpty(review.images)}" class="flex gap-1 mt-2 flex-wrap">
                                        <img th:each="img : ${review.images}" th:src="${img.imageUrl}" class="w-14 h-14 rounded object-cover border border-slate-200 cursor-pointer hover:opacity-90" onclick="window.open(this.src, '_blank')">
                                    </div>
                                </td>
                                <td class="px-4 py-3">
                                    <span class="px-2 py-0.5 rounded text-xs font-medium" th:classappend="${review.status.name() == 'ACTIVE'} ? 'bg-green-100 text-green-800' : (${review.status.name() == 'HIDDEN'} ? 'bg-slate-100 text-slate-600' : 'bg-red-100 text-red-800')" th:text="${review.status}"></span>
                                </td>
                                <td class="px-4 py-3">
                                    <form th:action="@{'/admin/reviews/' + ${review.id} + '/toggle-status'}" method="post" class="inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button th:if="${review.status.name() == 'ACTIVE'}" type="submit" class="text-xs px-2 py-1 rounded border border-red-500 text-red-600 hover:bg-red-50" onclick="return confirm('Ẩn đánh giá này?')">Ẩn</button>
                                        <button th:if="${review.status.name() == 'HIDDEN' or review.status.name() == 'DISABLED'}" type="submit" class="text-xs px-2 py-1 rounded border border-green-500 text-green-600 hover:bg-green-50">Hiện</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${reviewPage.totalPages > 1}" class="flex items-center gap-2 px-4 py-3 border-t border-slate-200 bg-slate-50">
                    <a th:if="${reviewPage.hasPrevious()}" th:href="@{/admin/reviews(tab='list', keyword=${keyword}, rating=${currentRating}, status=${currentStatus}, shopId=${currentShopId}, page=${reviewPage.number - 1})}" class="px-3 py-1.5 rounded border border-slate-300 text-sm font-medium hover:bg-slate-100 no-underline text-slate-700">Trước</a>
                    <span class="text-sm text-slate-600" th:text="${reviewPage.number + 1}">1</span>
                    <a th:if="${reviewPage.hasNext()}" th:href="@{/admin/reviews(tab='list', keyword=${keyword}, rating=${currentRating}, status=${currentStatus}, shopId=${currentShopId}, page=${reviewPage.number + 1})}" class="px-3 py-1.5 rounded border border-slate-300 text-sm font-medium hover:bg-slate-100 no-underline text-slate-700">Sau</a>
                </div>
            </div>
        </div>

        <div th:if="${currentTab == 'reports'}">
            <div class="rounded-xl border border-slate-200 overflow-hidden bg-white">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-slate-100">
                            <tr>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900 w-2/5">Nội dung Review</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900 w-3/10">Thông tin báo cáo</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900 w-3/10">Xử lý</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${reportedReviews == null || reportedReviews.empty}">
                                <td colspan="3" class="px-4 py-8 text-center text-slate-500">Không có báo cáo nào cần xử lý.</td>
                            </tr>
                            <tr th:each="report : ${reportedReviews}" class="border-t border-slate-200 hover:bg-slate-50 align-top">
                                <td class="px-4 py-3">
                                    <div class="font-medium text-slate-900 mb-1">Review ID: <span class="font-normal text-slate-500" th:text="${#strings.substring(report.reviewId, 0, 8) + '...'}"></span></div>
                                    <div class="text-sm text-slate-600" th:text="${report.reviewContent}"></div>
                                    <div class="text-sm text-slate-500 mt-2">Người viết: <strong th:text="${report.reviewOwnerEmail}"></strong></div>
                                </td>
                                <td class="px-4 py-3">
                                    <div class="text-red-600 font-semibold text-sm mb-2">⚠️ Tổng cộng: <span th:text="${report.reportCount}"></span> báo cáo</div>
                                    <div th:each="detail : ${report.reports}" class="bg-red-50 border border-red-200 rounded-lg p-2 mb-2 text-sm text-red-800">
                                        <strong th:text="${detail.reason}">Reason</strong>
                                        <div th:if="${detail.note}" th:text="|Ghi chú: ${detail.note}|" class="italic"></div>
                                        <div class="text-xs text-slate-500 mt-1">Bởi: <span th:text="${detail.reporterEmail}"></span> - <span th:text="${#temporals.format(detail.createdAt, 'dd/MM HH:mm')}"></span></div>
                                    </div>
                                </td>
                                <td class="px-4 py-3">
                                    <div class="flex flex-col gap-2">
                                        <form th:action="@{'/admin/reviews/' + ${report.reviewId} + '/hide-report'}" method="post">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="w-full px-3 py-1.5 rounded text-sm font-medium bg-red-600 text-white hover:bg-red-700" onclick="return confirm('Xác nhận ẩn review này và đánh dấu đã xử lý báo cáo?')">Ẩn Review (Phạt)</button>
                                        </form>
                                        <form th:action="@{'/admin/reviews/' + ${report.reviewId} + '/ignore-report'}" method="post">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="w-full px-3 py-1.5 rounded text-sm font-medium border border-slate-300 text-slate-700 hover:bg-slate-50" onclick="return confirm('Review này hợp lệ? Bỏ qua báo cáo?')">Bỏ qua báo cáo</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
