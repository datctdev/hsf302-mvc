<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Users - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <h2 class="text-xl font-bold text-base-content mb-6">Quản Lý Users</h2>

        <div class="flex flex-wrap gap-4 items-center mb-6">
            <div class="form-control flex-row items-center gap-2">
                <label class="label"><span class="label-text">Lọc theo role:</span></label>
                <select id="roleFilter" class="select select-bordered select-sm">
                    <option value="">Tất cả</option>
                    <option value="ROLE_BUYER">Buyer</option>
                    <option value="ROLE_SELLER">Seller</option>
                    <option value="ROLE_ADMIN">Admin</option>
                </select>
            </div>
            <div class="form-control flex-row items-center gap-2">
                <label class="label"><span class="label-text">Trạng thái:</span></label>
                <select id="statusFilter" class="select select-bordered select-sm">
                    <option value="">Tất cả</option>
                    <option value="true">Đang hoạt động</option>
                    <option value="false">Đã vô hiệu hóa</option>
                </select>
            </div>
        </div>

        <div class="space-y-3 mb-6">
            <div th:if="${success}" class="alert alert-success text-sm" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error text-sm" th:text="${error}"></div>
        </div>

        <div id="usersContainer" class="space-y-4">
            <div th:if="${users != null and !users.empty}" th:each="user : ${users}" class="user-card card bg-base-100 border border-base-200 shadow-sm"
                 th:attr="data-roles=${#strings.listJoin(user.roles, ',')}, data-active=${user.isActive}">
                <div class="card-body">
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="avatar">
                            <div class="w-12 rounded-full" th:if="${user.avatarUrl != null}">
                                <img th:src="${user.avatarUrl}" alt="Avatar">
                            </div>
                            <div th:unless="${user.avatarUrl != null}" class="w-12 rounded-full bg-primary text-primary-content flex items-center justify-center font-semibold">
                                <span th:text="${#strings.substring(user.fullName ?: user.email, 0, 1).toUpperCase()}">U</span>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-semibold text-base-content m-0" th:text="${user.fullName ?: user.email}">User Name</h3>
                            <span class="badge badge-sm mt-1" th:classappend="${user.isActive} ? 'badge-success' : 'badge-ghost'" th:text="${user.isActive} ? 'Đang hoạt động' : 'Đã vô hiệu hóa'">Status</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-4 text-sm">
                        <div class="detail-item"><span class="text-base-content/60">Email:</span> <span th:text="${user.email}">Email</span></div>
                        <div class="detail-item"><span class="text-base-content/60">Số điện thoại:</span> <span th:text="${user.phoneNumber ?: 'N/A'}">Phone</span></div>
                        <div class="detail-item"><span class="text-base-content/60">Roles:</span> <span class="roles-text" th:text="${#strings.listJoin(user.roles, ', ')}">Roles</span></div>
                        <div class="detail-item"><span class="text-base-content/60">Ngày tạo:</span> <span th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">Date</span></div>
                    </div>
                    <div class="card-actions flex-wrap gap-2 mt-4">
                        <a th:href="@{'/admin/users/edit/' + ${user.id}}" class="btn btn-primary btn-sm">Chỉnh sửa</a>
                        <form th:if="${user.isActive}" th:action="@{'/admin/users/' + ${user.id} + '/deactivate'}" method="post" class="inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-warning btn-outline btn-sm" onclick="return confirm('Bạn có chắc muốn vô hiệu hóa user này?')">Vô hiệu hóa</button>
                        </form>
                        <form th:unless="${user.isActive}" th:action="@{'/admin/users/' + ${user.id} + '/activate'}" method="post" class="inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-success btn-sm">Kích hoạt</button>
                        </form>
                    </div>
                </div>
            </div>
            <div th:if="${users == null or users.empty}" class="card bg-base-200/50 border border-base-200">
                <div class="card-body items-center text-center py-12">
                    <p class="text-base-content/60">Không có users nào</p>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var roleFilter = document.getElementById('roleFilter');
                var statusFilter = document.getElementById('statusFilter');
                if (roleFilter) roleFilter.addEventListener('change', filterUsers);
                if (statusFilter) statusFilter.addEventListener('change', filterUsers);
            });
            function filterUsers() {
                var roleFilter = document.getElementById('roleFilter').value;
                var statusFilter = document.getElementById('statusFilter').value;
                var cards = document.querySelectorAll('#usersContainer .user-card');
                cards.forEach(function(card) {
                    var show = true;
                    if (roleFilter) {
                        var roles = (card.getAttribute('data-roles') || '').split(',');
                        if (roles.indexOf(roleFilter) === -1) show = false;
                    }
                    if (statusFilter !== '') {
                        var active = card.getAttribute('data-active') === 'true';
                        if ((statusFilter === 'true' && !active) || (statusFilter === 'false' && active)) show = false;
                    }
                    card.style.display = show ? 'block' : 'none';
                });
            }
        </script>
    </th:block>
</body>
</html>
