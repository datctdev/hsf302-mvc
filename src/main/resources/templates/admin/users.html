<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Users - Admin</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --card-shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --border-light: #f1f5f9;
        }

        .page-wrapper { background-color: #f8fafc; padding: 1.5rem; border-radius: 12px; min-height: calc(100vh - 100px); }

        .saas-card {
            background: #ffffff; border-radius: 1.25rem; border: 1px solid var(--border-light);
            box-shadow: var(--card-shadow); transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .saas-card:hover { transform: translateY(-4px); box-shadow: var(--card-shadow-hover); border-color: #e2e8f0; }

        .icon-box { width: 3rem; height: 3rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.06); flex-shrink: 0;}
        .icon-blue { background-color: #eff6ff; color: #2563eb; border: 1px solid #dbeafe; }

        /* Nút thao tác */
        .btn-action { padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.375rem; border: none; outline: none; text-decoration: none; justify-content: center;}
        .btn-edit { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .btn-edit:hover { background: #dbeafe; }
        .btn-deactivate { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
        .btn-deactivate:hover { background: #ffe4e6; border-color: #fca5a5; }
        .btn-activate { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .btn-activate:hover { background: #d1fae5; border-color: #6ee7b7; }

        /* Avatar User */
        .user-avatar-wrap { width: 4rem; height: 4rem; border-radius: 1.2rem; overflow: hidden; border: 2px solid #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); flex-shrink: 0; background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; font-weight: bold;}
        .user-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

        /* Status & Roles */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-active { background-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        .dot-inactive { background-color: #94a3b8; box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.2); }

        .role-badge { padding: 0.2rem 0.5rem; border-radius: 0.5rem; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid transparent; }
        .role-admin { background: #faf5ff; color: #7c3aed; border-color: #e9d5ff; }
        .role-seller { background: #fffbeb; color: #d97706; border-color: #fde68a; }
        .role-buyer { background: #f0fdfa; color: #0d9488; border-color: #ccfbf1; }

        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    </style>

    <div class="page-wrapper">

        <div th:if="${success}" class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center gap-3 text-emerald-700 font-medium shadow-sm">
            <i class="fa-solid fa-circle-check text-xl"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 flex items-center gap-3 text-rose-700 font-medium shadow-sm">
            <i class="fa-solid fa-circle-exclamation text-xl"></i> <span th:text="${error}"></span>
        </div>

        <div class="saas-card" style="margin-bottom: 2rem; overflow: visible;">
            <div style="padding: 1.5rem; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1.5rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div class="icon-box icon-blue"><i class="fa-solid fa-users"></i></div>
                    <div>
                        <h1 style="font-size: 1.5rem; font-weight: 900; color: #1e293b; margin: 0;">Quản Lý Users</h1>
                        <p style="color: #64748b; margin: 0.25rem 0 0 0; font-size: 0.875rem;">Giám sát, phân quyền và quản lý trạng thái tài khoản người dùng.</p>
                    </div>
                </div>

                <div style="display: flex; flex-wrap: wrap; gap: 1rem; background: #f8fafc; padding: 0.5rem; border-radius: 1rem; border: 1px solid #e2e8f0;">
                    <div style="display: flex; align-items: center; gap: 0.5rem; padding-left: 0.5rem;">
                        <label for="roleFilter" style="font-size: 0.875rem; font-weight: 700; color: #475569;"><i class="fa-solid fa-user-shield text-slate-400 mr-1"></i> Phân quyền:</label>
                        <select id="roleFilter" onchange="filterUsers()" style="background: white; border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.4rem 0.75rem; font-size: 0.875rem; font-weight: 600; color: #1e293b; outline: none; cursor: pointer;">
                            <option value="">Tất cả</option>
                            <option value="ROLE_BUYER">Người mua (Buyer)</option>
                            <option value="ROLE_SELLER">Người bán (Seller)</option>
                            <option value="ROLE_ADMIN">Quản trị viên (Admin)</option>
                        </select>
                    </div>
                    <div style="width: 1px; background: #e2e8f0;"></div>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <label for="statusFilter" style="font-size: 0.875rem; font-weight: 700; color: #475569;"><i class="fa-solid fa-toggle-on text-slate-400 mr-1"></i> Trạng thái:</label>
                        <select id="statusFilter" onchange="filterUsers()" style="background: white; border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.4rem 0.75rem; font-size: 0.875rem; font-weight: 600; color: #1e293b; outline: none; cursor: pointer;">
                            <option value="">Tất cả</option>
                            <option value="true">Đang hoạt động</option>
                            <option value="false">Đã vô hiệu hóa</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="usersContainer" class="users-grid">

            <div th:if="${users != null and !users.empty}" th:each="user : ${users}" class="saas-card user-card"
                 th:attr="data-roles=${user.roles != null ? #strings.listJoin(user.roles, ',') : ''}, data-active=${user.isActive != null ? user.isActive : false}">

                <div style="padding: 1.5rem; display: flex; flex-direction: column; height: 100%;">

                    <div style="display: flex; gap: 1rem; align-items: flex-start; border-bottom: 1px solid #f1f5f9; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <div class="user-avatar-wrap">
                            <img th:if="${user.avatarUrl != null}" th:src="${user.avatarUrl}" alt="Avatar">
                            <span th:unless="${user.avatarUrl != null}" th:text="${#strings.substring(user.fullName ?: user.email, 0, 1).toUpperCase()}">U</span>
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;">
                                <h3 style="font-size: 1.125rem; font-weight: 800; color: #1e293b; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${user.fullName ?: 'Chưa cập nhật tên'}">User Name</h3>
                                <div style="display: flex; align-items: center; gap: 0.35rem;" th:title="${user.isActive != null and user.isActive ? 'Đang hoạt động' : 'Đã vô hiệu hóa'}">
                                    <span class="status-dot" th:classappend="${user.isActive != null and user.isActive} ? 'dot-active animate-pulse' : 'dot-inactive'"></span>
                                </div>
                            </div>
                            <p style="font-size: 0.8rem; color: #64748b; margin: 0.25rem 0 0.5rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><i class="fa-regular fa-envelope"></i> <span th:text="${user.email}">Email</span></p>

                            <div th:if="${user.roles != null}" style="display: flex; flex-wrap: wrap; gap: 0.25rem;">
                                    <span th:each="role : ${user.roles}"
                                          class="role-badge"
                                          th:classappend="${role == 'ROLE_ADMIN'} ? 'role-admin' : (${role == 'ROLE_SELLER'} ? 'role-seller' : 'role-buyer')"
                                          th:text="${#strings.replace(role, 'ROLE_', '')}">
                                    </span>
                            </div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr; gap: 0.75rem; margin-bottom: 1.5rem;">
                        <div style="display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem;">
                            <div style="width: 24px; color: #94a3b8; text-align: center;"><i class="fa-solid fa-phone"></i></div>
                            <span style="color: #475569; font-weight: 600;" th:text="${user.phoneNumber ?: 'Chưa cập nhật SĐT'}">Phone</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem;">
                            <div style="width: 24px; color: #94a3b8; text-align: center;"><i class="fa-regular fa-calendar-plus"></i></div>
                            <span style="color: #64748b;">Đăng ký: <strong style="color: #475569;" th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm') : 'Đang cập nhật...'}">Date</strong></span>
                        </div>
                    </div>

                    <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                        <a th:href="@{'/admin/users/edit/' + ${user.id}}" class="btn-action btn-edit">
                            <i class="fa-solid fa-pen-to-square"></i> Chỉnh sửa
                        </a>

                        <form th:if="${user.isActive != null and user.isActive}" th:action="@{'/admin/users/' + ${user.id} + '/deactivate'}" method="post" style="margin: 0; display: flex;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-action btn-deactivate" style="width: 100%;" onclick="return confirm('Bạn có chắc muốn vô hiệu hóa (khóa) user này?')">
                                <i class="fa-solid fa-lock"></i> Khóa
                            </button>
                        </form>

                        <form th:unless="${user.isActive != null and user.isActive}" th:action="@{'/admin/users/' + ${user.id} + '/activate'}" method="post" style="margin: 0; display: flex;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-action btn-activate" style="width: 100%;" onclick="return confirm('Xác nhận kích hoạt lại user này?')">
                                <i class="fa-solid fa-unlock"></i> Mở khóa
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>

        <div id="emptyStateBox" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 1rem; background: white; border-radius: 1.25rem; border: 1px dashed #cbd5e1; box-shadow: var(--card-shadow); margin-top: 1rem;">
            <div style="width: 5rem; height: 5rem; background: #f8fafc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #cbd5e1; margin-bottom: 1rem;">
                <i class="fa-solid fa-user-slash"></i>
            </div>
            <h3 style="font-size: 1.25rem; font-weight: 800; color: #334155; margin: 0 0 0.5rem 0;">Không tìm thấy người dùng</h3>
            <p style="font-size: 0.875rem; color: #64748b; margin: 0;">Thử thay đổi tiêu chí lọc (Phân quyền / Trạng thái) xem sao nhé.</p>
        </div>

    </div>

    <script>
        function filterUsers() {
            const roleFilter = document.getElementById('roleFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const cards = document.querySelectorAll('.user-card');
            const emptyState = document.getElementById('emptyStateBox');
            let hasVisible = false;

            if (cards.length === 0) {
                emptyState.style.display = 'flex';
                return;
            }

            cards.forEach(card => {
                let show = true;
                if (roleFilter) {
                    const roles = card.getAttribute('data-roles') || '';
                    if (!roles.includes(roleFilter)) show = false;
                }
                if (statusFilter !== '') {
                    const active = card.getAttribute('data-active') === 'true';
                    if ((statusFilter === 'true' && !active) || (statusFilter === 'false' && active)) show = false;
                }

                if (show) {
                    card.style.display = 'flex';
                    hasVisible = true;
                } else {
                    card.style.display = 'none';
                }
            });

            emptyState.style.display = hasVisible ? 'none' : 'flex';
        }

        document.addEventListener("DOMContentLoaded", filterUsers);
    </script>
</th:block>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
