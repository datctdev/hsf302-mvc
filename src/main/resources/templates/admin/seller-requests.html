<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout}">
<head>
    <title>Quản Lý Yêu Cầu Seller - Admin</title>
</head>
<body>
    <th:block th:fragment="content">
        <h2 class="text-xl font-bold text-slate-900 mb-6">Quản Lý Yêu Cầu Seller</h2>

        <div class="flex flex-wrap gap-4 items-center mb-6">
            <label class="text-sm font-medium text-slate-700">Lọc theo trạng thái:</label>
            <select id="statusFilter" onchange="filterRequests()" class="rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500 min-w-[140px]">
                <option value="">Tất cả</option>
                <option value="PENDING" th:selected="${status == 'PENDING'}">Đang chờ</option>
                <option value="APPROVED" th:selected="${status == 'APPROVED'}">Đã duyệt</option>
                <option value="REJECTED" th:selected="${status == 'REJECTED'}">Đã từ chối</option>
            </select>
        </div>

        <div class="space-y-3 mb-6">
            <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
        </div>

        <div id="requestsContainer" class="space-y-6">
            <div th:if="${requests != null and !requests.empty}" th:each="request : ${requests}" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-6">
                    <div class="flex flex-wrap justify-between items-start gap-4 mb-4">
                        <h3 class="text-lg font-semibold text-slate-900" th:text="${request.shopName}">Shop Name</h3>
                        <span class="px-2.5 py-1 rounded text-sm font-medium bg-slate-100 text-slate-700" th:classappend="${request.status == 'PENDING' ? 'bg-amber-100 text-amber-800' : (request.status == 'APPROVED' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800')}" th:text="${request.status == 'PENDING' ? 'Đang chờ' : (request.status == 'APPROVED' ? 'Đã duyệt' : 'Đã từ chối')}">Status</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                        <div><span class="text-slate-500">User ID:</span> <span th:text="${request.userId}">-</span></div>
                        <div><span class="text-slate-500">Số điện thoại:</span> <span th:text="${request.shopPhone ?: 'N/A'}">-</span></div>
                        <div class="sm:col-span-2"><span class="text-slate-500">Địa chỉ:</span> <span th:text="${request.shopAddress ?: 'N/A'}">-</span></div>
                        <div><span class="text-slate-500">Ngày tạo:</span> <span th:text="${#temporals.format(request.createdAt, 'dd/MM/yyyy HH:mm')}">-</span></div>
                        <div th:if="${request.reviewedAt != null}"><span class="text-slate-500">Ngày duyệt:</span> <span th:text="${#temporals.format(request.reviewedAt, 'dd/MM/yyyy HH:mm')}">-</span></div>
                        <div th:if="${request.rejectionReason != null}" class="sm:col-span-2"><span class="text-slate-500">Lý do từ chối:</span> <span class="text-red-600" th:text="${request.rejectionReason}">-</span></div>
                        <div th:if="${request.shopDescription != null}" class="sm:col-span-2"><span class="text-slate-500">Mô tả shop:</span> <span th:text="${request.shopDescription}">-</span></div>
                    </div>
                    <div th:if="${request.logoUrl != null or request.coverImageUrl != null}" class="mt-4 flex flex-wrap gap-6">
                        <div th:if="${request.logoUrl != null}">
                            <span class="block text-sm text-slate-500 mb-1">Logo</span>
                            <img th:src="${request.logoUrl}" alt="Logo" class="max-w-[150px] max-h-[150px] rounded-lg object-cover border border-slate-200">
                        </div>
                        <div th:if="${request.coverImageUrl != null}">
                            <span class="block text-sm text-slate-500 mb-1">Ảnh bìa</span>
                            <img th:src="${request.coverImageUrl}" alt="Cover" class="max-w-[300px] max-h-[150px] rounded-lg object-cover border border-slate-200">
                        </div>
                    </div>
                    <div th:if="${request.status == 'PENDING'}" class="mt-4 flex flex-wrap gap-2">
                        <form th:action="@{'/admin/seller-requests/' + ${request.id} + '/approve'}" method="post" class="inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="px-4 py-2 rounded-lg bg-green-600 text-white text-sm font-medium hover:bg-green-700" onclick="return confirm('Bạn có chắc muốn duyệt yêu cầu này?')">Duyệt</button>
                        </form>
                        <button type="button" class="px-4 py-2 rounded-lg border border-red-500 text-red-600 text-sm font-medium hover:bg-red-50" th:attr="data-request-id=${request.id}" onclick="openRejectModal(this.getAttribute('data-request-id'))">Từ chối</button>
                    </div>
                </div>
            </div>
            <div th:if="${requests == null or requests.empty}" class="text-center py-12 rounded-xl bg-slate-50 border border-slate-200">
                <h3 class="font-semibold text-slate-700 mb-1">Không có yêu cầu nào</h3>
                <p class="text-slate-500 text-sm">Hiện tại không có yêu cầu nào phù hợp với bộ lọc.</p>
            </div>
        </div>

        <!-- Reject Modal -->
        <div id="rejectModal" class="fixed inset-0 z-50 hidden" aria-hidden="true">
            <div id="rejectModalOverlay" class="fixed inset-0 bg-slate-900/50" onclick="closeRejectModal()"></div>
            <div class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md rounded-xl bg-white shadow-xl p-6">
                <h3 class="text-lg font-semibold text-slate-900 mb-4">Từ chối Yêu cầu</h3>
                <form id="rejectForm" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-4">
                        <label for="rejectionReason" class="block text-sm font-medium text-slate-700 mb-1">Lý do từ chối *</label>
                        <textarea id="rejectionReason" name="rejectionReason" required placeholder="Nhập lý do từ chối..." class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-primary-500 min-h-[100px]"></textarea>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50" onclick="closeRejectModal()">Hủy</button>
                        <button type="submit" class="px-4 py-2 rounded-lg bg-red-600 text-white font-medium hover:bg-red-700">Từ chối</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            function filterRequests() {
                var statusFilter = document.getElementById('statusFilter').value;
                window.location.href = statusFilter ? '/admin/seller-requests?status=' + encodeURIComponent(statusFilter) : '/admin/seller-requests';
            }
            function openRejectModal(requestId) {
                var modal = document.getElementById('rejectModal');
                var form = document.getElementById('rejectForm');
                if (modal && form) {
                    form.action = '/admin/seller-requests/' + requestId + '/reject';
                    modal.classList.remove('hidden');
                }
            }
            function closeRejectModal() {
                var modal = document.getElementById('rejectModal');
                var form = document.getElementById('rejectForm');
                if (modal) modal.classList.add('hidden');
                if (form) form.reset();
            }
document.addEventListener('click', function(e) {
                    if (e.target.id === 'rejectModalOverlay' || e.target.id === 'rejectModal') closeRejectModal();
                });
        </script>
    </th:block>
</body>
</html>
