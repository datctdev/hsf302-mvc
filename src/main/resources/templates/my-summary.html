<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Tổng quan của tôi - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-base-content mb-6">Tổng quan của tôi</h1>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                <div class="card bg-base-100 border border-base-200 shadow-sm border-l-4 border-l-primary">
                    <div class="card-body py-5">
                        <p class="text-sm font-medium text-base-content/60">Tổng số đơn</p>
                        <p class="text-2xl font-bold" th:text="${totalOrders != null ? totalOrders : 0}">0</p>
                    </div>
                </div>
                <div class="card bg-base-100 border border-base-200 shadow-sm border-l-4 border-l-secondary">
                    <div class="card-body py-5">
                        <p class="text-sm font-medium text-base-content/60">Tổng chi tiêu</p>
                        <p class="text-2xl font-bold" th:text="${totalSpent != null ? (#numbers.formatDecimal(totalSpent, 0, 'POINT', 0, 'POINT') + ' đ') : '0 đ'}">0 đ</p>
                        <p class="text-xs text-base-content/60">Đơn đã xác nhận → đã giao</p>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-lg font-semibold text-base-content mb-3">Đơn gần đây</h2>
                <div th:if="${recentOrders == null or recentOrders.empty}" class="text-base-content/60 py-4">Chưa có đơn hàng nào.</div>
                <div th:if="${recentOrders != null and !recentOrders.empty}" class="card bg-base-100 border border-base-200 shadow-sm">
                    <div class="divide-y divide-base-200">
                        <div th:each="order : ${recentOrders}" class="flex flex-wrap items-center justify-between gap-3 py-4 px-4">
                            <a th:href="@{'/orders/' + ${order.id}}" class="flex-1 min-w-0 link link-hover font-medium">
                                <strong th:text="${order.orderNumber != null ? order.orderNumber : ('Đơn ' + order.id)}">#ORDER</strong>
                                <span th:if="${order.createdAt != null}" th:text="' – ' + ${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}" class="text-base-content/60 text-sm"></span>
                                <span th:if="${order.shopName != null}" th:text="' – ' + ${order.shopName}" class="text-base-content/60 text-sm"></span>
                            </a>
                            <span class="badge badge-ghost" th:text="${order.status != null ? order.status.name() : ''}">Status</span>
                            <span th:if="${order.total != null}" class="font-semibold" th:text="${#numbers.formatDecimal(order.total, 0, 'POINT', 0, 'POINT')} + ' đ'"></span>
                        </div>
                    </div>
                    <div class="card-actions p-4 border-t border-base-200">
                        <a th:href="@{/orders}" class="btn btn-outline btn-primary btn-sm">Xem tất cả đơn hàng</a>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
