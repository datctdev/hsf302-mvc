<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="widget">
    <div id="chat-widget-root" class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">
        <div id="chat-panel" class="hidden w-[380px] max-w-[calc(100vw-2rem)] h-[520px] max-h-[75vh] rounded-[24px] shadow-lg border border-slate-100 bg-white flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-5 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-t-[24px]">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-robot text-lg"></i>
                    </div>
                    <div>
                        <span class="block font-bold text-sm">Trợ lý hỗ trợ</span>
                        <span class="text-blue-100 text-xs">Menu · Rule-based</span>
                    </div>
                </div>
                <button type="button" id="chat-close" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center" aria-label="Đóng">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50 text-sm"></div>
            <div id="chat-input-area" class="p-3 bg-white border-t border-slate-100 flex gap-2 items-center">
                <input type="text" id="chat-input" placeholder="Nhập tin nhắn hoặc chọn nút bên trên..." maxlength="2000" class="flex-1 rounded-xl bg-slate-100 border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 outline-none"/>
                <button type="button" id="chat-send" class="w-10 h-10 flex items-center justify-center rounded-xl bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50" title="Gửi">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
        <button type="button" id="chat-toggle" class="flex items-center justify-center w-14 h-14 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg hover:shadow-xl border-2 border-white" aria-label="Mở chat">
            <i id="chat-toggle-icon" class="fa-solid fa-comment-dots text-xl"></i>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <script th:inline="javascript">
        (function() {
            var panel = document.getElementById('chat-panel');
            var toggle = document.getElementById('chat-toggle');
            var closeBtn = document.getElementById('chat-close');
            var input = document.getElementById('chat-input');
            var sendBtn = document.getElementById('chat-send');
            var messagesEl = document.getElementById('chat-messages');
            var initUrl = /*[[@{/chat/init}]]*/ '/chat/init';
            var interactUrl = /*[[@{/chat/interact}]]*/ '/chat/interact';
            var wsChatPath = /*[[@{/ws-chat}]]*/ '/ws-chat';
            var liveChatMode = false;
            var stompClient = null;
            var liveChatSessionId = null;

            function openPanel() {
                panel.classList.remove('hidden');
                if (document.getElementById('chat-toggle-icon')) {
                    document.getElementById('chat-toggle-icon').classList.remove('fa-comment-dots');
                    document.getElementById('chat-toggle-icon').classList.add('fa-chevron-down');
                }
            }
            function closePanel() {
                panel.classList.add('hidden');
                if (document.getElementById('chat-toggle-icon')) {
                    document.getElementById('chat-toggle-icon').classList.add('fa-comment-dots');
                    document.getElementById('chat-toggle-icon').classList.remove('fa-chevron-down');
                }
            }
            toggle.addEventListener('click', function() {
                if (panel.classList.contains('hidden')) {
                    openPanel();
                    if (messagesEl.children.length === 0) loadInit();
                } else closePanel();
            });
            closeBtn.addEventListener('click', closePanel);

            function appendBubble(text, isUser) {
                var wrap = document.createElement('div');
                wrap.className = 'flex justify-' + (isUser ? 'end' : 'start');
                var bubble = document.createElement('div');
                bubble.className = 'max-w-[85%] rounded-2xl px-4 py-2.5 text-sm ' + (isUser ? 'rounded-tr-sm bg-blue-600 text-white' : 'rounded-tl-sm bg-white border border-slate-200 text-slate-700');
                bubble.textContent = text;
                wrap.appendChild(bubble);
                messagesEl.appendChild(wrap);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function appendOptions(options, humanHandoff) {
                if (!options || options.length === 0) return;
                var wrap = document.createElement('div');
                wrap.className = 'flex flex-wrap gap-2';
                options.forEach(function(opt) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'px-3 py-2 rounded-xl bg-white border border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-sm font-medium text-slate-700 transition-colors';
                    btn.textContent = opt.buttonLabel || opt.actionPayload;
                    btn.dataset.action = opt.actionPayload || '';
                    btn.dataset.nextNodeId = opt.nextNodeId || '';
                    if (opt.categoryId) btn.dataset.categoryId = opt.categoryId;
                    btn.addEventListener('click', function() {
                        sendAction(opt.actionPayload, opt.categoryId);
                    });
                    wrap.appendChild(btn);
                });
                messagesEl.appendChild(wrap);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function appendProductCards(cards) {
                if (!cards || cards.length === 0) return;
                var wrap = document.createElement('div');
                wrap.className = 'space-y-2';
                var label = document.createElement('p');
                label.className = 'text-xs font-semibold text-slate-500 uppercase';
                label.textContent = 'Gợi ý sản phẩm:';
                wrap.appendChild(label);
                cards.forEach(function(p) {
                    var a = document.createElement('a');
                    a.href = p.productUrl || ('/products/' + p.id);
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.className = 'flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-2 hover:border-blue-300 hover:shadow-sm transition-all text-left';
                    var img = p.thumbnailUrl ? '<img src="' + p.thumbnailUrl + '" alt="" class="w-12 h-12 rounded-lg object-cover flex-shrink-0"/>' : '<div class="w-12 h-12 rounded-lg bg-slate-100 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-image text-slate-300"></i></div>';
                    var price = p.basePrice != null ? new Intl.NumberFormat('vi-VN').format(p.basePrice) + ' đ' : '';
                    a.innerHTML = img + '<div class="flex-1 min-w-0"><span class="font-semibold text-slate-800 text-sm line-clamp-1">' + (p.name || '') + '</span><span class="text-blue-600 font-bold text-sm">' + price + '</span></div>';
                    wrap.appendChild(a);
                });
                messagesEl.appendChild(wrap);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function setLoading(loading) {
                sendBtn.disabled = loading;
            }

            function loadInit() {
                setLoading(true);
                fetch(initUrl, { method: 'GET', credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.messageText) appendBubble(data.messageText, false);
                        appendOptions(data.options, data.humanHandoffRequired);
                        if (data.productCards && data.productCards.length > 0) appendProductCards(data.productCards);
                        if (data.inputExpected) input.placeholder = data.inputHint || 'Nhập từ khóa hoặc tin nhắn...';
                        if (data.humanHandoffRequired) {
                            document.getElementById('chat-input-area').classList.add('live-chat-mode');
                            if (data.liveChatSessionId) liveChatSessionId = data.liveChatSessionId;
                        }
                    })
                    .catch(function() { appendBubble('Không thể kết nối. Bạn thử lại sau.', false); })
                    .finally(function() { setLoading(false); });
            }

            function sendAction(action, categoryId) {
                var body = { action: action };
                if (categoryId) body.categoryId = categoryId;
                setLoading(true);
                fetch(interactUrl, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(body)
                })
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.messageText) appendBubble(data.messageText, false);
                        appendOptions(data.options, data.humanHandoffRequired);
                        if (data.productCards && data.productCards.length > 0) appendProductCards(data.productCards);
                        if (data.inputExpected) input.placeholder = data.inputHint || 'Nhập từ khóa hoặc tin nhắn...';
                        if (data.humanHandoffRequired) {
                            document.getElementById('chat-input-area').classList.add('live-chat-mode');
                            if (data.liveChatSessionId) liveChatSessionId = data.liveChatSessionId;
                            if (window.chatbotConnectLiveChat) window.chatbotConnectLiveChat();
                        }
                    })
                    .catch(function() { appendBubble('Lỗi kết nối. Thử lại.', false); })
                    .finally(function() { setLoading(false); });
            }

            function sendText() {
                var text = (input.value || '').trim();
                if (!text) return;
                input.value = '';
                if (liveChatMode && stompClient && stompClient.connected) {
                    appendBubble(text, true);
                    stompClient.publish({ destination: '/app/chat', body: JSON.stringify({ text: text }) });
                    return;
                }
                appendBubble(text, true);
                setLoading(true);
                fetch(interactUrl, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ text: text })
                })
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.messageText) appendBubble(data.messageText, false);
                        appendOptions(data.options, data.humanHandoffRequired);
                        if (data.productCards && data.productCards.length > 0) appendProductCards(data.productCards);
                        if (data.humanHandoffRequired && window.chatbotConnectLiveChat) window.chatbotConnectLiveChat();
                    })
                    .catch(function() { appendBubble('Lỗi kết nối.', false); })
                    .finally(function() { setLoading(false); });
            }

            window.chatbotConnectLiveChat = function() {
                if (stompClient && stompClient.connected) {
                    sendInitialHandoffMessage();
                    return;
                }
                liveChatMode = true;
                input.placeholder = 'Nhập tin nhắn để gửi cho nhân viên...';
                var base = window.location.origin || '';
                stompClient = new StompJs.Client({
                    webSocketFactory: function() { return new SockJS(base + wsChatPath); }
                });
                stompClient.onConnect = function() {
                    var replyDest = liveChatSessionId ? ('/user/' + liveChatSessionId + '/queue/chat') : '/user/queue/chat';
                    stompClient.subscribe(replyDest, function(msg) {
                        var body = msg.body ? JSON.parse(msg.body) : {};
                        if (body.text) appendBubble(body.text, false);
                    });
                    sendInitialHandoffMessage();
                };
                stompClient.onStompError = function() { appendBubble('Không thể kết nối live chat. Thử tải lại trang.', false); };
                stompClient.activate();
            };

            function sendInitialHandoffMessage() {
                if (!stompClient || !stompClient.connected) return;
                stompClient.publish({
                    destination: '/app/chat',
                    body: JSON.stringify({ text: 'Khách đã yêu cầu gặp nhân viên.' })
                });
            }

            sendBtn.addEventListener('click', sendText);
            input.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendText(); });
        })();
    </script>
</th:block>
</body>
</html>
