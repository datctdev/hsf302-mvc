<!-- Header Fragment - Simple Header for Home/General Pages -->
<header xmlns:th="http://www.thymeleaf.org" th:fragment="header-simple" class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <h1 class="text-lg font-semibold text-slate-800">Chào mừng đến với E-commerce</h1>
        <div class="flex items-center gap-3">
            <!-- Optional CTA or branding -->
        </div>
    </div>
</header>

<!-- Header Fragment - Admin Header -->
<header xmlns:th="http://www.thymeleaf.org" th:fragment="header-admin" class="bg-slate-800 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
        <h1 class="text-lg font-semibold">🛒 Admin Dashboard - E-commerce Marketplace</h1>
        <div class="flex items-center gap-4">
            <span class="text-slate-200" th:text="${currentUser != null ? (currentUser.fullName != null ? currentUser.fullName : currentUser.email) : 'Admin'}">Admin</span>
            <form th:action="@{/logout}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="px-3 py-1.5 text-sm font-medium rounded bg-red-600 hover:bg-red-700 text-white transition">Đăng xuất</button>
            </form>
        </div>
    </div>
</header>
