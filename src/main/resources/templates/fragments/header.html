<header xmlns:th="http://www.thymeleaf.org" th:fragment="header-simple" class="bg-slate-900 text-white relative z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-10 flex items-center justify-center">
        <div class="text-[13px] font-medium tracking-wide flex items-center gap-2">
            <i class="fa-solid fa-bolt text-amber-400 animate-pulse"></i>
            <span>Siêu sale cuối tuần! Miễn phí giao hàng cho mọi đơn hàng từ 500.000đ.</span>
            <a href="/products" class="ml-2 font-bold text-blue-400 hover:text-blue-300 underline underline-offset-2 transition-colors hidden sm:inline-block">Mua ngay</a>
        </div>
    </div>
</header>

<header xmlns:th="http://www.thymeleaf.org" th:fragment="header-admin" class="bg-slate-800 text-white shadow relative z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
        <h1 class="text-lg font-semibold"><i class="fa-solid fa-cart-shopping text-blue-400 mr-2"></i> Admin Dashboard</h1>
        <div class="flex items-center gap-4">
            <span class="text-slate-200 text-sm font-medium" th:text="${currentUser != null ? (currentUser.fullName != null ? currentUser.fullName : currentUser.email) : 'Admin'}">Admin</span>
            <form th:action="@{/logout}" method="post" class="inline m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="px-3 py-1.5 text-sm font-bold rounded-lg bg-rose-600 hover:bg-rose-700 text-white transition-colors"><i class="fa-solid fa-power-off mr-1"></i> Đăng xuất</button>
            </form>
        </div>
    </div>
</header>
