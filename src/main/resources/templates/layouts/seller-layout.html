<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="font-sans antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Seller - E-commerce'">Seller - E-commerce</title>
    <th:block th:replace="~{fragments/htmx-tailwind :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <th:block th:fragment="additional-css"></th:block>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900" data-theme="ecommerce">
    <th:block th:replace="~{fragments/header :: header-simple}"></th:block>
    <th:block th:replace="~{fragments/nav-seller :: nav-seller}"></th:block>
    <main class="flex-1">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
            <div th:replace="~{::content}"><!-- Page content --></div>
        </div>
    </main>
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    <th:block th:replace="~{fragments/htmx-tailwind :: scripts}"></th:block>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/seller.js}"></script>
    <th:block th:fragment="scripts"></th:block>
</body>
</html>
