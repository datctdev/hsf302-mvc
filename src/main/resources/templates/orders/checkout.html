<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Thanh Toán - E-Market VIP</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <div class="mb-10 text-center">
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight mb-4">Thanh Toán Đơn Hàng</h1>
        <div class="flex items-center justify-center max-w-sm mx-auto">
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-md mb-2"><i class="fa-solid fa-cart-shopping"></i></div><span class="text-xs font-bold text-slate-800">Giỏ hàng</span></div>
            <div class="w-16 h-1 bg-blue-600 mx-2 rounded-full mb-6"></div>
            <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold shadow-lg mb-1 border-[3px] border-blue-200"><i class="fa-solid fa-money-check-dollar"></i></div><span class="text-xs font-black text-slate-900">Thanh toán</span></div>
            <div class="w-16 h-1 bg-slate-200 mx-2 rounded-full mb-6"></div>
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm border border-slate-200 mb-2"><i class="fa-solid fa-check"></i></div><span class="text-xs font-bold text-slate-400">Hoàn tất</span></div>
        </div>
    </div>

    <div th:if="${error}" class="rounded-2xl p-5 mb-8 bg-rose-50 border border-rose-100 flex items-center gap-3 shadow-sm text-rose-800 font-medium"><i class="fa-solid fa-triangle-exclamation text-xl"></i> <span th:text="${error}"></span></div>
    <div th:if="${success}" class="rounded-2xl p-5 mb-8 bg-emerald-50 border border-emerald-100 flex items-center gap-3 shadow-sm text-emerald-800 font-medium"><i class="fa-solid fa-circle-check text-xl"></i> <span th:text="${success}"></span></div>

    <form th:action="@{/orders/create}" method="post" th:object="${createOrderRequest}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="lg:grid lg:grid-cols-[1fr_420px] gap-8 xl:gap-10 items-start">

            <div class="space-y-8">

                <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 overflow-hidden relative">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
                    <div class="p-6 sm:p-8">
                        <h2 class="text-xl font-extrabold text-slate-900 mb-6 flex items-center gap-3"><i class="fa-solid fa-location-dot text-blue-500"></i> Địa chỉ nhận hàng</h2>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="md:col-span-2">
                                <label for="shippingName" class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Họ và Tên người nhận *</label>
                                <input type="text" id="shippingName" th:field="*{shippingName}" required placeholder="VD: Nguyễn Văn A" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                            </div>

                            <div class="md:col-span-2">
                                <label for="shippingPhone" class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Số Điện Thoại *</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none font-bold text-slate-400 border-r border-slate-200 pr-3">+84</div>
                                    <input type="tel" id="shippingPhone" th:field="*{shippingPhone}" pattern="[0-9]{9,11}" required placeholder="912 345 678" class="w-full pl-[4.5rem] pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold tracking-wider focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                                </div>
                            </div>

                            <div>
                                <label for="provinceSelect" class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Tỉnh/Thành phố *</label>
                                <select id="provinceSelect" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all cursor-pointer">
                                    <option value="">-- Chọn Tỉnh/Thành phố --</option>
                                </select>
                            </div>

                            <div>
                                <label for="districtSelect" class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Quận/Huyện *</label>
                                <select id="districtSelect" required disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">
                                    <option value="">-- Chọn Quận/Huyện --</option>
                                </select>
                            </div>

                            <div>
                                <label for="wardSelect" class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Phường/Xã *</label>
                                <select id="wardSelect" required disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">
                                    <option value="">-- Chọn Phường/Xã --</option>
                                </select>
                            </div>

                            <input type="hidden" id="shippingDistrict" name="shippingDistrict">
                            <input type="hidden" id="shippingWard" name="shippingWard">
                            <input type="hidden" id="toDistrictId" name="shippingDistrictId">
                            <input type="hidden" id="toWardCode" name="shippingWardCode">

                            <div class="md:col-span-2">
                                <label for="shippingAddress" class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Địa chỉ cụ thể (Số nhà, Đường) *</label>
                                <input type="text" id="shippingAddress" th:field="*{shippingAddress}" required placeholder="Ví dụ: 123 Đường ABC, Tòa nhà XYZ" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                            </div>

                            <div class="md:col-span-2 hidden">
                                <input type="hidden" id="shippingCity" th:field="*{shippingCity}">
                            </div>

                            <div class="md:col-span-2 mt-2">
                                <label for="notes" class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Ghi Chú Đơn Hàng</label>
                                <textarea id="notes" th:field="*{notes}" placeholder="Ghi chú cho người bán hoặc shipper (Ví dụ: Giao giờ hành chính)" rows="3" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-6 sm:p-8">
                    <h2 class="text-xl font-extrabold text-slate-900 mb-6 flex items-center gap-3"><i class="fa-solid fa-box-open text-indigo-500"></i> Kiện hàng của bạn</h2>

                    <div class="space-y-8">
                        <div th:each="entry : ${itemsByShop}" class="bg-slate-50 rounded-2xl border border-slate-100 p-5 relative overflow-hidden">
                            <div class="flex items-center gap-2 mb-4 pb-4 border-b border-slate-200/60">
                                <i class="fa-solid fa-store text-blue-600"></i>
                                <span class="font-black text-slate-800 uppercase tracking-wide text-sm" th:text="${entry.key.name}">Shop Name</span>
                            </div>

                            <div class="space-y-4">
                                <div th:each="item : ${entry.value}" class="flex gap-4 items-center">
                                    <input type="hidden" name="cartItemIds" th:value="${item.id}"/>

                                    <div class="w-16 h-16 rounded-xl overflow-hidden bg-white border border-slate-200 shrink-0">
                                        <img th:src="${productImageUrls != null and productImageUrls[item.product.id] != null ? productImageUrls[item.product.id] : '/images/placeholder.png'}" alt="Product" class="w-full h-full object-cover" onerror="this.src='/images/placeholder.png'">
                                    </div>

                                    <div class="flex-1 min-w-0 flex justify-between items-center gap-4">
                                        <div>
                                            <h4 class="font-extrabold text-slate-900 text-sm line-clamp-1" th:text="${item.product.name}">Product Name</h4>
                                            <div th:if="${item.variant != null}" class="text-[11px] font-bold text-slate-500 mt-1 bg-white border border-slate-200 inline-block px-2 py-0.5 rounded" th:text="${item.variant.name + ': ' + item.variant.value}">Variant</div>
                                        </div>
                                        <div class="text-right shrink-0">
                                            <div class="text-sm font-black text-slate-800" th:text="|${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'POINT')} ₫|">Price</div>
                                            <div class="text-[11px] font-bold text-slate-500 mt-1">SL: <span th:text="${item.quantity}" class="text-slate-700">Qty</span></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-5 pt-4 border-t border-slate-200/60 flex justify-between items-center">
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Thành tiền shop này</span>
                                <span class="font-black text-blue-600" th:text="${shopSubtotals != null and shopSubtotals[entry.key.id] != null ? #numbers.formatDecimal(shopSubtotals[entry.key.id], 0, 'POINT', 0, 'POINT') + ' ₫' : '0 ₫'}">0 ₫</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:sticky lg:top-24">
                <div class="bg-slate-900 rounded-3xl shadow-xl border border-slate-800 p-8 text-white relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/20 rounded-full blur-2xl translate-x-1/2 -translate-y-1/2"></div>

                    <h2 class="text-xl font-extrabold mb-6 flex items-center gap-2 relative z-10"><i class="fa-solid fa-receipt text-blue-400"></i> Hóa Đơn Thanh Toán</h2>

                    <div class="space-y-4 mb-6 pb-6 border-b border-slate-700/60 relative z-10">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400 font-medium text-sm">Tiền hàng (<span th:text="${itemsByShop != null ? itemsByShop.size() : 0}">0</span> kiện)</span>
                            <span id="subtotal" class="font-bold" th:text="${totalSubtotal != null ? #numbers.formatDecimal(totalSubtotal, 0, 'POINT', 0, 'POINT') + ' ₫' : '0 ₫'}">0 ₫</span>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-slate-400 font-medium text-sm">Phí vận chuyển</span>
                                <span id="shippingFeeDisplay" class="font-bold text-emerald-400">Đang chờ địa chỉ...</span>
                            </div>
                            <input type="hidden" id="shippingFee" th:field="*{shippingFee}" value="0">

                            <div id="shippingFeeMessage" class="text-[11px] font-medium min-h-[16px] text-right"></div>
                        </div>
                    </div>

                    <div class="flex justify-between items-end mb-8 relative z-10">
                        <span class="text-sm font-bold uppercase tracking-wider text-slate-300">Tổng Thanh Toán</span>
                        <span id="totalPrice" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-indigo-200">0 ₫</span>
                    </div>

                    <button type="submit" class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black text-lg shadow-[0_6px_20px_rgba(37,99,235,0.4)] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2 relative z-10 border border-blue-400/30">
                        <i class="fa-solid fa-lock text-sm"></i> Thanh Toán <span th:text="${itemsByShop != null ? itemsByShop.size() : 0}">0</span> Đơn Hàng
                    </button>

                    <div class="mt-4 text-center relative z-10">
                        <a th:href="@{/cart}" class="text-[13px] font-bold text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> Quay lại sửa giỏ hàng</a>
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-800 flex justify-center gap-3 text-slate-600 relative z-10">
                        <i class="fa-brands fa-cc-visa text-2xl hover:text-white transition-colors"></i>
                        <i class="fa-brands fa-cc-mastercard text-2xl hover:text-white transition-colors"></i>
                        <i class="fa-brands fa-cc-paypal text-2xl hover:text-white transition-colors"></i>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script th:inline="javascript">
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';
        const provinceSelect = document.getElementById('provinceSelect');
        const districtSelect = document.getElementById('districtSelect');
        const wardSelect = document.getElementById('wardSelect');

        function calculateTotal() {
            const subtotalText = document.getElementById('subtotal').textContent.trim();
            const subtotal = parseFloat(subtotalText.replace(/[^0-9]/g, '')) || 0;
            const shippingFee = parseFloat(document.getElementById('shippingFee').value) || 0;
            const total = subtotal + shippingFee;
            document.getElementById('totalPrice').textContent = total.toLocaleString('vi-VN') + ' ₫';

            // Hiển thị phí ship lên UI
            const feeDisplay = document.getElementById('shippingFeeDisplay');
            if(shippingFee > 0) {
                feeDisplay.textContent = '+ ' + shippingFee.toLocaleString('vi-VN') + ' ₫';
                feeDisplay.className = 'font-bold text-white';
            } else if(provinceSelect.value && districtSelect.value && wardSelect.value) {
                feeDisplay.textContent = 'Miễn phí';
                feeDisplay.className = 'font-bold text-emerald-400';
            } else {
                feeDisplay.textContent = 'Đang chờ địa chỉ...';
                feeDisplay.className = 'font-bold text-slate-500';
            }
        }

        function loadProvinces() {
            fetch('/api/shipping/provinces').then(r => r.json()).then(provinces => {
                provinceSelect.innerHTML = '<option value="">-- Chọn Tỉnh/Thành phố --</option>';
                provinces.forEach(p => { const o = document.createElement('option'); o.value = p.ProvinceID; o.textContent = p.ProvinceName; provinceSelect.appendChild(o); });
            }).catch(() => { provinceSelect.innerHTML = '<option value="">Lỗi tải API Tỉnh/Thành</option>'; });
        }

        provinceSelect.addEventListener('change', function() {
            const provinceId = this.value;
            districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
            districtSelect.disabled = true; wardSelect.disabled = true;
            document.getElementById('toDistrictId').value = ''; document.getElementById('toWardCode').value = '';
            document.getElementById('shippingDistrict').value = ''; document.getElementById('shippingWard').value = '';
            document.getElementById('shippingFee').value = 0; calculateTotal();

            if (!provinceId) return;
            districtSelect.disabled = false;
            fetch('/api/shipping/districts?provinceId=' + provinceId).then(r => r.json()).then(districts => {
                districts.forEach(d => { const o = document.createElement('option'); o.value = d.DistrictID; o.textContent = d.DistrictName; districtSelect.appendChild(o); });
            }).catch(() => { districtSelect.innerHTML = '<option value="">Lỗi API Quận/Huyện</option>'; });
        });

        districtSelect.addEventListener('change', function() {
            const districtId = this.value;
            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
            wardSelect.disabled = true;
            document.getElementById('toDistrictId').value = ''; document.getElementById('toWardCode').value = ''; document.getElementById('shippingWard').value = '';
            document.getElementById('shippingFee').value = 0; calculateTotal();

            if (!districtId) return;
            wardSelect.disabled = false;
            fetch('/api/shipping/wards?districtId=' + districtId).then(r => r.json()).then(wards => {
                wards.forEach(w => { const o = document.createElement('option'); o.value = w.WardCode; o.textContent = w.WardName; wardSelect.appendChild(o); });
            }).catch(() => { wardSelect.innerHTML = '<option value="">Lỗi API Phường/Xã</option>'; });
        });

        wardSelect.addEventListener('change', function() {
            const districtId = districtSelect.value;
            const wardCode = this.value;

            // Set hidden input values
            document.getElementById('toDistrictId').value = districtId;
            document.getElementById('toWardCode').value = wardCode;
            document.getElementById('shippingCity').value = provinceSelect.options[provinceSelect.selectedIndex].text;
            document.getElementById('shippingDistrict').value = districtSelect.options[districtSelect.selectedIndex].text;
            document.getElementById('shippingWard').value = this.options[this.selectedIndex].text;

            if (!districtId || !wardCode) return;

            const msg = document.getElementById('shippingFeeMessage');
            msg.innerHTML = '<span class="text-amber-400 italic flex items-center justify-end gap-1"><i class="fa-solid fa-circle-notch fa-spin text-[10px]"></i> Hệ thống đang tính phí giao hàng...</span>';

            const cartItemIds = Array.from(document.querySelectorAll('input[name="cartItemIds"]')).map(function(el) { return el.value; });
            const body = { toDistrictId: parseInt(districtId), toWardCode: wardCode };
            if (cartItemIds.length > 0) body.cartItemIds = cartItemIds;

            // Lấy API phí ship
            fetch('/api/shipping/calculate-fee-cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify(body)
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    const totalFee = data.totalFee != null ? data.totalFee : 0;
                    document.getElementById('shippingFee').value = totalFee;
                    calculateTotal();
                    msg.innerHTML = '<span class="text-emerald-400"><i class="fa-solid fa-truck-fast"></i> Phí giao hàng đã được cập nhật</span>';
                } else {
                    document.getElementById('shippingFee').value = 0;
                    calculateTotal();
                    msg.innerHTML = '<span class="text-rose-400">✗ ' + (data.message || 'Không thể tính phí giao đến địa chỉ này.') + '</span>';
                }
            }).catch(() => {
                msg.innerHTML = '<span class="text-rose-400">✗ Lỗi tính phí. Vui lòng chọn lại phường/xã.</span>';
            });
        });

        document.querySelector('form').addEventListener('submit', function(e) {
            if (!document.getElementById('toDistrictId').value || !document.getElementById('toWardCode').value) {
                e.preventDefault();
                alert('Xin vui lòng chọn đầy đủ Tỉnh/Thành phố, Quận/Huyện và Phường/Xã để tính phí giao hàng trước khi Thanh Toán.');

                // Highlight the select boxes
                provinceSelect.classList.add('ring-2', 'ring-rose-500', 'border-rose-500');
                setTimeout(() => provinceSelect.classList.remove('ring-2', 'ring-rose-500', 'border-rose-500'), 2000);
                return false;
            }
        });

        window.addEventListener('load', function() { loadProvinces(); calculateTotal(); });
    </script>
</th:block>
</body>
</html>
