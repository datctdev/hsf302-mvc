<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Thanh Toán - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <h1 class="text-2xl font-bold text-slate-900 mb-6">Thanh Toán</h1>

        <div th:if="${error}" class="rounded-lg p-4 bg-red-50 text-red-800 text-sm mb-6" th:text="${error}"></div>
        <div th:if="${success}" class="rounded-lg p-4 bg-green-50 text-green-800 text-sm mb-6" th:text="${success}"></div>

        <form th:action="@{/orders/create}" method="post" th:object="${createOrderRequest}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="lg:grid lg:grid-cols-[1fr_400px] gap-8">
                <div class="space-y-6">
                    <!-- Shipping -->
                    <div class="bg-white rounded-xl shadow-card p-6">
                        <h2 class="text-lg font-semibold text-slate-900 mb-4">Thông Tin Giao Hàng</h2>
                        <div class="space-y-4">
                            <div>
                                <label for="shippingName" class="block text-sm font-medium text-slate-700 mb-1">Họ và Tên *</label>
                                <input type="text" id="shippingName" th:field="*{shippingName}" required class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            </div>
                            <div>
                                <label for="shippingPhone" class="block text-sm font-medium text-slate-700 mb-1">Số Điện Thoại *</label>
                                <input type="tel" id="shippingPhone" th:field="*{shippingPhone}" pattern="[0-9]{10,11}" required class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            </div>
                            <div>
                                <label for="shippingAddress" class="block text-sm font-medium text-slate-700 mb-1">Địa Chỉ *</label>
                                <input type="text" id="shippingAddress" th:field="*{shippingAddress}" required class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            </div>
                            <div>
                                <label for="shippingCity" class="block text-sm font-medium text-slate-700 mb-1">Thành Phố</label>
                                <input type="text" id="shippingCity" th:field="*{shippingCity}" class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            </div>
                            <div>
                                <label for="provinceSelect" class="block text-sm font-medium text-slate-700 mb-1">Tỉnh/Thành phố *</label>
                                <select id="provinceSelect" required class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                    <option value="">-- Chọn Tỉnh/Thành phố --</option>
                                </select>
                            </div>
                            <div>
                                <label for="districtSelect" class="block text-sm font-medium text-slate-700 mb-1">Quận/Huyện *</label>
                                <select id="districtSelect" required disabled class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                    <option value="">-- Chọn Quận/Huyện --</option>
                                </select>
                            </div>
                            <div>
                                <label for="wardSelect" class="block text-sm font-medium text-slate-700 mb-1">Phường/Xã *</label>
                                <select id="wardSelect" required disabled class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                    <option value="">-- Chọn Phường/Xã --</option>
                                </select>
                            </div>
                            <input type="hidden" id="shippingDistrict" name="shippingDistrict">
                            <input type="hidden" id="shippingWard" name="shippingWard">
                            <input type="hidden" id="toDistrictId" name="shippingDistrictId">
                            <input type="hidden" id="toWardCode" name="shippingWardCode">
                            <div id="shippingFeeMessage" class="text-sm mt-1 min-h-[1.5rem]"></div>
                            <div>
                                <label for="notes" class="block text-sm font-medium text-slate-700 mb-1">Ghi Chú</label>
                                <textarea id="notes" th:field="*{notes}" placeholder="Ghi chú cho người bán (tùy chọn)" rows="3" class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 resize-y"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Shop items -->
                    <div th:if="${firstShop != null}" class="bg-white rounded-xl shadow-card p-6">
                        <h3 class="font-semibold text-primary-600 mb-4" th:text="'Shop: ' + ${firstShop.name}">Shop Name</h3>
                        <input type="hidden" th:name="shopId" th:value="${firstShop.id}">
                        <div class="space-y-4">
                            <div th:each="item : ${itemsByShop[firstShop]}" class="flex gap-4 py-4 border-b border-slate-200 last:border-0">
                                <img th:src="${item.productImageUrl ?: '/images/placeholder.png'}" alt="Product" class="w-20 h-20 rounded-lg object-cover shrink-0" onerror="this.src='/images/placeholder.png'">
                                <div class="flex-1 min-w-0">
                                    <div class="font-medium text-slate-900" th:text="${item.product.name}">Product Name</div>
                                    <div th:if="${item.variant != null}" class="text-sm text-slate-500" th:text="${item.variant.name + ': ' + item.variant.value}">Variant</div>
                                    <div class="text-primary-600 text-sm mt-1">
                                        <span th:text="|${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'POINT')} VNĐ|">Price</span>
                                        <span> x </span><span th:text="${item.quantity}">Qty</span>
                                        <span> = </span><span th:text="|${#numbers.formatDecimal(item.totalPrice, 0, 'POINT', 0, 'POINT')} VNĐ|">Total</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Order summary sticky -->
                <div class="lg:sticky lg:top-4 self-start">
                    <div class="bg-white rounded-xl shadow-card p-6">
                        <h2 class="text-lg font-semibold text-slate-900 mb-4">Tóm Tắt Đơn Hàng</h2>
                        <div class="flex justify-between py-2 border-b border-slate-200">
                            <span class="text-slate-600">Tạm tính:</span>
                            <span id="subtotal" th:text="${firstShopSubtotal != null ? #numbers.formatDecimal(firstShopSubtotal, 0, 'POINT', 0, 'POINT') + ' VNĐ' : '0 VNĐ'}">0 VNĐ</span>
                        </div>
                        <div class="mt-4">
                            <label for="shippingFee" class="block text-sm font-medium text-slate-700 mb-1">Phí Vận Chuyển (VNĐ)</label>
                            <input type="number" id="shippingFee" th:field="*{shippingFee}" min="0" step="1000" value="0" readonly class="w-full rounded-lg border border-slate-300 px-4 py-2 bg-slate-50">
                            <small class="text-slate-500 text-xs mt-1 block">Phí được tính tự động khi bạn chọn địa chỉ.</small>
                        </div>
                        <div class="flex justify-between py-3 mt-4 text-xl font-semibold text-primary-600 border-t-2 border-slate-200">
                            <span>Tổng tiền:</span>
                            <span id="totalPrice">0 VNĐ</span>
                        </div>
                        <button type="submit" class="w-full mt-4 py-2.5 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition">Đặt Hàng</button>
                        <a th:href="@{/cart}" class="block mt-3 text-center no-underline py-2.5 rounded-lg border-2 border-slate-300 text-slate-700 font-medium hover:bg-slate-50 transition">Quay Lại Giỏ Hàng</a>
                    </div>
                </div>
            </div>
        </form>

        <script th:inline="javascript">
            const csrfToken = /*[[${_csrf.token}]]*/ '';
            const csrfHeader = /*[[${_csrf.headerName}]]*/ '';
            const shopId = /*[[${firstShop != null ? firstShop.id : ''}]]*/ '';
            const provinceSelect = document.getElementById('provinceSelect');
            const districtSelect = document.getElementById('districtSelect');
            const wardSelect = document.getElementById('wardSelect');

            function calculateTotal() {
                const subtotalText = document.getElementById('subtotal').textContent.trim();
                const subtotal = parseFloat(subtotalText.replace(/[^0-9]/g, '')) || 0;
                const shippingFee = parseFloat(document.getElementById('shippingFee').value) || 0;
                const total = subtotal + shippingFee;
                document.getElementById('totalPrice').textContent = total.toLocaleString('vi-VN') + ' VNĐ';
            }

            function loadProvinces() {
                fetch('/api/shipping/provinces').then(r => r.json()).then(provinces => {
                    provinceSelect.innerHTML = '<option value="">-- Chọn Tỉnh/Thành phố --</option>';
                    provinces.forEach(p => { const o = document.createElement('option'); o.value = p.ProvinceID; o.textContent = p.ProvinceName; provinceSelect.appendChild(o); });
                }).catch(() => { provinceSelect.innerHTML = '<option value="">Lỗi khi tải danh sách tỉnh/thành</option>'; });
            }

            provinceSelect.addEventListener('change', function() {
                const provinceId = this.value;
                districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
                wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
                districtSelect.disabled = true; wardSelect.disabled = true;
                document.getElementById('toDistrictId').value = ''; document.getElementById('toWardCode').value = '';
                document.getElementById('shippingDistrict').value = ''; document.getElementById('shippingWard').value = '';
                if (!provinceId) return;
                districtSelect.disabled = false;
                fetch('/api/shipping/districts?provinceId=' + provinceId).then(r => r.json()).then(districts => {
                    districts.forEach(d => { const o = document.createElement('option'); o.value = d.DistrictID; o.textContent = d.DistrictName; districtSelect.appendChild(o); });
                }).catch(() => { districtSelect.innerHTML = '<option value="">Lỗi tải quận/huyện</option>'; });
            });

            districtSelect.addEventListener('change', function() {
                const districtId = this.value;
                wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
                wardSelect.disabled = true;
                document.getElementById('toDistrictId').value = ''; document.getElementById('toWardCode').value = ''; document.getElementById('shippingWard').value = '';
                if (!districtId) return;
                wardSelect.disabled = false;
                fetch('/api/shipping/wards?districtId=' + districtId).then(r => r.json()).then(wards => {
                    wards.forEach(w => { const o = document.createElement('option'); o.value = w.WardCode; o.textContent = w.WardName; wardSelect.appendChild(o); });
                }).catch(() => { wardSelect.innerHTML = '<option value="">Lỗi tải phường/xã</option>'; });
            });

            wardSelect.addEventListener('change', function() {
                const districtId = districtSelect.value;
                const wardCode = this.value;
                document.getElementById('toDistrictId').value = districtId;
                document.getElementById('toWardCode').value = wardCode;
                document.getElementById('shippingDistrict').value = districtSelect.options[districtSelect.selectedIndex].text;
                document.getElementById('shippingWard').value = this.options[this.selectedIndex].text;
                if (!districtId || !wardCode) return;
                const msg = document.getElementById('shippingFeeMessage');
                msg.innerHTML = '<span class="text-slate-500">Đang tính phí...</span>';
                fetch('/api/shipping/calculate-fee', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                    body: JSON.stringify({ shopId: shopId, toDistrictId: parseInt(districtId), toWardCode: wardCode })
                }).then(r => r.json()).then(data => {
                    if (data.success) {
                        document.getElementById('shippingFee').value = data.shippingFee;
                        calculateTotal();
                        msg.innerHTML = '<span class="text-green-600">✓ Phí vận chuyển: ' + data.shippingFee.toLocaleString('vi-VN') + ' VNĐ</span>';
                    } else msg.innerHTML = '<span class="text-red-600">✗ ' + data.message + '</span>';
                }).catch(() => { msg.innerHTML = '<span class="text-red-600">✗ Lỗi tính phí. Thử lại.</span>'; });
            });

            document.querySelector('form').addEventListener('submit', function(e) {
                if (!document.getElementById('toDistrictId').value || !document.getElementById('toWardCode').value) {
                    e.preventDefault();
                    alert('Vui lòng chọn đầy đủ Tỉnh/Thành phố, Quận/Huyện và Phường/Xã.');
                    return false;
                }
            });

            window.addEventListener('load', function() { loadProvinces(); calculateTotal(); });
        </script>
    </th:block>
</body>
</html>
