<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Cập Nhật Đơn Hàng - E-Market VIP</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <div class="mb-10 text-center">
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight mb-4">Cập Nhật Giao Hàng</h1>
        <div class="flex items-center justify-center max-w-sm mx-auto">
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-500 flex items-center justify-center font-bold text-sm shadow-sm border border-emerald-200 mb-2"><i class="fa-solid fa-check"></i></div><span class="text-[11px] font-bold text-slate-400">Giỏ hàng</span></div>
            <div class="w-16 h-1 bg-emerald-400 mx-2 rounded-full mb-6"></div>
            <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold shadow-lg mb-1 border-[3px] border-blue-200"><i class="fa-solid fa-pen-to-square"></i></div><span class="text-xs font-black text-slate-900">Cập nhật</span></div>
            <div class="w-16 h-1 bg-slate-200 mx-2 rounded-full mb-6"></div>
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm border border-slate-200 mb-2"><i class="fa-solid fa-credit-card"></i></div><span class="text-[11px] font-bold text-slate-400">Thanh toán</span></div>
        </div>
    </div>

    <div th:if="${error}" class="rounded-2xl p-5 mb-8 bg-rose-50 border border-rose-100 flex items-center gap-3 shadow-sm text-rose-800 font-medium"><i class="fa-solid fa-triangle-exclamation text-xl"></i> <span th:text="${error}"></span></div>
    <div th:if="${success}" class="rounded-2xl p-5 mb-8 bg-emerald-50 border border-emerald-100 flex items-center gap-3 shadow-sm text-emerald-800 font-medium"><i class="fa-solid fa-circle-check text-xl"></i> <span th:text="${success}"></span></div>

    <form th:action="@{/orders/{id}/update-checkout(id=${order.id})}" method="post" th:object="${updateOrderRequest}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="lg:grid lg:grid-cols-[1fr_420px] gap-8 xl:gap-10 items-start">

            <div class="space-y-8">
                <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 overflow-hidden relative">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-amber-400 to-orange-500"></div>
                    <div class="p-6 sm:p-8">
                        <h2 class="text-xl font-extrabold text-slate-900 mb-6 flex items-center gap-3"><i class="fa-solid fa-location-dot text-amber-500"></i> Địa chỉ nhận hàng (Chỉnh sửa)</h2>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="md:col-span-2">
                                <label class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Họ và Tên *</label>
                                <input type="text" th:field="*{shippingName}" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Số Điện Thoại *</label>
                                <input type="tel" th:field="*{shippingPhone}" pattern="[0-9]{9,11}" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Tỉnh/Thành phố *</label>
                                <select id="provinceSelect" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all cursor-pointer"><option value="">-- Chọn Tỉnh/TP --</option></select>
                            </div>
                            <div>
                                <label class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Quận/Huyện *</label>
                                <select id="districtSelect" required disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none transition-all disabled:opacity-60 disabled:cursor-not-allowed"><option value="">-- Chọn Quận/Huyện --</option></select>
                            </div>
                            <div>
                                <label class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Phường/Xã *</label>
                                <select id="wardSelect" required disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none transition-all disabled:opacity-60 disabled:cursor-not-allowed"><option value="">-- Chọn Phường/Xã --</option></select>
                            </div>
                            <input type="hidden" id="shippingDistrict" name="shippingDistrict"><input type="hidden" id="shippingWard" name="shippingWard"><input type="hidden" id="toDistrictId" name="shippingDistrictId"><input type="hidden" id="toWardCode" name="shippingWardCode"><input type="hidden" id="shippingCity" th:field="*{shippingCity}">
                            <div class="md:col-span-2">
                                <label class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Địa chỉ cụ thể *</label>
                                <input type="text" th:field="*{shippingAddress}" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                            </div>
                            <div class="md:col-span-2 mt-2">
                                <label class="block text-[13px] font-black text-slate-600 uppercase tracking-wide mb-2">Ghi Chú</label>
                                <textarea th:field="*{notes}" rows="3" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${firstShop != null}" class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-6 sm:p-8">
                    <div class="flex items-center gap-2 mb-4 pb-4 border-b border-slate-200/60">
                        <i class="fa-solid fa-store text-blue-600"></i><span class="font-black text-slate-800 uppercase tracking-wide text-sm" th:text="${firstShop.name}">Shop Name</span>
                    </div>
                    <input type="hidden" th:name="shopId" th:value="${firstShop.id}">
                    <div class="space-y-4">
                        <div th:each="item : ${itemsByShop[firstShop]}" class="flex gap-4 items-center">
                            <div class="w-16 h-16 rounded-xl overflow-hidden bg-white border border-slate-200 shrink-0"><img th:src="${productImageUrls != null and productImageUrls[item.product.id] != null ? productImageUrls[item.product.id] : '/images/placeholder.png'}" class="w-full h-full object-cover"></div>
                            <div class="flex-1 min-w-0 flex justify-between items-center gap-4">
                                <div>
                                    <h4 class="font-extrabold text-slate-900 text-sm line-clamp-1" th:text="${item.product.name}">Name</h4>
                                    <div th:if="${item.variant != null}" class="text-[11px] font-bold text-slate-500 mt-1 bg-slate-50 border border-slate-200 inline-block px-2 py-0.5 rounded" th:text="${item.variant.name + ': ' + item.variant.value}">Variant</div>
                                </div>
                                <div class="text-right shrink-0">
                                    <div class="text-sm font-black text-slate-800" th:text="|${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'POINT')} ₫|">Price</div>
                                    <div class="text-[11px] font-bold text-slate-500 mt-1">SL: <span th:text="${item.quantity}" class="text-slate-700">Qty</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:sticky lg:top-24">
                <div class="bg-slate-900 rounded-3xl shadow-xl border border-slate-800 p-8 text-white relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/20 rounded-full blur-2xl translate-x-1/2 -translate-y-1/2"></div>
                    <h2 class="text-xl font-extrabold mb-6 flex items-center gap-2 relative z-10"><i class="fa-solid fa-pen-to-square text-amber-400"></i> Cập Nhật Hóa Đơn</h2>
                    <div class="space-y-4 mb-6 pb-6 border-b border-slate-700/60 relative z-10">
                        <div class="flex justify-between items-center"><span class="text-slate-400 font-medium text-sm">Tiền hàng:</span><span id="subtotal" class="font-bold" th:text="${firstShopSubtotal != null ? #numbers.formatDecimal(firstShopSubtotal, 0, 'POINT', 0, 'POINT') + ' ₫' : '0 ₫'}">0 ₫</span></div>
                        <div>
                            <div class="flex justify-between items-center mb-2"><span class="text-slate-400 font-medium text-sm">Phí vận chuyển</span><span id="shippingFeeDisplay" class="font-bold text-amber-400">Đang tính lại...</span></div>
                            <input type="hidden" id="shippingFee" th:field="*{shippingFee}" value="0">
                            <div id="shippingFeeMessage" class="text-[11px] font-medium min-h-[16px] text-right"></div>
                        </div>
                    </div>
                    <div class="flex justify-between items-end mb-8 relative z-10">
                        <span class="text-sm font-bold uppercase tracking-wider text-slate-300">Tổng Thanh Toán</span>
                        <span id="totalPrice" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-yellow-200">0 ₫</span>
                    </div>
                    <button type="submit" class="w-full py-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-900 font-black text-lg shadow-[0_6px_20px_rgba(245,158,11,0.4)] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2 relative z-10">
                        <i class="fa-solid fa-save text-sm"></i> Lưu Lại & Tiếp Tục
                    </button>
                    <div class="mt-5 text-center relative z-10"><a th:href="@{'/payments/' + ${order.id}}" class="text-[13px] font-bold text-slate-400 hover:text-white transition-colors">Hủy thao tác, quay về Thanh toán</a></div>
                </div>
            </div>
        </div>
    </form>

    <script th:inline="javascript">
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';

        const provinceSelect = document.getElementById('provinceSelect');
        const districtSelect = document.getElementById('districtSelect');
        const wardSelect = document.getElementById('wardSelect');

        // Lấy sẵn tiền hàng cơ bản
        const subtotalText = document.getElementById('subtotal').textContent.trim();
        const subtotal = parseFloat(subtotalText.replace(/[^0-9]/g, '')) || 0;

        // ĐÂY CHÍNH LÀ HÀM BỊ THIẾU LÚC NÃY!
        function calculateTotal() {
            const shippingFee = parseFloat(document.getElementById('shippingFee').value) || 0;
            const total = subtotal + shippingFee;
            document.getElementById('totalPrice').textContent = total.toLocaleString('vi-VN') + ' ₫';

            const feeDisplay = document.getElementById('shippingFeeDisplay');
            if(shippingFee > 0) {
                feeDisplay.textContent = '+ ' + shippingFee.toLocaleString('vi-VN') + ' ₫';
                feeDisplay.className = 'font-bold text-white';
            } else if(provinceSelect.value && districtSelect.value && wardSelect.value) {
                feeDisplay.textContent = 'Miễn phí';
                feeDisplay.className = 'font-bold text-amber-400';
            } else {
                feeDisplay.textContent = 'Chờ cập nhật...';
                feeDisplay.className = 'font-bold text-slate-500';
            }
        }

        function loadProvinces() {
            fetch('/api/shipping/provinces')
                .then(r => r.json())
                .then(provinces => {
                    provinceSelect.innerHTML = '<option value="">-- Chọn Tỉnh/TP --</option>';
                    provinces.forEach(p => { const o = document.createElement('option'); o.value = p.ProvinceID; o.textContent = p.ProvinceName; provinceSelect.appendChild(o); });
                }).catch(()=>{});
        }

        provinceSelect.addEventListener('change', function() {
            districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
            districtSelect.disabled = true; wardSelect.disabled = true;

            if (!this.value) return;

            districtSelect.disabled = false;
            fetch('/api/shipping/districts?provinceId=' + this.value)
                .then(r => r.json())
                .then(districts => {
                    districts.forEach(d => { const o = document.createElement('option'); o.value = d.DistrictID; o.textContent = d.DistrictName; districtSelect.appendChild(o); });
                });
        });

        districtSelect.addEventListener('change', function() {
            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
            wardSelect.disabled = true;

            if (!this.value) return;

            wardSelect.disabled = false;
            fetch('/api/shipping/wards?districtId=' + this.value)
                .then(r => r.json())
                .then(wards => {
                    wards.forEach(w => { const o = document.createElement('option'); o.value = w.WardCode; o.textContent = w.WardName; wardSelect.appendChild(o); });
                });
        });

        // Thêm biến orderId ở đầu script
        const orderId = /*[[${order.id}]]*/ '';

        wardSelect.addEventListener('change', function() {
            if (!districtSelect.value || !this.value) return;

            // Lưu data ẩn
            document.getElementById('toDistrictId').value = districtSelect.value;
            document.getElementById('toWardCode').value = this.value;
            document.getElementById('shippingCity').value = provinceSelect.options[provinceSelect.selectedIndex].text;
            document.getElementById('shippingDistrict').value = districtSelect.options[districtSelect.selectedIndex].text;
            document.getElementById('shippingWard').value = this.options[this.selectedIndex].text;

            const msg = document.getElementById('shippingFeeMessage');
            msg.innerHTML = '<span class="text-amber-500 italic flex items-center justify-end gap-1"><i class="fa-solid fa-circle-notch fa-spin text-[10px]"></i> Đang tính lại phí giao hàng...</span>';

            // Lấy CSRF an toàn trực tiếp từ HTML Form
            const safeCsrfToken = csrfToken;
            const actualHeaderName = csrfHeader ? csrfHeader : 'X-CSRF-TOKEN';

            // GỌI API MỚI DÀNH RIÊNG CHO ĐƠN HÀNG
            fetch('/orders/' + orderId + '/calculate-fee', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [actualHeaderName]: safeCsrfToken
                },
                body: JSON.stringify({ toDistrictId: parseInt(districtSelect.value), toWardCode: this.value })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('shippingFee').value = data.shippingFee;
                        calculateTotal(); // BÂY GIỜ HÀM NÀY ĐÃ TỒN TẠI!
                        msg.innerHTML = '<span class="text-emerald-500 font-bold"><i class="fa-solid fa-truck-fast"></i> Phí giao hàng đã được cập nhật!</span>';
                    } else {
                        document.getElementById('shippingFee').value = 0;
                        calculateTotal();
                        msg.innerHTML = '<span class="text-rose-500 font-bold">✗ Lỗi: ' + (data.message || 'Không thể tính phí') + '</span>';
                    }
                })
                .catch(e => {
                    console.error("Chi tiết lỗi JS/Mạng:", e);
                    msg.innerHTML = '<span class="text-rose-500 font-bold">✗ Lỗi xử lý dữ liệu. Vui lòng thử lại.</span>';
                });
        });

        document.querySelector('form').addEventListener('submit', function(e) {
            if (!document.getElementById('toDistrictId').value || !document.getElementById('toWardCode').value) {
                e.preventDefault();
                alert('Vui lòng chọn đầy đủ Tỉnh/Thành phố, Quận/Huyện và Phường/Xã để lưu địa chỉ.');
                return false;
            }
        });

        window.addEventListener('load', function() {
            loadProvinces();
            // Set tổng tiền ban đầu (khi chưa đổi địa chỉ)
            const initialFee = parseFloat(document.getElementById('shippingFee').value) || 0;
            document.getElementById('totalPrice').textContent = (subtotal + initialFee).toLocaleString('vi-VN') + ' ₫';
            if(initialFee > 0) {
                document.getElementById('shippingFeeDisplay').textContent = '+ ' + initialFee.toLocaleString('vi-VN') + ' ₫';
                document.getElementById('shippingFeeDisplay').className = 'font-bold text-white';
            }
        });
    </script>
</th:block>
</body>
</html>
