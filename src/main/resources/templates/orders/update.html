<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Thanh Toán - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold text-slate-900 mb-6">Thanh Toán</h1>

            <div th:if="${error}" class="rounded-lg p-4 mb-4 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
            <div th:if="${success}" class="rounded-lg p-4 mb-4 bg-green-50 text-green-800 text-sm" th:text="${success}"></div>

            <form th:action="@{/orders/{id}/update-checkout(id=${order.id})}" method="post" th:object="${updateOrderRequest}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="grid grid-cols-1 lg:grid-cols-[1fr_400px] gap-8">
                    <div>
                        <div class="rounded-xl bg-white border border-slate-200 shadow-sm p-6 mb-6">
                            <h2 class="text-lg font-semibold text-slate-900 mb-4">Thông Tin Giao Hàng</h2>

                            <div class="space-y-4">
                                <div>
                                    <label for="shippingName" class="block text-sm font-medium text-slate-700 mb-1">Họ và Tên *</label>
                                    <input type="text" id="shippingName" th:field="*{shippingName}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                </div>
                                <div>
                                    <label for="shippingPhone" class="block text-sm font-medium text-slate-700 mb-1">Số Điện Thoại *</label>
                                    <input type="tel" id="shippingPhone" th:field="*{shippingPhone}" pattern="[0-9]{10,11}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                </div>
                                <div>
                                    <label for="shippingAddress" class="block text-sm font-medium text-slate-700 mb-1">Địa Chỉ *</label>
                                    <input type="text" id="shippingAddress" th:field="*{shippingAddress}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                </div>
                                <div>
                                    <label for="shippingCity" class="block text-sm font-medium text-slate-700 mb-1">Thành Phố</label>
                                    <input type="text" id="shippingCity" th:field="*{shippingCity}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                </div>
                                <div>
                                    <label for="provinceSelect" class="block text-sm font-medium text-slate-700 mb-1">Tỉnh/Thành phố *</label>
                                    <select id="provinceSelect" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                        <option value="">-- Chọn Tỉnh/Thành phố --</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="districtSelect" class="block text-sm font-medium text-slate-700 mb-1">Quận/Huyện *</label>
                                    <select id="districtSelect" required disabled class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 disabled:bg-slate-100">
                                        <option value="">-- Chọn Quận/Huyện --</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="wardSelect" class="block text-sm font-medium text-slate-700 mb-1">Phường/Xã *</label>
                                    <select id="wardSelect" required disabled class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 disabled:bg-slate-100">
                                        <option value="">-- Chọn Phường/Xã --</option>
                                    </select>
                                </div>
                                <input type="hidden" id="shippingDistrict" name="shippingDistrict">
                                <input type="hidden" id="shippingWard" name="shippingWard">
                                <input type="hidden" id="toDistrictId" name="shippingDistrictId">
                                <input type="hidden" id="toWardCode" name="shippingWardCode">
                                <div>
                                    <div id="shippingFeeMessage" class="mt-2 text-sm min-h-[1.5rem]"></div>
                                </div>
                                <div>
                                    <label for="notes" class="block text-sm font-medium text-slate-700 mb-1">Ghi Chú</label>
                                    <textarea id="notes" th:field="*{notes}" placeholder="Ghi chú cho người bán (tùy chọn)" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 min-h-[80px]"></textarea>
                                </div>
                            </div>
                        </div>

                        <div th:if="${firstShop != null}" class="rounded-xl bg-white border border-slate-200 shadow-sm p-6">
                            <h3 class="font-semibold text-primary-600 mb-4" th:text="'Shop: ' + ${firstShop.name}">Shop Name</h3>
                            <input type="hidden" th:name="shopId" th:value="${firstShop.id}">
                            <input type="hidden" id="shippingDistrictId" name="shippingDistrictId">
                            <input type="hidden" id="shippingWardCode" name="shippingWardCode">
                            <div class="space-y-4">
                                <div th:each="item : ${itemsByShop[firstShop]}" class="flex gap-4 py-4 border-b border-slate-100 last:border-0">
                                    <img src="/images/placeholder.png" alt="Product" class="w-20 h-20 object-cover rounded-lg flex-shrink-0">
                                    <div class="flex-1 min-w-0">
                                        <div class="font-medium text-slate-900" th:text="${item.product.name}">Product Name</div>
                                        <div th:if="${item.variant != null}" class="text-slate-500 text-sm mt-0.5" th:text="${item.variant.name + ': ' + item.variant.value}">Variant</div>
                                        <div class="text-primary-600 font-medium mt-1">
                                            <span th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'POINT')} + ' VNĐ'">Price</span>
                                            <span> x </span>
                                            <span th:text="${item.quantity}">Quantity</span>
                                            <span> = </span>
                                            <span th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'POINT', 0, 'POINT')} + ' VNĐ'">Total</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="rounded-xl bg-white border border-slate-200 shadow-sm p-6 sticky top-6">
                            <h2 class="text-lg font-semibold text-slate-900 mb-4">Tóm Tắt Đơn Hàng</h2>
                            <div class="flex justify-between py-3 border-b border-slate-100">
                                <span class="text-slate-600">Tạm tính:</span>
                                <span id="subtotal" th:text="${firstShopSubtotal != null ? #numbers.formatDecimal(firstShopSubtotal, 0, 'POINT', 0, 'POINT') + ' VNĐ' : '0 VNĐ'}">0 VNĐ</span>
                            </div>
                            <div class="pt-4">
                                <label for="shippingFee" class="block text-sm font-medium text-slate-700 mb-1">Phí Vận Chuyển (VNĐ)</label>
                                <input type="number" id="shippingFee" th:field="*{shippingFee}" min="0" step="1000" value="0" readonly class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-slate-100">
                                <p class="text-slate-500 text-sm mt-1">Phí sẽ được tính tự động khi bạn chọn địa chỉ.</p>
                            </div>
                            <div class="flex justify-between py-3 mt-4 pt-4 border-t-2 border-slate-200 text-lg font-semibold text-primary-600">
                                <span>Tổng tiền:</span>
                                <span id="totalPrice">0 VNĐ</span>
                            </div>
                            <button type="submit" class="w-full mt-6 py-3 px-4 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 border-0 cursor-pointer">Đặt Hàng</button>
                            <a href="/cart" class="block w-full mt-3 py-3 px-4 rounded-lg border border-slate-300 text-slate-700 font-medium text-center hover:bg-slate-50 no-underline">Quay Lại Giỏ Hàng</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <script th:inline="javascript">
            const csrfToken = /*[[${_csrf.token}]]*/ '';
            const csrfHeader = /*[[${_csrf.headerName}]]*/ '';
            const shopId = /*[[${firstShop != null ? firstShop.id : ''}]]*/ '';
            const provinceSelect = document.getElementById('provinceSelect');
            const districtSelect = document.getElementById('districtSelect');
            const wardSelect = document.getElementById('wardSelect');

            function calculateTotal() {
                const subtotalText = document.getElementById('subtotal').textContent.trim();
                const subtotal = parseFloat(subtotalText.replace(/[^0-9]/g, '')) || 0;
                const shippingFee = parseFloat(document.getElementById('shippingFee').value) || 0;
                const total = subtotal + shippingFee;
                document.getElementById('totalPrice').textContent = total.toLocaleString('vi-VN') + ' VNĐ';
            }

            function loadProvinces() {
                fetch('/api/shipping/provinces')
                    .then(function(r) { return r.json(); })
                    .then(function(provinces) {
                        provinceSelect.innerHTML = '<option value="">-- Chọn Tỉnh/Thành phố --</option>';
                        provinces.forEach(function(p) {
                            var opt = document.createElement('option');
                            opt.value = p.ProvinceID;
                            opt.textContent = p.ProvinceName;
                            provinceSelect.appendChild(opt);
                        });
                    })
                    .catch(function() {
                        provinceSelect.innerHTML = '<option value="">Lỗi khi tải danh sách tỉnh/thành</option>';
                    });
            }

            provinceSelect.addEventListener('change', function() {
                var provinceId = this.value;
                districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
                wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
                districtSelect.disabled = true;
                wardSelect.disabled = true;
                document.getElementById('toDistrictId').value = '';
                document.getElementById('toWardCode').value = '';
                document.getElementById('shippingDistrict').value = '';
                document.getElementById('shippingWard').value = '';
                if (!provinceId) return;
                districtSelect.disabled = false;
                fetch('/api/shipping/districts?provinceId=' + provinceId)
                    .then(function(r) { return r.json(); })
                    .then(function(districts) {
                        districts.forEach(function(d) {
                            var opt = document.createElement('option');
                            opt.value = d.DistrictID;
                            opt.textContent = d.DistrictName;
                            districtSelect.appendChild(opt);
                        });
                    })
                    .catch(function() {
                        districtSelect.innerHTML = '<option value="">Lỗi khi tải quận/huyện</option>';
                    });
            });

            districtSelect.addEventListener('change', function() {
                var districtId = this.value;
                wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
                wardSelect.disabled = true;
                document.getElementById('toWardCode').value = '';
                document.getElementById('shippingWard').value = '';
                if (!districtId) return;
                wardSelect.disabled = false;
                fetch('/api/shipping/wards?districtId=' + districtId)
                    .then(function(r) { return r.json(); })
                    .then(function(wards) {
                        wards.forEach(function(w) {
                            var opt = document.createElement('option');
                            opt.value = w.WardCode;
                            opt.textContent = w.WardName;
                            wardSelect.appendChild(opt);
                        });
                    })
                    .catch(function() {
                        wardSelect.innerHTML = '<option value="">Lỗi khi tải phường/xã</option>';
                    });
            });

            wardSelect.addEventListener('change', function() {
                var districtId = districtSelect.value;
                var wardCode = this.value;
                var districtName = districtSelect.options[districtSelect.selectedIndex].text;
                var wardName = this.options[this.selectedIndex].text;
                if (!districtId || !wardCode) return;
                document.getElementById('toDistrictId').value = districtId;
                document.getElementById('toWardCode').value = wardCode;
                document.getElementById('shippingDistrict').value = districtName;
                document.getElementById('shippingWard').value = wardName;
                var messageDiv = document.getElementById('shippingFeeMessage');
                if (!shopId) {
                    messageDiv.innerHTML = '<span class="text-red-600">Không tìm thấy shop</span>';
                    return;
                }
                messageDiv.innerHTML = '<span class="text-slate-500">Đang tính phí vận chuyển...</span>';
                fetch('/api/shipping/calculate-fee', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                    body: JSON.stringify({ shopId: shopId, toDistrictId: parseInt(districtId), toWardCode: wardCode })
                })
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.success) {
                            document.getElementById('shippingFee').value = data.shippingFee;
                            calculateTotal();
                            messageDiv.innerHTML = '<span class="text-green-600">Phí vận chuyển: ' + data.shippingFee.toLocaleString('vi-VN') + ' VNĐ</span>';
                        } else {
                            messageDiv.innerHTML = '<span class="text-red-600">' + data.message + '</span>';
                        }
                    })
                    .catch(function() {
                        messageDiv.innerHTML = '<span class="text-red-600">Lỗi khi tính phí. Vui lòng thử lại.</span>';
                    });
            });

            document.querySelector('form').addEventListener('submit', function(e) {
                var toDistrictId = document.getElementById('toDistrictId').value;
                var toWardCode = document.getElementById('toWardCode').value;
                if (!toDistrictId || !toWardCode) {
                    e.preventDefault();
                    alert('Vui lòng chọn đầy đủ Tỉnh/Thành phố, Quận/Huyện và Phường/Xã.');
                    return false;
                }
                document.getElementById('shippingDistrictId').value = toDistrictId;
                document.getElementById('shippingWardCode').value = toWardCode;
            });

            window.addEventListener('load', function() {
                loadProvinces();
                calculateTotal();
            });
        </script>
    </th:block>
</body>
</html>
