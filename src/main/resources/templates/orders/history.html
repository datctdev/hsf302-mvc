<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đơn Hàng - E-commerce</title>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">

    <style>
        .order-actions-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 12px;
        }

        .order-actions-left {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .order-actions-right {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .receive-status.success { color: #2e7d32; }
        .receive-status.pending { color: #ff9800; }

        .orders-container {
            max-width: 1100px;
            margin: auto;
        }

        .order-card {
            background: #fff;
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 22px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: 0.25s ease;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .order-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-PENDING_PAYMENT { background:#fff3cd; color:#ff9800; }
        .status-CONFIRMED { background:#e3f2fd; color:#1976d2; }
        .status-SHIPPING { background:#e8f5e9; color:#43a047; }
        .status-DELIVERED { background:#e8f5e9; color:#2e7d32; }
        .status-CANCELLED { background:#ffebee; color:#d32f2f; }

        .order-item-row {
            display: flex;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px dashed #eee;
        }

        .order-item-row:last-child { border-bottom: none; }

        .item-img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #eee;
        }

        .item-details { flex: 1; }

        .item-name {
            font-weight: 600;
            color: #222;
        }

        .item-name:hover { color: #2563eb; }

        .item-price-action {
            min-width: 150px;
            text-align: right;
        }

        .price-text {
            font-weight: 700;
            color: #e53935;
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #f9fafb;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 14px;
        }

        .order-info-item label {
            font-size: 12px;
            color: #777;
        }

        .order-info-item span {
            font-weight: 600;
        }

        .order-actions {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .btn-rate-shopee {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 18px;
            background: linear-gradient(135deg,#ff7043,#ff5722);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            transition: .25s;
        }

        .btn-rate-shopee:hover {
            opacity: .9;
            transform: translateY(-1px);
        }

        .empty-state {
            background: #fff;
            border-radius: 14px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        @media (max-width: 768px) {
            .order-item-row { flex-direction: column; }
            .item-price-action { text-align: left; }
            .order-info { grid-template-columns: 1fr; }
            .order-actions-flex { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>

<body>

<th:block th:replace="~{fragments/header :: header-simple}"></th:block>
<th:block th:replace="~{fragments/nav-home :: nav-home}"></th:block>

<main class="main-content">
    <div class="container">
        <div class="orders-container">

            <div class="page-title">
                <h1>Lịch Sử Đơn Hàng</h1>
                <p class="subtitle">Theo dõi đơn hàng của bạn</p>
            </div>

            <div th:if="${orders == null or orders.isEmpty()}" class="empty-state">
                <p>Bạn chưa có đơn hàng nào.</p>
                <a href="/products" class="btn btn-primary">Mua Sắm Ngay</a>
            </div>

            <div th:if="${orders != null and !orders.isEmpty()}">
                <div th:each="order : ${orders}" class="order-card">

                    <!-- HEADER -->
                    <div class="order-header">
                        <div>
                            <h3 th:text="'Đơn hàng: ' + ${order.orderNumber}"></h3>
                            <p th:text="'Ngày đặt: ' + ${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
                        </div>

                        <span class="order-status"
                              th:classappend="'status-' + ${order.status}"
                              th:text="${order.status}">
                        </span>
                    </div>

                    <!-- ITEMS -->
                    <div th:each="item : ${order.items}" class="order-item-row">
                        <img th:src="${item.productImageUrl != null ? item.productImageUrl : '/images/placeholder.png'}"
                             class="item-img">

                        <div class="item-details">
                            <a th:href="@{'/products/' + ${item.productId}}"
                               class="item-name"
                               th:text="${item.productName}">
                            </a>

                            <div th:if="${item.variantName != null}">
                                Phân loại:
                                <span th:text="${item.variantName + ' ' + item.variantValue}"></span>
                            </div>

                            <div>x<span th:text="${item.quantity}"></span></div>
                        </div>

                        <div class="item-price-action">
                            <div class="price-text"
                                 th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'POINT')} + ' ₫'">
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</main>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script th:src="@{/js/common.js}"></script>

</body>
</html>
