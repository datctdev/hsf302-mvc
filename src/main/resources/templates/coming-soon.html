<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Chức Năng Đang Phát Triển - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-2xl mx-auto text-center">
            <div class="rounded-2xl bg-white border border-slate-200 shadow-sm p-8 sm:p-12">
                <div class="text-6xl mb-4">🚧</div>
                <h2 class="text-2xl font-bold text-slate-900 mb-3">Chức Năng Đang Phát Triển</h2>
                <p class="text-slate-600 mb-2">Chức năng này đang được phát triển và sẽ sớm có mặt trong các phiên bản tiếp theo.</p>
                <p class="text-slate-500 text-sm mb-6">Chúng tôi đang nỗ lực để mang đến trải nghiệm tốt nhất cho bạn.</p>

                <div class="rounded-lg bg-slate-50 border border-slate-100 px-4 py-3 mb-6">
                    <strong id="pageName" class="text-slate-700">Chức năng</strong>
                </div>

                <div id="featuresContainer" class="hidden text-left mb-6">
                    <h3 class="font-semibold text-slate-900 mb-2">Các tính năng sẽ được thêm vào:</h3>
                    <ul id="featuresList" class="list-disc list-inside text-slate-600 space-y-1"></ul>
                </div>

                <a href="#" id="backButton" class="no-underline inline-block px-6 py-3 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600">Quay Lại</a>
            </div>
        </div>

        <script>
            var pageFeatures = {
                'admin-users': { name: 'Quản Lý Users', backUrl: '/admin/dashboard', features: ['Xem danh sách tất cả người dùng', 'Tìm kiếm và lọc người dùng', 'Xem chi tiết thông tin người dùng', 'Khóa/Mở khóa tài khoản', 'Phân quyền người dùng', 'Xem lịch sử hoạt động'] },
                'admin-products': { name: 'Quản Lý Sản Phẩm', backUrl: '/admin/dashboard', features: ['Xem danh sách tất cả sản phẩm', 'Tìm kiếm và lọc sản phẩm', 'Xem chi tiết sản phẩm', 'Duyệt/Xóa sản phẩm', 'Quản lý danh mục sản phẩm', 'Thống kê sản phẩm'] },
                'admin-orders': { name: 'Quản Lý Đơn Hàng', backUrl: '/admin/dashboard', features: ['Xem danh sách tất cả đơn hàng', 'Tìm kiếm và lọc đơn hàng', 'Xem chi tiết đơn hàng', 'Cập nhật trạng thái đơn hàng', 'Thống kê doanh thu', 'Xuất báo cáo'] },
                'seller-products': { name: 'Quản Lý Sản Phẩm', backUrl: '/seller/shop', features: ['Thêm sản phẩm mới', 'Chỉnh sửa thông tin sản phẩm', 'Xóa sản phẩm', 'Quản lý kho hàng', 'Xem thống kê sản phẩm', 'Tối ưu hóa SEO'] },
                'seller-orders': { name: 'Quản Lý Đơn Hàng', backUrl: '/seller/shop', features: ['Xem danh sách đơn hàng', 'Cập nhật trạng thái đơn hàng', 'In hóa đơn', 'Thống kê doanh thu', 'Xuất báo cáo', 'Quản lý vận chuyển'] },
                'seller-statistics': { name: 'Thống Kê', backUrl: '/seller/shop', features: ['Thống kê doanh thu', 'Thống kê sản phẩm bán chạy', 'Thống kê khách hàng', 'Biểu đồ xu hướng', 'Xuất báo cáo', 'Phân tích hiệu suất'] }
            };
            document.addEventListener('DOMContentLoaded', function() {
                var path = window.location.pathname;
                var pageKey = '';
                if (path === '/admin/users') pageKey = 'admin-users';
                else if (path === '/admin/products') pageKey = 'admin-products';
                else if (path === '/admin/orders') pageKey = 'admin-orders';
                else if (path === '/seller/products') pageKey = 'seller-products';
                else if (path === '/seller/orders') pageKey = 'seller-orders';
                else if (path === '/seller/statistics') pageKey = 'seller-statistics';
                if (pageKey && pageFeatures[pageKey]) {
                    var info = pageFeatures[pageKey];
                    document.getElementById('pageName').textContent = info.name;
                    document.getElementById('backButton').href = info.backUrl;
                    if (info.features && info.features.length > 0) {
                        var list = document.getElementById('featuresList');
                        info.features.forEach(function(f) {
                            var li = document.createElement('li');
                            li.textContent = f;
                            list.appendChild(li);
                        });
                        document.getElementById('featuresContainer').classList.remove('hidden');
                    }
                } else {
                    document.getElementById('pageName').textContent = 'Chức năng';
                    document.getElementById('backButton').href = '/';
                }
            });
        </script>
    </th:block>
</body>
</html>
