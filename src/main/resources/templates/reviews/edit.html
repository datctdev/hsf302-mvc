<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Sửa Đánh Giá</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-xl mx-auto bg-white rounded-xl border border-slate-200 shadow-sm p-6 sm:p-8">
            <h2 class="text-xl font-semibold text-slate-900 text-center mb-6">Chỉnh Sửa Đánh Giá</h2>

            <form th:action="@{'/reviews/' + ${review.id} + '/edit'}" method="post" enctype="multipart/form-data" th:object="${updateReviewRequest}" class="space-y-6">
                <div th:if="${error}" class="rounded-lg p-3 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>

                <div class="text-center">
                    <div class="flex flex-row-reverse justify-center gap-1" aria-label="Đánh giá sao">
                        <input type="radio" id="star5" name="rating" value="5" th:checked="${review.rating == 5}" th:disabled="${!reviewPermission.allowed}" class="sr-only peer" /><label for="star5" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400">★</label>
                        <input type="radio" id="star4" name="rating" value="4" th:checked="${review.rating == 4}" th:disabled="${!reviewPermission.allowed}" class="sr-only peer" /><label for="star4" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400">★</label>
                        <input type="radio" id="star3" name="rating" value="3" th:checked="${review.rating == 3}" th:disabled="${!reviewPermission.allowed}" class="sr-only peer" /><label for="star3" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400">★</label>
                        <input type="radio" id="star2" name="rating" value="2" th:checked="${review.rating == 2}" th:disabled="${!reviewPermission.allowed}" class="sr-only peer" /><label for="star2" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400">★</label>
                        <input type="radio" id="star1" name="rating" value="1" th:checked="${review.rating == 1}" th:disabled="${!reviewPermission.allowed}" class="sr-only peer" /><label for="star1" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400">★</label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nội dung đánh giá:</label>
                    <textarea name="comment" rows="4" th:text="${review.comment}" th:readonly="${!reviewPermission.allowed}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 disabled:bg-slate-100"></textarea>
                </div>

                <div th:if="${not #lists.isEmpty(review.imageUrls)}">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Ảnh hiện tại (Sẽ được giữ nguyên):</label>
                    <div class="flex flex-wrap gap-2">
                        <img th:each="img : ${review.imageUrls}" th:src="${img}" class="w-14 h-14 object-cover rounded border border-slate-200" alt="Ảnh đánh giá">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Thêm ảnh mới (Tùy chọn):</label>
                    <input type="file" name="newImages" multiple accept="image/*" class="w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 disabled:opacity-50" th:disabled="${!reviewPermission.allowed}">
                </div>

                <div class="flex flex-wrap items-center gap-3 pt-2">
                    <a href="javascript:history.back()" class="flex-1 min-w-[120px] text-center no-underline py-3 px-4 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">Hủy</a>
                    <button type="submit" th:if="${reviewPermission.allowed}" class="flex-1 min-w-[120px] py-3 px-4 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 border-0">Cập Nhật</button>
                    <span th:if="${!reviewPermission.allowed}" class="text-red-600 text-sm">Bạn đang bị cấm đánh giá nên không thể chỉnh sửa</span>
                </div>
            </form>
        </div>
    </th:block>
</body>
</html>
