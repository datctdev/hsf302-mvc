<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Viết Đánh Giá</title>
</head>
<body>
    <th:block th:fragment="content">
        <div id="review-warning" th:if="${reviewWarning != null and reviewWarning.warning}" class="rounded-lg p-4 mb-6 bg-amber-50 border border-amber-300 text-amber-800 text-sm">
            <strong>Cảnh báo:</strong>
            <span th:text="${reviewWarning.message}"></span>
        </div>

        <div class="max-w-xl mx-auto bg-white rounded-xl border border-slate-200 shadow-sm p-6 sm:p-8">
            <h2 class="text-xl font-semibold text-slate-900 text-center mb-6">Đánh Giá Sản Phẩm</h2>

            <div class="flex gap-4 pb-6 mb-6 border-b border-slate-200">
                <img th:src="${product.images != null and !product.images.empty ? product.images[0].imageUrl : '/images/placeholder.png'}" alt="Product" class="w-20 h-20 object-cover rounded-lg flex-shrink-0">
                <div>
                    <h3 class="font-medium text-slate-900 m-0" th:text="${product.name}">Tên sản phẩm</h3>
                    <p class="text-slate-500 text-sm mt-1" th:text="${product.shopName}">Tên Shop</p>
                </div>
            </div>

            <form id="review-form" th:action="@{'/products/' + ${product.id} + '/review'}" method="post" enctype="multipart/form-data" th:object="${createReviewRequest}" class="space-y-6">
                <div th:if="${error}" class="rounded-lg p-3 bg-red-50 text-red-800 text-sm" th:text="${error}"></div>
                <input type="hidden" th:field="*{subOrderId}" />

                <div class="text-center">
                    <p class="mb-2 font-medium text-slate-700">Chất lượng sản phẩm thế nào?</p>
                    <div class="flex flex-row-reverse justify-center gap-1" aria-label="Đánh giá sao">
                        <input type="radio" id="star5" name="rating" value="5" th:field="*{rating}" class="sr-only peer" /><label for="star5" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400" title="Tuyệt vời">★</label>
                        <input type="radio" id="star4" name="rating" value="4" th:field="*{rating}" class="sr-only peer" /><label for="star4" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400" title="Hài lòng">★</label>
                        <input type="radio" id="star3" name="rating" value="3" th:field="*{rating}" class="sr-only peer" /><label for="star3" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400" title="Bình thường">★</label>
                        <input type="radio" id="star2" name="rating" value="2" th:field="*{rating}" class="sr-only peer" /><label for="star2" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400" title="Không hài lòng">★</label>
                        <input type="radio" id="star1" name="rating" value="1" th:field="*{rating}" class="sr-only peer" /><label for="star1" class="text-3xl text-slate-300 cursor-pointer peer-checked:text-amber-400 hover:text-amber-400" title="Tệ">★</label>
                    </div>
                    <small class="text-red-600 text-sm" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></small>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Chia sẻ cảm nhận của bạn:</label>
                    <textarea th:field="*{comment}" rows="4" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Hãy chia sẻ những điều bạn thích về sản phẩm này nhé..."></textarea>
                    <small class="text-red-600 text-sm" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></small>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Thêm hình ảnh (Tối đa 5 ảnh):</label>
                    <input type="file" name="images" multiple accept="image/*" class="w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200">
                </div>

                <div class="flex gap-3 pt-2">
                    <a href="/orders" class="flex-1 text-center no-underline py-3 px-4 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">Trở lại</a>
                    <button type="submit" class="flex-1 py-3 px-4 rounded-lg bg-primary-500 text-white font-medium hover:bg-primary-600 border-0">Gửi Đánh Giá</button>
                </div>
            </form>
        </div>

        <script th:if="${reviewWarning != null and reviewWarning.warning}">
            document.addEventListener("DOMContentLoaded", function () {
                var form = document.getElementById("review-form");
                var warning = document.getElementById("review-warning");
                if (!form || !warning) return;
                form.addEventListener("submit", function (e) {
                    if (!confirm("Tài khoản của bạn đã nhiều lần vi phạm nội dung đánh giá. Nếu tiếp tục vi phạm, bạn có thể bị cấm đánh giá.\n\nBạn vẫn muốn gửi đánh giá?")) e.preventDefault();
                });
            });
        </script>
    </th:block>
</body>
</html>
