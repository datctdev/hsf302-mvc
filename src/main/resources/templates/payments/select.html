<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Thanh toán đơn hàng - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-xl shadow-card p-6">
                <h2 class="text-xl font-bold text-slate-900 text-center mb-6">Thanh toán đơn hàng</h2>

                <div class="mb-6">
                    <p class="text-slate-600"><strong>Mã đơn:</strong> <span th:text="${order.orderNumber}"></span></p>
                    <p class="text-xl font-bold text-primary-600 mt-2">
                        Tổng tiền: <span th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')}"></span> ₫
                    </p>
                </div>

                <hr class="border-slate-200 my-6">

                <div class="space-y-4">
                    <form th:action="@{/payments/cod/confirm}" method="post" class="block">
                        <input type="hidden" name="orderId" th:value="${order.id}"/>
                        <button type="submit" class="w-full py-3 rounded-lg bg-green-600 text-white font-medium hover:bg-green-700 transition">
                            Thanh toán khi nhận hàng (COD)
                        </button>
                        <p class="text-slate-500 text-sm text-center mt-1">Thanh toán bằng tiền mặt khi nhận hàng</p>
                    </form>

                    <form th:action="@{/payments/vnpay/redirect}" method="get" class="block">
                        <input type="hidden" name="orderId" th:value="${order.id}"/>
                        <button type="submit" class="w-full py-3 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition">
                            Thanh toán qua VNPay
                        </button>
                        <p class="text-slate-500 text-sm text-center mt-1">Hỗ trợ ATM, Visa, QR Code</p>
                    </form>
                </div>

                <a th:href="@{'/orders/' + ${order.id} + '/edit-checkout'}" class="block mt-6 text-center no-underline py-2.5 rounded-lg border-2 border-slate-300 text-slate-700 font-medium hover:bg-slate-50 transition">
                    ← Quay lại checkout
                </a>
            </div>
        </div>
    </th:block>
</body>
</html>
