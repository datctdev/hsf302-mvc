<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title>Chọn Phương Thức Thanh Toán</title>
</head>
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <div class="mb-10 text-center">
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight mb-4">Phương Thức Thanh Toán</h1>
        <div class="flex items-center justify-center max-w-sm mx-auto">
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-500 flex items-center justify-center font-bold text-sm shadow-sm border border-emerald-200 mb-2"><i class="fa-solid fa-check"></i></div></div>
            <div class="w-16 h-1 bg-emerald-400 mx-2 rounded-full mb-6"></div>
            <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shadow-lg mb-1 border-[3px] border-blue-200"><i class="fa-solid fa-money-check-dollar"></i></div><span class="text-xs font-black text-blue-600">Thanh toán</span></div>
            <div class="w-16 h-1 bg-slate-200 mx-2 rounded-full mb-6"></div>
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm border border-slate-200 mb-2"><i class="fa-solid fa-flag-checkered"></i></div></div>
        </div>
    </div>

    <div class="max-w-2xl mx-auto">
        <div th:if="${error}" class="rounded-2xl p-5 mb-8 bg-rose-50 border border-rose-100 flex items-center gap-3 shadow-sm text-rose-800 font-medium"><i class="fa-solid fa-triangle-exclamation text-xl"></i> <span th:text="${error}"></span></div>

        <div class="bg-white rounded-3xl shadow-[0_10px_40px_rgb(0,0,0,0.06)] border border-slate-100 p-8 sm:p-12 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>

            <div class="text-center mb-10 pb-10 border-b border-slate-100">
                <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-2">Đơn hàng cần thanh toán</p>
                <div class="inline-block px-4 py-1.5 bg-slate-100 rounded-lg text-slate-700 font-mono font-bold text-sm border border-slate-200 mb-4" th:text="${order.orderNumber}">ORD-XXXX</div>
                <div class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600" th:text="|${#numbers.formatDecimal(order.total, 0, 'POINT', 0, 'POINT')} ₫|">0 ₫</div>
            </div>

            <div class="space-y-4">
                <form th:action="@{/payments/{id}/cod(id=${order.id})}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="w-full relative group border-2 border-emerald-500 bg-white hover:bg-emerald-50 text-emerald-700 rounded-2xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4 transition-all duration-200 cursor-pointer overflow-hidden">
                        <div class="flex items-center gap-4 z-10">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xl shadow-sm"><i class="fa-solid fa-hand-holding-dollar"></i></div>
                            <div class="text-left">
                                <div class="font-extrabold text-lg text-slate-800 group-hover:text-emerald-700 transition-colors">Thanh toán khi nhận hàng (COD)</div>
                                <div class="text-sm font-medium text-slate-500">Thanh toán bằng tiền mặt cho shipper</div>
                            </div>
                        </div>
                        <div class="w-8 h-8 rounded-full border-2 border-emerald-200 flex items-center justify-center text-emerald-500 bg-white opacity-0 group-hover:opacity-100 transition-opacity z-10"><i class="fa-solid fa-check text-sm"></i></div>
                    </button>
                </form>

                <form th:action="@{/payments/{id}/vnpay(id=${order.id})}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="w-full relative group border-2 border-blue-600 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4 transition-all duration-200 shadow-[0_8px_20px_rgba(37,99,235,0.3)] hover:shadow-[0_12px_25px_rgba(37,99,235,0.4)] transform hover:-translate-y-1 cursor-pointer overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>

                        <div class="flex items-center gap-4 z-10">
                            <div class="w-12 h-12 bg-white text-blue-600 rounded-full flex items-center justify-center text-xl shadow-sm"><i class="fa-solid fa-building-columns"></i></div>
                            <div class="text-left">
                                <div class="font-extrabold text-lg">Thanh toán qua VNPay</div>
                                <div class="text-sm font-medium text-blue-100">Hỗ trợ quét mã QR, thẻ ATM nội địa, Visa/Mastercard</div>
                            </div>
                        </div>
                        <div class="w-8 h-8 rounded-full border-2 border-white/50 flex items-center justify-center bg-blue-500/50 z-10"><i class="fa-solid fa-arrow-right text-sm"></i></div>
                    </button>
                </form>
            </div>

            <div class="mt-10 text-center">
                <a th:href="@{'/orders/' + ${order.id} + '/edit-checkout'}" class="inline-flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-blue-600 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> Lùi lại để sửa địa chỉ giao hàng
                </a>
            </div>
        </div>

        <div class="flex items-center justify-center gap-6 mt-8 text-slate-400 opacity-70">
            <i class="fa-brands fa-cc-visa text-3xl"></i>
            <i class="fa-brands fa-cc-mastercard text-3xl"></i>
            <i class="fa-brands fa-cc-paypal text-3xl"></i>
        </div>
    </div>

    <style>
        @keyframes shimmer { 100% { transform: translateX(100%); } }
    </style>
</th:block>
</body>
</html>
