<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base}">
<head>
    <title th:text="${shop != null ? shop.name + ' - Shop' : 'Shop'}">Shop - E-commerce</title>
</head>
<body>
    <th:block th:fragment="content">
        <div th:if="${shop != null}" class="max-w-6xl mx-auto">
            <div class="rounded-xl bg-white border border-slate-200 shadow-sm overflow-hidden mb-8">
                <div th:if="${shop.coverImageUrl != null}" class="max-h-48 overflow-hidden">
                    <img th:src="${shop.coverImageUrl}" alt="Cover" class="w-full h-48 object-cover">
                </div>
                <div class="p-6 sm:p-8">
                    <div class="flex flex-wrap gap-8 items-start">
                        <div class="w-28 h-28 rounded-xl overflow-hidden bg-slate-100 flex items-center justify-center text-4xl flex-shrink-0">
                            <img th:if="${shop.logoUrl != null}" th:src="${shop.logoUrl}" alt="Logo" class="w-full h-full object-cover">
                            <span th:unless="${shop.logoUrl != null}">🏪</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h1 class="text-2xl font-bold text-slate-900 mb-2" th:text="${shop.name}">Shop Name</h1>
                            <p class="text-slate-500 leading-relaxed mb-2" th:text="${shop.description ?: 'Chưa có mô tả'}">Mô tả shop</p>
                            <p th:if="${shop.phoneNumber != null}" class="text-slate-500 text-sm mt-1"><strong>Liên hệ:</strong> <span th:text="${shop.phoneNumber}"></span></p>
                            <p th:if="${shop.address != null}" class="text-slate-500 text-sm mt-1"><strong>Địa chỉ:</strong> <span th:text="${shop.address}"></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <h2 class="text-xl font-semibold text-slate-900 mb-4">Sản phẩm của shop</h2>

            <div th:if="${products == null or products.empty}" class="rounded-xl bg-white border border-slate-200 p-12 text-center text-slate-500">
                Shop chưa có sản phẩm nào.
            </div>

            <div th:if="${products != null and !products.empty}" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                <a th:each="product : ${products}" th:href="@{'/products/' + ${product.id}}" class="block rounded-xl bg-white border border-slate-200 overflow-hidden shadow-sm no-underline text-slate-900 hover:shadow-md hover:-translate-y-1 transition">
                    <img th:with="firstImg=${product.images != null and !product.images.empty ? product.images[0] : null}"
                         th:src="${firstImg != null ? firstImg.imageUrl : '/images/placeholder.png'}"
                         alt="Sản phẩm"
                         class="w-full h-48 object-cover bg-slate-100"
                         onerror="this.src='/images/placeholder.png'">
                    <div class="p-4">
                        <h3 class="font-semibold text-slate-900 line-clamp-2 mb-2" th:text="${product.name}">Product Name</h3>
                        <div class="text-lg font-bold text-primary-600" th:text="${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'POINT')} + ' đ'">0 đ</div>
                    </div>
                </a>
            </div>

            <div th:if="${productPage != null and productPage.totalPages > 1}" class="flex flex-wrap items-center gap-2 mt-8">
                <span th:if="${!productPage.first}">
                    <a th:href="@{/shops/{id}(id=${shop.id}, page=${productPage.number - 1}, size=${productPage.size})}" class="no-underline px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">Trước</a>
                </span>
                <span class="text-slate-600 text-sm" th:text="'Trang ' + (${productPage.number + 1}) + ' / ' + (${productPage.totalPages})">Trang</span>
                <span th:if="${!productPage.last}">
                    <a th:href="@{/shops/{id}(id=${shop.id}, page=${productPage.number + 1}, size=${productPage.size})}" class="no-underline px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">Sau</a>
                </span>
            </div>
        </div>
    </th:block>
</body>
</html>
